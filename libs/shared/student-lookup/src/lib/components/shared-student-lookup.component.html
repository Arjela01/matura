<p-table
  #dt
  dataKey="Id"
  responsiveLayout="scroll"
  [value]="students"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr  style="width: auto; font-weight: bolder ; font-size: 16px">
      <th style="width: 3rem"></th>
      <th pSortableColumn="studentId">
        Matura ID
        <p-sortIcon field="studentId"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="studentId"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="firstName">
        Emri
        <p-sortIcon field="firstName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="firstName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="middleName">
        Atësia
        <p-sortIcon field="middleName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="middleName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="lastName">
        Mbiemri
        <p-sortIcon field="lastName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="lastName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="idCard">
        NID
        <p-sortIcon field="idCard"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="idCard"
          display="menu"></p-columnFilter>
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <td>
        <button
          pButton
          pRipple
          icon="pi pi-check"
          class="p-button-rounded p-button-success p-button-text mr-2"
          pTooltip="Zgjidh"
          tooltipPosition="bottom"
          (click)="onStudentSelect(student)"></button>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.studentId }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.firstName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.middleName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.lastName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.idCard }}
      </td>
    </tr>
  </ng-template>
</p-table>
