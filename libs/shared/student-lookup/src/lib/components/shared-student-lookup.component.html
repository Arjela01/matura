<p-table
  #dt
  dataKey="Id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="students"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr class="column row">
      <th style="width: 3rem" class="row"></th>
      <th pSortableColumn="studentId" class="row">
        Matura ID
        <div class="flex">
          <p-sortIcon field="studentId"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="studentId"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="firstName" class="row">
        Emri
        <div class="flex">
          <p-sortIcon field="firstName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="firstName"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="middleName" class="row">
        Atësia
        <div class="flex">
          <p-sortIcon field="middleName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="middleName"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="lastName" class="row">
        Mbiemri
        <div class="flex">
          <p-sortIcon field="lastName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="lastName"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="idCard" class="row">
        NID
        <div class="flex">
          <p-sortIcon field="idCard"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="idCard"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="isFall">
        Vjeshtë
        <div class="flex">
          <p-sortIcon field="isFall"></p-sortIcon>
          <p-columnFilter
            type="boolean"
            field="isFall"
            matchMode="equals"
            display="menu"></p-columnFilter>
        </div>
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <td>
        <div>
          <p-button
            icon="pi pi-check"
            styleClass="p-button-outlined"
            (click)="onStudentSelect(student)"></p-button>
        </div>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.studentId }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.firstName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.middleName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.lastName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.idCard }}
      </td>
      <td style="width: 10%; min-width: 10rem">
        {{ student.isFall | app_bool }}
      </td>
    </tr>
  </ng-template>
</p-table>
