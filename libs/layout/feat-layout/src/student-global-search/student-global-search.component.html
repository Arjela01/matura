<div class="search-overlay" *ngIf="searchBoxVisible">
  <div class="search-container">
    <div class="search-input-container">
      <p-autoComplete
        [(ngModel)]="searchQuery"
        [suggestions]="searchResults"
        (completeMethod)="performSearch()"
        (onSelect)="onItemClick()"
        [className]="'w-full'"
        [delay]="500"
        [inputStyleClass]="'w-full search-input'"
        [panelStyleClass]="'w-full'"
        [styleClass]="'w-full'">
        <ng-template let-student pTemplate="item">
          {{student.studentId}} - {{student.firstName}} {{student.middleName}} {{student.lastName}} - {{student.idCard}}
        </ng-template>
      </p-autoComplete>
    </div>
  </div>
</div>
