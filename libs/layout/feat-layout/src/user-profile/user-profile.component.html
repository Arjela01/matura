<div class="user">
  <div class="first-group">
    <p-avatar
      class="avatar"
      label="{{ userProfile.firstName.charAt(0) }}{{
        userProfile.lastName.charAt(0)
      }}"
      shape="circle"
      size="xlarge">
    </p-avatar>
    <h4>{{ userProfile.userName }}</h4>
    <h6>{{ userProfile.email }}</h6>
  </div>
  <div class="second-group">
      <h6>
        Emri:
        <span class="span">{{ userProfile.firstName }}</span>
      </h6>
      <h6>
        Mbiemri:
        <span class="span">{{ userProfile.lastName }}</span>
      </h6>
    </div>
    <div>
      <h6>
        Eshte Aktiv?:
        <span class="span">{{ userProfile.isActive ? 'Po' : 'Jo' }}</span>
      </h6>
      <h6>
        Roli:
        <span class="span">{{ userProfile.roleName }}</span>
      </h6>
    </div>
</div>
