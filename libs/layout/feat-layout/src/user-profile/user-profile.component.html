<div class="user-profile">
  <div class="avatar mb-3">
    <div class="mb-2">
      <p-avatar
        class="avatar-circle mb-3"
        label="{{ userProfile.firstName.charAt(0) }}{{
          userProfile.lastName.charAt(0)
        }}"
        [style]="{
          background: '#101828'
        }"
        shape="circle">
      </p-avatar>
    </div>
    <div class="mb-3">
      <span>{{ userProfile.userName }}</span>
    </div>
    <div class="mb-3">
      <span>{{ userProfile.email }}</span>
    </div>
  </div>
  <div class="avatar-data mb-4">
    <div class="column">
      <p>
        Emri:
        <span>{{ userProfile.firstName }}</span>
      </p>
      <p>
        Mbiemri:
        <span>{{ userProfile.lastName }}</span>
      </p>
    </div>
    <div class="column1">
      <p>
        Eshte Aktiv?:
        <span>{{ userProfile.isActive ? 'Po' : 'Jo' }}</span>
      </p>
      <p>
        Roli:
        <span>{{ userProfile.roleName }}</span>
      </p>
    </div>
  </div>
  <div class="change-passw">
    <button
      type="button"
      pButton
      label="Ndrysho Fjalekalimin"
      class="password-button-text w-auto mr-2"
      (click)="toggleDisplayForm()"></button>
  </div>
