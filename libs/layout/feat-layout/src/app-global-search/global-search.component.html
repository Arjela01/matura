<div class="search-overlay" *ngIf="searchBoxVisible">
  <div class="search-container">
    <div class="search-input-container">
      <p-autoComplete
        [(ngModel)]="searchQuery"
        [suggestions]="searchResults"
        (completeMethod)="performSearch()"
        (onSelect)="onItemClick($event)"
        [className]="'w-full'"
        [delay]="0"
        [inputStyleClass]="'w-full search-input'"
        [panelStyleClass]="'w-full'"
        [styleClass]="'w-full'">
        <ng-template let-node pTemplate="item">
          {{ node.text }}
        </ng-template>
      </p-autoComplete>
    </div>
  </div>
</div>
