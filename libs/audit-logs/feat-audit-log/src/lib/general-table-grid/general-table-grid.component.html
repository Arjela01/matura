<div class="flex ml-2 mb-2 page-header mb-header">
  <h2 class="flex-1">Auditim</h2>
</div>

<div class="grid">
  <div class="col-12">
    <div class="card">
      <p-table [value]="auditTablesList" stateStorage="local"
               stateKey="gt-local" [paginator]="true" [rows]="10">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="tableName">
              Emri
              <p-sortIcon field="tableName"></p-sortIcon>
              <p-columnFilter
                type="text"
                field="tableName"
                display="menu"
                mshColumnFilterDirective></p-columnFilter>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-auditTable>
          <tr>
            <td (click)="navigateToTable(auditTable.queryName)">
              {{ auditTable.tableName }}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
