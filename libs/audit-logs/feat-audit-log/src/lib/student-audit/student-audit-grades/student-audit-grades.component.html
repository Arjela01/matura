<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card-form px-6 py-6">
      <ng-container *ngIf="grades && grades.length > 0; else noGrades">
        <div class="col-6">
          <table id="my-table-2">
            <thead>
            <tr>
              <th>Viti</th>
              <th>Tipi i Provimit</th>
              <th>Lënda e Provimit</th>
              <th>Nota</th>
              <th>ID</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let grade of grades">
              <td class="font-semibold">{{ grade.academicYearName }}</td>
              <td class="font-semibold">{{ grade.examTypeName }}</td>
              <td class="font-semibold">{{ grade.examSubjectName }}</td>
              <td class="font-semibold">{{ grade.grade }}</td>
              <td class="font-semibold">{{ grade.studentStudentId }}</td>
            </tr>
            </tbody>
          </table>
        </div>
      </ng-container>
      <ng-template #noGrades>
        <div class="col-12">
          <p>Nuk ka asnjë notë për këtë maturantë!</p>
        </div>
      </ng-template>
    </div>
  </div>
</div>
