<div class="flex mb-2 page-header center mb-header">
  <h2 class="flex-1">Maturantë ndër Vite</h2>
</div>

<div class="grid mt-3">
  <div class="col-12">
    <div class="card">
      <msh-student-audit-grid
        [students]="(studentAuditList$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getStudents($event)">
      </msh-student-audit-grid>
    </div>
  </div>
</div>
<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Të dhënat e Maturantit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-student-audit-form
      [studentDetails]="selectedStudent"
      (formClose)="onModalClose()"
      (formSave)="updateStudentData($event)">
    </msh-student-audit-form>
  </ng-template>
</p-dialog>
