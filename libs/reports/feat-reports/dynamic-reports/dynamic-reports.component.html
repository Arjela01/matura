<ng-container>
  <ng-container
    *ngIf="reports | reportFilter : reportName : 'reportName' as reportsResult">
    <div class="card-container">
      <div
        class="card"
        *ngFor="let report of reportsResult"
        (click)="onViewClick(report)">
        <div class="card-header">
          <span class="card-title">{{ report.reportName }}</span>
          <div class="svg-container">
            <img src="/assets/images/report.svg" class="mb-5" width="60%" />
          </div>
        </div>
      </div>
    </div>

    <p>
      <b>{{ reportsResult.length }} Raporte</b>
    </p>

    <p-paginator
      [rows]="10"
      [totalRecords]="reportName ? reportsResult.length : totalRecords"
      (onPageChange)="onPageChange($event)">
    </p-paginator>
  </ng-container>
</ng-container>
