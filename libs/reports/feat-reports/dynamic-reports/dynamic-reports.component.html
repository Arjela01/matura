<ng-container>
<div class="card-container cursor: pointer"  (click)="onViewClick(reports) ">
  <div class="card" *ngFor="let report of reports">
    <div class="card-header">
      <span class="card-title">{{ report.reportName }}</span>
      <div style="display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 30px;">
        <img
          src="/assets/images/report.svg"
          alt="Access denied"
          class="mb-5"
          width="60%" />
    </div>
    </div>
  </div>
</div>

<p-paginator
  [rows]="10"
  [totalRecords]="totalRecords"
  [pageLinkSize]="3"
  (onPageChange)="onPageChange($event)"
></p-paginator>
</ng-container>
