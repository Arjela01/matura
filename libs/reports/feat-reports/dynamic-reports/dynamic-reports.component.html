<ng-container>
  <div class="card-container">
    <ng-container
      *ngIf="
        reports | reportFilter : reportName : 'reportName' as reportsResult
      ">
      <div
        class="card"
        *ngFor="let report of reportsResult"
        (click)="onViewClick(report)">
        <!--      <div class="no-data" *ngIf="result === 0  && reportName">Nuk u gjet raport me këtë emër!</div>-->

        <div class="card-header">
          <span class="card-title">{{ report.reportName }}</span>
          <div class="svg-container">
            <img src="/assets/images/report.svg" class="mb-5" width="60%" />
          </div>
        </div>
      </div>
      <p>
        Count: <b>{{ reportsResult.length }}</b>
      </p>

      <p-paginator
        [rows]="10"
        [totalRecords]="reportsResult.length"
        (onPageChange)="onPageChange($event)">
      </p-paginator>
      
    </ng-container>
  </div>
</ng-container>
