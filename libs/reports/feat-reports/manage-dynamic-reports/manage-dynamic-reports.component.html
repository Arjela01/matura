<div class="flex center mb-2 page-header mb-header">
    <h2 class="flex-1 mb-0">
        Raporte
    </h2>
</div>
<div class="grid">
    <div class="col-12">
        <div class="card">
            <msh-dynamic-reports [reports]="(reports$ | async) || []" [totalRecords]="totalRecords"
                (lazyLoadData)="getReports($event)" (changePage) = paginate($event)>
            </msh-dynamic-reports>
        </div>
    </div>
</div>
