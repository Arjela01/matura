<div class="grid mb-header">
  <div class="col-12">
    <div class="card px-3 py-3" style="background: white">
      <button pButton label="Kthehu" icon="pi pi-arrow-left" class="mr-2 back-button" (click)="goBack()"></button>
      <iframe #reportRenderer id="reportRenderer" [src]="iframeUrl | safe : 'resourceUrl'" width="100%" frameborder="0"
        style="border: 0" iframeAutoHeight (load)="onIframeLoad()">
      </iframe>
    </div>
  </div>
</div>

<ng-container *ngIf="sendMessage$ | async"></ng-container>
<ng-container *ngIf="academicYear$ | async"></ng-container>
