<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Eksportim të Dhënash</h2>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card p-6">
        <div *ngFor="let dataExport of dataExports">
          <div class="flex align-content-between">
          <p-button icon="pi pi-download" (onClick)="download(dataExport)" styleClass="flex align-items-center"></p-button>
          <a (click)="download(dataExport)" class="p-button-link" [className]="'flex align-items-center ml-3 cursor-pointer text-lg'">{{dataExport.name}}</a>
          </div>
        </div>
    </div>
  </div>
</div>
