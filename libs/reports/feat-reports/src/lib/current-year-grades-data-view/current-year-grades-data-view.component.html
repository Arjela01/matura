<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Të dhënat e sivjetshme për maturantin për SMIP</h2>
</div>
<form (ngSubmit)="onSearchClick()" class="mt-4">
  <p-inputGroup>
    <p-inputGroupAddon>
      NID i Maturantit
    </p-inputGroupAddon>

    <input
      type="text"
      pInputText
      id="nid"
      name="nid"
      [required]="true"
      [(ngModel)]="nid"

      required
      autofocus />
    <button
      type="submit"
      pButton
      icon="pi pi-search"
      label="Kërko"
      class="w-auto mr-2"></button>
  </p-inputGroup>

  <h4 *ngIf="response">Përgjigja</h4>
  <pre>{{ response | json }}</pre>

</form>
