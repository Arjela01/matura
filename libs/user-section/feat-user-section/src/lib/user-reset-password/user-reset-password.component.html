<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card">
      <form #form="ngForm" class="form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="newPassword">Fjalëkalimi i Ri *</label>
          <p-password
            id="newPassword"
            [toggleMask]="true"
            name="newPassword"
            [(ngModel)]="userResetPassword.newPassword"
            autofocus
            appendTo="body"
            placeholder="Fjalëkalimi i ri"
            mshStrongPasswordValidator
            #newPassword="ngModel"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !userResetPassword.newPassword
            }">
            <ng-template pTemplate="header">
              <h6>Formo fjalëkalimin</h6>
            </ng-template>
            <ng-template pTemplate="footer">
              <p-divider></p-divider>
              <p class="mt-2">Sugjerimet</p>
              <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5">
                <li>Të paktën një gërmë jo kapitale</li>
                <li>Të paktën një gërmë kapitale</li>
                <li>Të paktën një karakter special</li>
                <li>Të paktën një numër</li>
                <li>Minimalisht 8 karaktere</li>
              </ul>
            </ng-template>
          </p-password>
          <small
            class="p-error block"
            *ngIf="submitted && !userResetPassword.newPassword">
            Fjalëkalimi është fushë e kërkuar.
          </small>
        </div>
        <div class="field">
          <label for="confirmationPassword"> Konfirmo Fjalëkalimin *</label>
          <p-password
            id="confirmationPassword"
            [toggleMask]="true"
            [feedback]="false"
            name="confirmationPassword"
            [(ngModel)]="userResetPassword.confirmPassword"
            autofocus
            placeholder="Konfirmo Fjalëkalimin"
            mshStrongPasswordValidator
            #confirmPassword="ngModel"
            [ngClass]="{
              'ng-invalid ng-dirty':
                submitted && !userResetPassword.confirmPassword
            }">
          </p-password>
          <small
            class="p-error block"
            *ngIf="submitted && !userResetPassword.confirmPassword">
            Fjalëkalimi është fushë e kërkuar.
          </small>
          <small
            class="p-error block"
            *ngIf="
              confirmPassword.touched &&
              userResetPassword.newPassword !==
                userResetPassword.confirmPassword
            ">
            Fjalëkalimi nuk është i njejtë
          </small>
        </div>
        <div class="label">
          <div class="flex justify-content-end">
            <button
              type="button"
              pButton
              label="Anullo"
              class="p-button-text w-auto mr-2"
              (click)="onCancelClick()"></button>
            <button
              [disabled]="form.invalid"
              type="submit"
              pButton
              label="Ndrysho"
              class="p-button w-auto"></button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
