<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card">
      <form #form="ngForm" class="form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="password">Fjalëkalimi Aktual *</label>
          <p-password
            id="password"
            [feedback]="false"
            [toggleMask]="true"
            name="password"
            [(ngModel)]="userResetPassword.password"
            autofocus
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !userResetPassword.password
            }">
          </p-password>
          <small
            class="p-error block"
            *ngIf="submitted && !userResetPassword.password">
            Fjalëkalimi aktual është fushë e kërkuar.
          </small>
        </div>
        <div class="field">
          <label for="newPassword">Fjalëkalimi i Ri *</label>
          <p-password
            id="newPassword"
            [feedback]="false"
            [toggleMask]="true"
            name="newPassword"
            [(ngModel)]="userResetPassword.newPassword"
            autofocus
            mshStrongPasswordValidator
            #newPassword="ngModel"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !userResetPassword.newPassword
            }">
          </p-password>
          <small
            class="p-error block"
            *ngIf="submitted && !userResetPassword.newPassword">
            Fjalëkalimi është fushë e kërkuar.
          </small>
          <small
            class="p-error block"
            *ngIf="
              newPassword.touched &&
              newPassword.errors &&
              newPassword.errors['strongPasswordValidator']
            ">
            Fjalëkalimi duhet të përmbajë minimalisht një gërmë kapitale, një
            gërmë jo kapitale, një karakter special, një numër dhe nuk duhet të
            përmbajë hapësira.
          </small>
        </div>
        <div class="field">
          <label for="confirmationPassword"> Konfirmo Fjalëkalimin *</label>
          <p-password
            id="confirmationPassword"
            [feedback]="false"
            [toggleMask]="true"
            name="confirmationPassword"
            [(ngModel)]="userResetPassword.confirmPassword"
            autofocus
            mshStrongPasswordValidator
            #confirmPassword="ngModel"
            [ngClass]="{
              'ng-invalid ng-dirty':
                submitted && !userResetPassword.confirmPassword
            }">
          </p-password>
          <small
            class="p-error block"
            *ngIf="submitted && !userResetPassword.confirmPassword">
            Fjalëkalimi është fushë e kërkuar.
          </small>
          <small
            class="p-error block"
            *ngIf="
              confirmPassword.touched &&
              userResetPassword.newPassword !==
                userResetPassword.confirmPassword
            ">
            Fjalëkalimi nuk është i njejtë
          </small>
        </div>
        <div class="label">
          <div class="flex justify-content-end">
            <button
              type="button"
              pButton
              icon="pi pi-times"
              label="Anullo"
              class="p-button-text w-auto mr-2"
              (click)="onCancelClick()"></button>
            <button
              type="submit"
              pButton
              icon="pi pi-check"
              label="Ndrysho"
              class="p-button-text w-auto"></button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
