<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="role.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !role.name }" />
    <small class="p-error block" *ngIf="submitted && !role.name">
      Emri është fushë e kërkuar.
    </small>
  </div>


  <div class="field">
    <label for="Description">Përshkrimi</label>
    <input
      type="text"
      pInputText
      id="Description"
      name="Description"
      [(ngModel)]="role.description"
      autofocus />

  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
