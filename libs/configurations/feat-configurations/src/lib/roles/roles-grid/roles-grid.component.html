<p-table
  #dt
  [value]="roles"
  responsiveLayout="scroll"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  dataKey="code"
  [(selection)]="selectedRoles"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <div>
          <p-sortIcon field="name"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="name"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="description">
        Përshkrimi
        <div>
          <p-sortIcon field="description"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="description"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-roles>
    <tr>
      <td style="width: 50%; min-width: 10rem">
        {{ roles.name }}
      </td>
      <td style="width: 50%; min-width: 10rem">
        {{ roles.description }}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Edit"
            tooltipPosition="bottom"
            (click)="onEditClick(roles)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Delete"
            tooltipPosition="bottom"
            (click)="onDeleteClick(roles)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
