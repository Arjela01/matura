<p-table
  #dt
  [value]="roles"
  responsiveLayout="scroll"
  [rows]="10"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
  [rowHover]="true"
  dataKey="code"
  [(selection)]="selectedRoles"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Menaxho Rolet</h5>
      <span class="block mt-2 md:mt-0 p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Search..."
          class="w-full sm:w-auto" />
      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox (click)="onSelectAllClick()">
        </p-tableHeaderCheckbox>
      </th>
      <th pSortableColumn="code">
        Kodi
        <p-sortIcon field="code"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="code"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"></p-columnFilter>
      </th>

      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-roles>
    <tr>
      <td>
        <p-tableCheckbox [value]="roles"></p-tableCheckbox>
      </td>
      <td style="width: 50%; min-width: 10rem">
        {{ roles.code }}
      </td>
      <td style="width: 50%; min-width: 10rem">
        {{ roles.name }}
      </td>

      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Edit"
            tooltipPosition="bottom"
            (click)="onEditClick(roles)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Delete"
            tooltipPosition="bottom"
            (click)="onDeleteClick(roles)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
