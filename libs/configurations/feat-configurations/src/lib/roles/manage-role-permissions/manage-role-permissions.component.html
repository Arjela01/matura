<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Të Drejtat e Rolit</h2>
</div>
<div class="grid" style="margin-top: 1%; margin-bottom: 5%">
  <div class="col-12">
    <div class="card">
      <div *ngFor="let elem of permissionCategoryWithPermissions" style="float: left; margin-right: 5%;">
        <h3 style="margin-left: 50%">{{elem.PermissionCategory.name}}</h3>
        <ul *ngFor="let p of elem.Permissions" style="list-style: none;">
          <li style="display: flex;">
            <input type="checkbox" style="margin-left: 0" [(ngModel)]="p.isTicked"/><p style="font-size: large">{{p.name}}</p>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="col-12">
    <button pButton pRipple label="Ruaj" class="p-button-success" style="margin-left: 2%" (click)="onFormSave()"></button>
  </div>
</div>
