<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-left">
          <div class="my-2">
            <button
              pButton
              pRipple
              label="Shto"
              icon="pi pi-plus"
              class="p-button-success mr-2"
              (click)="onNewClick()"></button>
            <button
              pButton
              pRipple
              label="Fshi"
              icon="pi pi-trash"
              class="p-button-danger"
              [disabled]="selectedstudyPrograms.length === 0"
              (click)="onDeleteSelectedClick()"></button>
          </div>
        </div>
        <div class="p-toolbar-group-right">
          <button
            pButton
            pRipple
            label="Eksporto"
            icon="pi pi-upload"
            class="p-button-help"></button>
        </div>
      </p-toolbar>

      <msh-study-program-grid
        [studyPrograms]="(studyPrograms$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getStudyPrograms($event)">
      </msh-study-program-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e Programeve të Studimit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-study-program-form
      [studyProgramDetails]="selectedstudyProgram"
      [universities]="universities"
      [academicYears]="academicYears"
      [universityDepartments]="universityDepartaments"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-study-program-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
