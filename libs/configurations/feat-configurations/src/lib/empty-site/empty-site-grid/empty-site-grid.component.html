<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="emptySites"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamAssignments"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="examSiteName">
        Qendra e Provimit
        <p-sortIcon field="examSiteName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examSiteName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="date">
        Data e Provimit
        <p-sortIcon field="date"></p-sortIcon>
        <p-columnFilter
          type="date"
          field="date"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="time">
        Ora e Provimit
        <p-sortIcon field="time"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="time"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="examTypeName">
        Tipi i Provimit
        <p-sortIcon field="examTypeName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examTypeName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="takenSeats">
        Vendet e Zëna
        <p-sortIcon field="takenSeats"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="takenSeats"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-emptySite>
    <tr>
      <td style="width: 30%; min-width: 10rem">
        {{ emptySite.examSiteName }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ emptySite.date | date : 'dd.MM.yyyy' }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ emptySite.date | date : 'hh:mm' }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ emptySite.examTypeName }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ emptySite.takenSeats }}
      </td>
      <td style="width: 5%; min-width: 10rem">
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-times"
            style="color: #f04438"
            pTooltip="Zbraz Qendrën"
            tooltipPosition="bottom"
            class="p-button-success p-button-text mr-2"
            (click)="onEmptySite(emptySite)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
