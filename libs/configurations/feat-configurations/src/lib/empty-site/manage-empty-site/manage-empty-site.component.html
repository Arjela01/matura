<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Zbraz Qendrën e Provimit</h2>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-empty-site-grid
        [emptySites]="(emptySiteList$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getEmptySites($event)">
      </msh-empty-site-grid>
    </div>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
