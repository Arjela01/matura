<div class="flex center mb-2 page-header mb-header align-items-top">
  <h2 class="flex-1 mb-0">Zbraz Qendrën e Provimit</h2>
  <div class="flex align-items-right justify-content-right">
    <msh-custom-switch
      [(isOn)]="isOn"
      [label]="'Vjeshtë'"
      (isOnChange)="onSwitchChange($event)">
    </msh-custom-switch>
  </div>
</div>
<div class="grid mt-3">
  <div class="col-12">
    <div class="card">
      <msh-empty-site-grid
        [emptySites]="(emptySiteList$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getEmptySites($event)">
      </msh-empty-site-grid>
    </div>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
<ng-container *ngIf="changes$"></ng-container>
