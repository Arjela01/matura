<div class="flex ml-2 mb-5 page-header mb-header">
  <h2 class="flex-1 mb-0">Sesionet e Hapura të Sistemit</h2>
</div>

<div class="grid">
  <div class="col-12">
    <div class="card">
      <p-table
        #dt
        dataKey="id"
        responsiveLayout="scroll"
        [scrollable]="true"
        scrollHeight="820px"
        [value]="(sessions$ | async) || []"
        [totalRecords]="totalRecords"
        [rows]="100"
        [paginator]="true"
        [rowsPerPageOptions]="[100, 200, 300]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
        [rowHover]="true"
        selectionMode="multiple"
        (onLazyLoad)="getSessions($event)"
        [lazy]="true">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="userName">
              Përdoruesi
              <div>
                <p-sortIcon field="userName"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="userName"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="firstName">
              Emri
              <div>
                <p-sortIcon field="firstName"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="firstName"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="lastName">
              Mbiemri
              <div>
                <p-sortIcon field="lastName"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="lastName"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="lastAccessTime">
              Koha e fundit e aksesit
              <div>
                <p-sortIcon field="lastAccessTime"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="lastAccessTime"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="expirationTime">
              Koha e skadimit
              <div>
                <p-sortIcon field="expirationTime"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="expirationTime"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-session>
          <tr>
            <td style="width: 10%; min-width: 10rem">
              {{ session.userName }}
            </td>
            <td style="width: 25%; min-width: 10rem">
              {{ session.firstName }}
            </td>
            <td style="width: 10%; min-width: 10rem">
              {{ session.lastName }}
            </td>
            <td style="width: 10%; min-width: 10rem">
              {{ session.lastAccessTime | app_time }}
            </td>
            <td style="width: 10%; min-width: 10rem">
              {{ session.expirationTime | app_time }}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
<ng-container *ngIf="academicYear$ | async"></ng-container>
