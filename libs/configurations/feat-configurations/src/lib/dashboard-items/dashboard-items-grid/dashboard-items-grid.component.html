<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="dashboardItems"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedDashboardItems"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="dashboardSectionName">
        Seksioni
        <div>
          <p-sortIcon field="dashboardSectionName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="dashboardSectionName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="title">
        Titulli
        <div>
          <p-sortIcon field="title"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="title"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="description">
        Përshkrimi
        <div>
          <p-sortIcon field="description"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="description"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="hasDocument">
        Dokument?
        <div>
          <p-sortIcon field="hasDocument"></p-sortIcon>
        </div>
      </th>
      <th pSortableColumn="hasLinkUrl">
        Link?
        <div>
          <p-sortIcon field="hasLinkUrl"></p-sortIcon>
        </div>
      </th>
      <th pSortableColumn="startDate">
        E Vlefshme Nga
        <div>
          <p-sortIcon field="startDate"></p-sortIcon>
          <p-columnFilter
            type="date"
            field="startDate"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="endDate">
        E Vlefshme Deri
        <div>
          <p-sortIcon field="endDate"></p-sortIcon>
          <p-columnFilter
            type="date"
            field="endDate"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="user">Veprime</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-dashboardItem>
    <tr>
      <td style="width: 14%; min-width: 10rem">
        {{ dashboardItem.dashboardSectionName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ dashboardItem.title }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ dashboardItem.description }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        <div *ngIf="dashboardItem.hasDocument">
          <img
            src="assets/svg/download.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            pTooltip="Shkarko"
            (click)="onDownloadClick(dashboardItem)" />
        </div>
      </td>
      <td style="width: 14%; min-width: 10rem">
        <a
          *ngIf="dashboardItem.linkUrl"
          href="{{ dashboardItem.linkUrl }}"
          target="_blank">
          Vizito Linkun
        </a>
        <p *ngIf="!dashboardItem.linkUrl">Nuk ka link</p>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ dashboardItem.startDate | app_date }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ dashboardItem.endDate | app_date }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(dashboardItem)" />
          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(dashboardItem)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
