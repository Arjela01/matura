<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="section">Seksioni *</label>
    <p-dropdown
      id="section"
      [options]="sectionDashboard"
      name="section"
      optionValue="key"
      optionLabel="value"
      [(ngModel)]="dashboardItem.dashboardSectionId"
      [autoDisplayFirst]="false"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItem.dashboardSectionId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !dashboardItem.dashboardSectionId">
      Seksioni është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="title">Titulli *</label>
    <input
      type="text"
      pInputText
      id="title"
      name="title"
      [(ngModel)]="dashboardItem.title"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItem.title
      }" />
    <small class="p-error block" *ngIf="submitted && !dashboardItem.title">
      Titulli është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="description">Përshkrimi *</label>
    <textarea
      rows="2"
      cols="35"
      pInputTextarea
      id="description"
      name="description"
      [(ngModel)]="dashboardItem.description"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItem.description
      }"></textarea>

    <small
      class="p-error block"
      *ngIf="submitted && !dashboardItem.description">
      Përshkrimi është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="documentName">Emri Dokumentit *</label>
    <input
      type="text"
      pInputText
      id="documentName"
      name="documentName"
      [(ngModel)]="dashboardItem.documentName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItem.documentName
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !dashboardItem.documentName">
      Emri dokumentit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="document">Dokumenti</label>
    <div class="form-group drop-files noLabel">
      <p-fileUpload
        #uploader
        id="document"
        [showUploadButton]="false"
        class="ie-file-upload"
        (onSelect)="selectFiles($event)"
        accept=".pdf">
        <ng-template pTemplate="content">
          <span
            *ngIf="
              dashboardItem.document && !uploaded && dashboardItem.document
            "
            alt=""
            >{{ dashboardItem.title }}.pdf</span
          >
        </ng-template>
      </p-fileUpload>
    </div>
  </div>

  <div class="field">
    <label for="link">Link\URL</label>
    <input
      type="text"
      pInputText
      id="link"
      name="link"
      [(ngModel)]="dashboardItem.linkUrl"
      autofocus />
  </div>

  <div class="field">
    <label for="Roles">Rolet</label>
    <p-multiSelect
      id="Roles"
      name="roles"
      [options]="roles"
      optionValue="key"
      optionLabel="value"
      [(ngModel)]="dashboardItem.roles"
      [required]="true"
      appendTo="body"
      [showClear]="true"
      defaultLabel="Selekto Rolet"
      display="chip"></p-multiSelect>
  </div>

  <div class="field">
    <label for="Users">Përdoruesit</label>
    <p-multiSelect
      id="Users"
      name="users"
      [options]="users"
      optionValue="key"
      optionLabel="value"
      [(ngModel)]="dashboardItem.users"
      appendTo="body"
      [showClear]="true"
      [required]="true"
      defaultLabel="Selekto Përdoruesit"
      display="chip"></p-multiSelect>
    <small class="p-error block" *ngIf="submitted && !dashboardItem.users">
      Përdoruesi/t është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="startDate">E vlefshme nga *</label>
    <p-calendar
      [(ngModel)]="formattedStartDate"
      dateFormat="dd/mm/yy"
      inputId="startDate"
      id="startDate"
      name="startDate"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !formattedStartDate
      }"></p-calendar>
    <small class="p-error block" *ngIf="submitted && !formattedStartDate">
      Data është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="endDate">E vlefshme nga *</label>
    <p-calendar
      [(ngModel)]="formattedEndDate"
      dateFormat="dd/mm/yy"
      inputId="endDate"
      id="endDate"
      name="endDate"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !formattedEndDate
      }"></p-calendar>
    <small class="p-error block" *ngIf="submitted && !formattedEndDate">
      Data është fushë e kërkuar.
    </small>
  </div>
  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
