<div class="grid">
  <div class="col-12">
    <h2 class="flex-1 mb-0 mt-6">Konfigurime Paneli</h2>
    <div class="card-form px-6 py-6 mb-header mt-3">
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="field" [style]="{ width: '750px' }">
          <label for="dashboardSectionId">Seksioni *</label>
          <p-dropdown
            id="dashboardSectionId"
            [options]="(sectionDashboard | async) || []"
            name="dashboardSectionId"
            optionLabel="value"
            optionValue="key"
            [(ngModel)]="dashboardItem.dashboardSectionId"
            [style]="{ width: '100%' }"
            [autoDisplayFirst]="false"
            [required]="true"
            [ngClass]="{
              'ng-invalid ng-dirty':
                submitted && !dashboardItem.dashboardSectionId
            }">
          </p-dropdown>
          <small
            class="p-error block"
            *ngIf="submitted && !dashboardItem.dashboardSectionId">
            Seksioni është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="title">Titulli *</label>
          <input
            type="text"
            pInputText
            id="title"
            name="title"
            [(ngModel)]="dashboardItem.title"
            required
            [style]="{ width: '100%' }"
            autofocus
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !dashboardItem.title
            }" />
          <small
            class="p-error block"
            *ngIf="submitted && !dashboardItem.title">
            Titulli është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="description">Përshkrimi *</label>
          <textarea
            rows="2"
            cols="35"
            pInputTextarea
            id="description"
            [style]="{ width: '100%' }"
            name="description"
            [(ngModel)]="dashboardItem.description"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !dashboardItem.description
            }"></textarea>

          <small
            class="p-error block"
            *ngIf="submitted && !dashboardItem.description">
            Përshkrimi është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="documentName">Emri Dokumentit *</label>
          <input
            type="text"
            pInputText
            id="documentName"
            [style]="{ width: '100%' }"
            name="documentName"
            [(ngModel)]="dashboardItem.documentName"
            required
            autofocus
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !dashboardItem.documentName
            }" />
          <small
            class="p-error block"
            *ngIf="submitted && !dashboardItem.documentName">
            Emri dokumentit është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '300px' }">
          <label for="document">Dokumenti</label>
          <div class="form-group drop-files noLabel">
            <p-fileUpload
              #uploader
              id="document"
              [showUploadButton]="false"
              class="ie-file-upload"
              (onSelect)="selectFiles($event)"
              accept=".pdf">
              <ng-template pTemplate="content">
                <span
                  *ngIf="
                    dashboardItem.document &&
                    !uploaded &&
                    dashboardItem.document
                  "
                  alt=""
                  >{{ dashboardItem.title }}.pdf</span
                >
              </ng-template>
            </p-fileUpload>
          </div>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="link">Link\URL</label>
          <input
            type="text"
            pInputText
            id="link"
            name="link"
            [style]="{ width: '100%' }"
            [(ngModel)]="dashboardItem.linkUrl"
            autofocus />
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="Roles">Rolet</label>
          <p-multiSelect
            [style]="{ width: '100%' }"
            id="Roles"
            name="roles"
            [options]="roles"
            optionLabel="value"
            [(ngModel)]="dashboardItem.roles"
            [required]="true"
            appendTo="body"
            [showClear]="true"
            defaultLabel="Selekto Rolet"
            display="chip"></p-multiSelect>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="Users">Përdoruesit</label>
          <p-multiSelect
            [style]="{ width: '100%' }"
            id="Users"
            name="users"
            [options]="users"
            optionLabel="value"
            [(ngModel)]="dashboardItem.users"
            [required]="true"
            appendTo="body"
            [showClear]="true"
            defaultLabel="Selekto Përdoruesit"
            display="chip"></p-multiSelect>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="startDate">E vlefshme nga *</label>
          <p-calendar
            [style]="{ width: '100%' }"
            [(ngModel)]="formattedStartDate"
            dateFormat="dd/mm/yy"
            inputId="startDate"
            id="startDate"
            name="startDate"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !formattedStartDate
            }"></p-calendar>
          <small class="p-error block" *ngIf="submitted && !formattedStartDate">
            Data është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="endDate">E vlefshme deri *</label>
          <p-calendar
            [style]="{ width: '100%' }"
            [(ngModel)]="formattedEndDate"
            dateFormat="dd/mm/yy"
            inputId="endDate"
            id="endDate"
            name="endDate"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !formattedEndDate
            }"></p-calendar>
          <small class="p-error block" *ngIf="submitted && !formattedEndDate">
            Data është fushë e kërkuar.
          </small>
        </div>
        <div class="flex justify-content-end">
          <button
            type="button"
            pButton
            label="Anullo"
            class="p-button-text w-auto mr-2"
            (click)="onCancelClick()"></button>
          <button
            [disabled]="form.invalid"
            type="submit"
            pButton
            label="Ruaj"
            class="p-button w-auto"></button>
        </div>
      </form>
    </div>
  </div>
</div>
