<form #form="ngForm" (ngSubmit)="onSubmit()">

  <div class="field">
    <label for="section">Seksioni *</label>
    <p-dropdown
      id="section"
      [options]="sectionDashboard"
      name="section"
      optionValue="key"
      optionLabel="value"
      [(ngModel)]="dashboardItems.dashboardSectionId"
      [autoDisplayFirst]="false"
      [ngClass]="{
              'ng-invalid ng-dirty': submitted && !dashboardItems.dashboardSectionId
            }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !dashboardItems.dashboardSectionId">
      Seksioni është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="title">Titulli *</label>
    <input
      type="text"
      pInputText
      id="title"
      name="title"
      [(ngModel)]="dashboardItems.title"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItems.title
      }" />
    <small class="p-error block" *ngIf="submitted && !dashboardItems.title">
      Titulli është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="description"> Përshkrimi *</label>
    <textarea
      rows="2"
      cols="35"
      pInputTextarea
      id="description"
      name="description"
      [(ngModel)]="dashboardItems.description"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItems.description
      }"></textarea>

    <small class="p-error block" *ngIf="submitted && !dashboardItems.description">
      Përshkrimi është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="document">Dokument *</label>
    <div class="form-group drop-files noLabel">
      <p-fileUpload
        #uploader
        [showUploadButton]="false"
        class="ie-file-upload"
        id="document"
        accept=".pdf">
        <ng-template pTemplate="content">
          <img
            [src]="'data:image;base64,' + dashboardItems.document"
            width="100"
            height="100"
            *ngIf="dashboardItems.document && !uploaded && dashboardItems.document"
            alt="" />
        </ng-template>
      </p-fileUpload>
    </div>
  </div>

  <div class="field">
    <label for="link">Link\URL *</label>
    <input
      type="text"
      pInputText
      id="link"
      name="link"
      [(ngModel)]="dashboardItems.linkUrl"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItems.linkUrl
      }" />
    <small class="p-error block" *ngIf="submitted && !dashboardItems.linkUrl">
      Link\URL është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="Roles">Rolet</label>
    <p-multiSelect
      id="Roles"
      name="roles"
      [options]="roles"
      optionValue="value"
      optionLabel="value"
      [(ngModel)]="dashboardItems.roles"
      appendTo="body"
      [showClear]="true"
      defaultLabel="Selekto Rolet"
      display="chip"></p-multiSelect>
  </div>
  <div class="field">
    <label for="Users">Perdoruesit</label>
    <p-multiSelect
      id="Users"
      name="users"
      [options]="users"
      optionValue="value"
      optionLabel="value"
      [(ngModel)]="dashboardItems.users"
      appendTo="body"
      [showClear]="true"
      defaultLabel="Selekto Perdoruesit"
      display="chip"></p-multiSelect>
  </div>

  <div class="field">
      <label for="effectiveDate">E vlefshme nga *</label>
      <input
        placeholder="dd/MM/yyyy"
        type="text"
        pInputText
        id="effectiveDate"
        name="effectiveDate"
        [(ngModel)]="dashboardItems.startDate"
        required
        autofocus
        [ngClass]="{
          'ng-invalid ng-dirty': submitted && ! dashboardItems.startDate
        }" />
      <small class="p-error block" *ngIf="submitted && !dashboardItems.startDate">
        Data është fushë e kërkuar.
      </small>
    </div>

    <div class="field">
      <label for="banRemovalDate">E vlefshme deri *</label>
      <input
        placeholder="dd/MM/yyyy"
        type="text"
        pInputText
        id="banRemovalDate"
        name="banRemovalDate"
        [(ngModel)]="dashboardItems.endDate"
        required
        autofocus
        [ngClass]="{
          'ng-invalid ng-dirty': submitted && ! dashboardItems.endDate
        }" />
      <small class="p-error block" *ngIf="submitted && ! dashboardItems.endDate">
        Data është fushë e kërkuar.
      </small>
    </div>
  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"></button>
  </div>
</form>
