<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="studyClass">Seksioni *</label>
    <p-dropdown
      id="studyClass"
      [options]="sectionDashboard"
      name="schoolProfile"
      [(ngModel)]="dashboardItems.name"
      [required]="true"
      [virtualScroll]="true"
      [autoDisplayFirst]="false"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItems.name
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !dashboardItems.name">
      Seksioni është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="title">Titulli *</label>
    <input
      type="text"
      pInputText
      id="title"
      name="title"
      [(ngModel)]="dashboardItems.name"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItems.name
      }" />
    <small class="p-error block" *ngIf="submitted && !dashboardItems.name">
      Titulli është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="description"> Përshkrimi *</label>
    <textarea
      rows="2"
      cols="35"
      pInputTextarea
      id="description"
      name="description"
      [(ngModel)]="dashboardItems.name"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !dashboardItems.name
      }"></textarea>

    <small class="p-error block" *ngIf="submitted && !dashboardItems.name">
      Përshkrimi është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <div class="field">
      <label for="roles">Roli/et</label>
      <p-multiSelect
        id="roles"
        name="roles"
        [options]="roles"
        optionValue="value"
        optionLabel="value"
        [(ngModel)]="dashboardItems.roles"
        appendTo="body"
        [showClear]="true"
        defaultLabel="Selekto Rolet"
        display="chip"></p-multiSelect>
