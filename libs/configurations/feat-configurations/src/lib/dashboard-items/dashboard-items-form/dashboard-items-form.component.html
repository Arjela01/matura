<div class="grid">
  <div class="col-12">
    <h2 class="flex-1 mb-0 mt-6">Elemente Dashboardi</h2>
    <div class="card-form px-6 py-6 mb-header mt-3">
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="field" [style]="{ width: '750px' }">
          <label for="dashboardSectionId">Seksioni *</label>
          <p-dropdown
            id="dashboardSectionId"
            [options]="(sectionDashboard | async) || []"
            name="dashboardSectionId"
            optionLabel="value"
            optionValue="key"
            [(ngModel)]="dashboardItem.dashboardSectionId"
            [style]="{ width: '100%' }"
            [autoDisplayFirst]="false"
            [ngClass]="{
              'ng-invalid ng-dirty':
                submitted && !dashboardItem.dashboardSectionId
            }">
          </p-dropdown>
          <small
            class="p-error block"
            *ngIf="submitted && !dashboardItem.dashboardSectionId">
            Seksioni është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="title">Titulli *</label>
          <input
            type="text"
            pInputText
            id="title"
            name="title"
            [(ngModel)]="dashboardItem.title"
            [style]="{ width: '100%' }"
            autofocus
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !dashboardItem.title
            }" />
          <small
            class="p-error block"
            *ngIf="submitted && !dashboardItem.title">
            Titulli është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="description">Përshkrimi *</label>
          <textarea
            rows="5"
            cols="35"
            pInputTextarea
            id="description"
            [style]="{ width: '100%' }"
            name="description"
            [(ngModel)]="dashboardItem.description"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !dashboardItem.description
            }"></textarea>

          <small
            class="p-error block"
            *ngIf="submitted && !dashboardItem.description">
            Përshkrimi është fushë e kërkuar.
          </small>
        </div>



        <div class="field" [style]="{ width: '300px' }">
          <label for="document">Dokumenti
            <p-button label="Download" styleClass="p-button-link m-0 p-0" (click)="downloadDocument()" *ngIf="dashboardItem.document"></p-button>
            <p-button label="Clear" styleClass="p-button-link m-0 p-0" (click)="clearFile()"></p-button>


          </label>
          <div class="form-group drop-files noLabel">
            <p-fileUpload
              #uploader
              id="document"
              [showUploadButton]="false"
              class="ie-file-upload"
              (onSelect)="selectFiles($event)"
              [showCancelButton]="false"
              accept=".pdf">
            </p-fileUpload>
          </div>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="documentName">Emri Dokumentit</label>
          <input
                  type="text"
                  pInputText
                  id="documentName"
                  [style]="{ width: '100%' }"
                  name="documentName"
                  [(ngModel)]="dashboardItem.documentName"
                  autofocus />
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="link">Link (URL)</label>
          <input
            type="text"
            pInputText
            id="link"
            name="link"
            [style]="{ width: '100%' }"
            [(ngModel)]="dashboardItem.linkUrl"
            autofocus />
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="Roles">Rolet</label>
          <p-multiSelect
            [style]="{ width: '100%' }"
            id="Roles"
            name="roles"
            [options]="roles"
            [optionLabel]="'value'"
            [optionValue]="'key'"
            [(ngModel)]="selectedRoles"
            appendTo="body"
            [showClear]="true"
            defaultLabel="Selekto Rolet"
            display="chip"></p-multiSelect>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="Users">Përdoruesit</label>
          <p-multiSelect
            [style]="{ width: '100%' }"
            id="Users"
            name="users"
            [options]="users"
            optionLabel="value"
            optionValue="key"
            [(ngModel)]="selectedUsers"
            appendTo="body"
            [showClear]="true"
            defaultLabel="Selekto Përdoruesit"
            display="chip"></p-multiSelect>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="startDate">E vlefshme nga *</label>
          <p-calendar
            [style]="{ width: '100%' }"
            [(ngModel)]="formattedStartDate"
            dateFormat="dd/mm/yy"
            inputId="startDate"
            id="startDate"
            name="startDate"
            (onSelect)="updateEndDateRange()"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !formattedStartDate
            }"></p-calendar>
          <small class="p-error block" *ngIf="submitted && !formattedStartDate">
            Data është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '750px' }">
          <label for="endDate">E vlefshme deri</label>
          <p-calendar
            [style]="{ width: '100%' }"
            [(ngModel)]="formattedEndDate"
            dateFormat="dd/mm/yy"
            inputId="endDate"
            id="endDate"
            name="endDate"
            [disabledDates]="disabledEndDate"></p-calendar>
        </div>
        <div class="flex justify-content-end">
          <button
            type="button"
            pButton
            label="Anullo"
            class="p-button-text w-auto mr-2"
            (click)="onCancelClick()"></button>
          <button
            [disabled]="form.invalid"
            type="submit"
            pButton
            label="Ruaj"
            class="p-button w-auto"></button>
        </div>
      </form>
    </div>
  </div>
</div>
