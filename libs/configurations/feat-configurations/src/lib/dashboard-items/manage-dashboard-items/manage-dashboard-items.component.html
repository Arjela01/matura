<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Konfigurime të Dashboard-it</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-dashboard-items-grid
        [dashboardItems]="(dashboardItems$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getDashboardItems($event)">
      </msh-dashboard-items-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e Konfigurimeve të Dashboard-it"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-dashboard-items-form
      [roles]="roles"
      [users]="users"
      [setDashboardItemsDetails]="selectedDashboardItem"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-dashboard-items-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
