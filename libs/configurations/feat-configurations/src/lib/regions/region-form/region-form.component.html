<form #form="ngForm" (ngSubmit)="onSubmit()">

  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="region.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !region.name }" />
    <small class="p-error block" *ngIf="submitted && !region.name">
      Emri është fushë e kërkuar.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
