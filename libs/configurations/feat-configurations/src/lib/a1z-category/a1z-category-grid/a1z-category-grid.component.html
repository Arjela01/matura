<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="a1zCategories"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedA1zCategories"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-a1zCategory>
    <tr>
      <td style="width: 95%; min-width: 10rem">
        {{ a1zCategory.name }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(a1zCategory)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(a1zCategory)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
