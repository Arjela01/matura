<form #form="ngForm" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="Name">Emri *</label>
      <input
        type="text"
        pInputText
        id="Name"
        name="Name"
        [(ngModel)]="a1zCategory.name"
        required
        autofocus
        [ngClass]="{ 'ng-invalid ng-dirty': submitted && !a1zCategory.name }" />
      <small class="p-error block" *ngIf="submitted && !a1zCategory.name">
        Emri i kategorisë është fushë e kërkuar.
      </small>
    </div>

    <div class="flex justify-content-end">
      <button
        type="button"
        pButton
        label="Anullo"
        class="p-button-text w-auto mr-2"
        (click)="onCancelClick()"></button>
      <button
        [disabled]="form.invalid"
        type="submit"
        pButton
        label="Ruaj"
        class="p-button w-auto"></button>
    </div>
  </form>
