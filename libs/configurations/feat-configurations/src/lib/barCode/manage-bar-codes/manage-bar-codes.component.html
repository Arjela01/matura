<div class="grid">
<div class="col-12">
  <div class="card px-6 py-6">
    <!-- TODO: this can be reusable -->
    <p-toolbar styleClass="mb-4">
      <div class="p-toolbar-group-left">
        <h2 class="flex-1 mb-0">
          Dosja: {{"555 lende me zgjedhje:shërbime kujdesi për të moshuar (pilot - giz)"}}
        </h2>
      </div>
      <div class="p-toolbar-group-right">
          <button
            pButton
            pRipple
            label="Mbyll Dosjen"
            icon="pi pi-folder"
            class="p-button-danger mr-2"
          (click)="onCloseClick"></button>
      </div>
    </p-toolbar>

   <msh-bar-code-grid
        [archiveFolders]="(archiveFolders$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getArchiveFolders($event)">
      </msh-bar-code-grid>
    </div>
</div>
</div>
<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Kerko Dosje"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <!--    <msh-archive-folder-form-->
    <!--      [archiveFolders]="selectedArchiveFolder"-->
    <!--      [examTypes]="examType"-->
    <!--      (formClose)="onModalClose()"-->
    <!--      (formSave)="onFormSave($event)">-->
    <!--    </msh-archive-folder-form>-->
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
