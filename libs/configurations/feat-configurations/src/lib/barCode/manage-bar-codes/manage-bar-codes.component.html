<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <!-- TODO: this can be reusable -->

      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-left">
          <h2 class="flex-1 mb-0">
            Dosja: {{ totalRecords }}:{{ barCode.archiveFolderId }}
          </h2>
        </div>
        <div class="p-toolbar-group-right">
          <a href="/configurations/archive-folder">
            <button
              pButton
              label="Kthehu"
              icon="pi pi-arrow-left"
              class="p-button-danger mr-2"
              [ngStyle]="{ backgroundColor: 'var(--bluegray-600)' }"></button>
          </a>
          <a href="/configurations/layout-report-page">
            <button
              pButton
              label="Mbyll Dosjen"
              icon="pi pi-folder"
              class="p-button-danger mr-2"
              (click)="(onCloseClick)"></button>
          </a>
        </div>
      </p-toolbar>
      <msh-bar-code-grid
        [barCodes]="(barCodes$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getBarCodes($event)"
        (formSave)="onFormSave($event)">
      </msh-bar-code-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e Profilit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <!--    <msh-bar-code-form-->
    <!--      (formClose)="onModalClose()"-->
    <!--      (formSave)="onFormSave($event)">-->
    <!--    </msh-bar-code-form>-->
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
