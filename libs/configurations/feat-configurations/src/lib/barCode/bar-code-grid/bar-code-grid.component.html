<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="archiveFolders"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedArchiveFolders"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div class="flex flex-column mt-2 md:col-3 md:align-items-center">
        <div class="p-inputgroup">
          <button
            type="button"
            pButton
            pRipple
            icon="pi pi-database"
            disabled
            label="{{totalRecords}}/50"
            class="p-button-info mr-2"
          ></button>
          <input type="text"
                 maxlength="7"
                 pInputText
                 placeholder="Barkodi"
                 id="examType"
                 name="examType"
                 [(ngModel)]="archiveFolder.id"
                 required/>
          <button
            type="button"
            pButton
            pRipple
            icon="pi pi-save"
            label="Ruaj"
            class="p-button-success mr-2"
            (click)="onSaveBarCode"
     ></button>
        </div>
    </div>

  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="folder">
        Numri
        <p-sortIcon field="folder"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="folder"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="barcode">
        Barkodi
        <p-sortIcon field="barcode"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="barcode"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-archiveFolder>
    <tr>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveFolder.id }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{archiveFolder.examTypeName}}
      </td>



      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(archiveFolder)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(archiveFolder)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
