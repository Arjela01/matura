<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examVersions"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamVersions"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="numberOfQuestions">
        Numri i pyetjeve
        <p-sortIcon field="numberOfQuestions"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="numberOfQuestions"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="profileGroupName">
        Grupi i Profileve
        <p-sortIcon field="profileGroupName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="profileGroupName"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="variant">
        Varianti
        <p-sortIcon field="variant"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="variant"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="examTypeName">
        Tipi i Provimit
        <p-sortIcon field="examTypeName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examTypeName"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="examSubjectName">
        Lënda e Provimit
        <p-sortIcon field="examSubjectName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examSubjectName"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="code">
        Kodi
        <p-sortIcon field="code"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="code"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examVersion>
    <tr>
      <td style="width: 18%; min-width: 10rem">
        {{ examVersion.name }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examVersion.numberOfQuestions }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examVersion.profileGroupName }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examVersion.variant }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examVersion.examTypeName }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examVersion.examSubjectName }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examVersion.code }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examVersion)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examVersion)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
