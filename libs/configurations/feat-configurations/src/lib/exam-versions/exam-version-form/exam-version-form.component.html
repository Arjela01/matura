<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="examVersion.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examVersion.name }" />
    <small class="p-error block" *ngIf="submitted && !examVersion.name">
      Emri është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="NumberOfQuestions">Numri i pyetjeve *</label>
    <input
      type="number"
      pInputText
      id="NumberOfQuestions"
      name="NumberOfQuestions"
      [(ngModel)]="examVersion.numberOfQuestions"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVersion.numberOfQuestions
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examVersion.numberOfQuestions">
      Numri i pyetjeve është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ProfileGroups">Grupi i Profileve</label>
    <p-dropdown
      id="profileGroups"
      [options]="profileGroups"
      optionValue="key"
      optionLabel="value"
      name="profileGroupId"
      [autoDisplayFirst]="false"
      [(ngModel)]="examVersion.profileGroupId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVersion.profileGroupId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examVersion.profileGroupId">
      Grupi i Profileve është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="Variant">Varianti *</label>
    <input
      type="text"
      pInputText
      id="Variant"
      name="Variant"
      [(ngModel)]="examVersion.variant"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVersion.variant
      }" />
    <small class="p-error block" *ngIf="submitted && !examVersion.variant">
      Varianti është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ProfileGroups">Tipi i Provimit</label>
    <p-dropdown
      id="examTypes"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="examVersion.examTypeId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVersion.examTypeId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examVersion.examTypeId">
      Tipi i Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="Code">Kodi *</label>
    <input
      type="text"
      pInputText
      id="Code"
      name="Code"
      [(ngModel)]="examVersion.code"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examVersion.code }" />
    <small class="p-error block" *ngIf="submitted && !examVersion.code">
      Kodi është fushë e kërkuar.
    </small>
  </div>
  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"></button>
  </div>
</form>
