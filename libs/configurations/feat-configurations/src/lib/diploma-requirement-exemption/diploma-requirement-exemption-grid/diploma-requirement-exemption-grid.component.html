<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="students"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedStudents"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id">
        ID
        <p-sortIcon field="id"></p-sortIcon>
        <p-columnFilter type="text" field="id" display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="fatherName">
        Atësia
        <p-sortIcon field="fatherName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="fatherName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="lastName">
        Mbiemri
        <p-sortIcon field="lastName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="lastName"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <td style="width: 30%">
        {{ student.studentId }}
      </td>
      <td style="width: 30%">
        {{ student.firstName }}
      </td>
      <td style="width: 20%">
        {{ student.middleName }}
      </td>
      <td style="width: 40%">
        {{ student.lastName }}
      </td>

      <td style="width: 14%; min-width: 10rem">
        <div class="flex">
          <button
            pButton
            pRipple
            class="p-button-rounded p-button-plain p-button-text mr-2 pointer"
            (click)="changeStatus(student)"
            [ngClass]="
              student.isConfirmedBySupervisor === true
                ? ['bg-green-300', 'green-text', 'px-3', 'py-1', 'fb']
                : ['bg-red-300', 'red-text', 'px-3', 'py-1', 'fb']
            ">
            {{
              student.isConfirmedBySupervisor === true ? 'Konfirmo' : 'Anullo'
            }}
          </button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
