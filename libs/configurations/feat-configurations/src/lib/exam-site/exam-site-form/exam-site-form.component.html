<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="name"
      name="Name"
      [(ngModel)]="examSite.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examSite.name }" />
    <small class="p-error block" *ngIf="submitted && !examSite.name">
      Emri është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="Address">Adresa</label>
    <input
      type="text"
      pInputText
      id="address"
      name="Address"
      [(ngModel)]="examSite.address"
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examSite.address }" />
    <small class="p-error block" *ngIf="submitted && !examSite.address">
      Adresa është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="quotes">Kuotat</label>
    <input
      type="text"
      pInputText
      id="quotes"
      name="quotes"
      [(ngModel)]="examSite.quota"
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examSite.quota }" />
    <small class="p-error block" *ngIf="submitted && !examSite.quota">
      Kuota është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="AdministrationOffice">DAR/ZA *</label>
    <p-dropdown
      id="AdministrationOffice"
      [options]="administrationOffices"
      optionValue="key"
      (onChange)="onAdministrationOfficeChanged($event)"
      (onClear)="onAdministrationOfficeChanged($event)"
      optionLabel="value"
      name="administrationOfficeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSite.administrationOfficeId"
      [required]="true"
      [showClear]="true"
      appendTo="body"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSite.administrationOfficeId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examSite.administrationOfficeId">
      DAR/ZA është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="highSchools">Shkolla *</label>
    <p-multiSelect
      id="highSchools"
      [options]="highSchools"
      optionValue="key"
      defaultLabel="Selekto Shkollat"
      optionLabel="value"
      name="highSchools"
      (onChange)="onHighSchoolChanged($event)"
      (onClear)="onHighSchoolChanged($event)"
      [(ngModel)]="examSite.highSchoolIds"
      [required]="true"
      [showClear]="true"
      display="chip"
      appendTo="body"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSite.highSchoolIds
      }">
    </p-multiSelect>
    <small class="p-error block" *ngIf="submitted && !examSite.highSchoolIds">
      Shkolla është fushë e kërkuar.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
