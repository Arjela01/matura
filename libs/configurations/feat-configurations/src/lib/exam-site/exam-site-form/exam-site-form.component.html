<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="name"
      name="Name"
      [(ngModel)]="examSite.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examSite.name }" />
    <small class="p-error block" *ngIf="submitted && !examSite.name">
      Emri është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="Address">Adresa</label>
    <input
      type="text"
      pInputText
      id="address"
      name="Address"
      [(ngModel)]="examSite.address"
      autofocus />
  </div>

  <div class="field">
    <label for="quotes">Kuotat</label>
    <input
      type="text"
      pInputText
      id="quotes"
      name="quotes"
      [(ngModel)]="examSite.quota"
      autofocus />
  </div>

  <div class="field">
    <label for="AdministrationOffice">ZVAP *</label>
    <p-dropdown
      id="AdministrationOffice"
      [options]="administrationOffices"
      optionValue="key"
      (onChange)="onAdministrationOfficeChanged($event)"
      (onClear)="onAdministrationOfficeChanged($event)"
      optionLabel="value"
      name="administrationOfficeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSite.administrationOfficeId"
      [required]="true"
      [filter]="true"
      [showClear]="true"
      appendTo="body"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSite.administrationOfficeId,
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examSite.administrationOfficeId">
      DAR/ZA është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="highSchools">Shkolla *</label>
    <p-multiSelect
      id="highSchools"
      [options]="highschools"
      optionValue="key"
      [defaultLabel]="examSite.id ? '' : 'Zgjidh shkollat'"
      optionLabel="value"
      name="highSchools"
      (onChange)="onHighSchoolChanged($event)"
      (onClear)="onHighSchoolChanged($event)"
      [(ngModel)]="examSite.highschoolIds"
      [required]="true"
      [showClear]="true"
      display="chip"
      appendTo="body"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSite.highschoolIds,
      }">
    </p-multiSelect>
    <small class="p-error block" *ngIf="submitted && !examSite.highschoolIds">
      Shkolla është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
  <label class="mb-3">Është vjeshtë? *</label>
    <div class="formgrid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallTrue"
          name="IsFall"
          [value]="true"
          [(ngModel)]="examSite.isFall"></p-radioButton>
        <label for="IsFallTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallFalse"
          name="IsFall"
          [value]="false"
          [(ngModel)]="examSite.isFall"></p-radioButton>
        <label for="IsFallFalse">Jo</label>
      </div>
    </div>
    </div>


  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
