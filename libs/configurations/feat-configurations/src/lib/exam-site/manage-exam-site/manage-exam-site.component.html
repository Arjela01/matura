<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Qendra Provimi</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-exam-site-grid
        [examSites]="(examSites$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamSites($event)"
        [selectedRecord]="selectedRecord"
        [id]="id"
        [headerText]="headerText"
        [displayHistoryForm]="displayHistoryForm">
      </msh-exam-site-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e Qendrës së Provimit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-exam-site-form
      [examSitesDetails]="selectedExamSite"
      [highschools]="highSchools"
      [administrationOffices]="administrationOffices"
      (administrationOfficeChanged)="onAdministrationOfficeChanged($event)"
      (highSchoolChanged)="onHighSchoolChanged($event)"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-exam-site-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
<ng-container *ngIf="academicYear$ | async"></ng-container>
