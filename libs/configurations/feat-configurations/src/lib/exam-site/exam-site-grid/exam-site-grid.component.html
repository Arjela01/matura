<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examSites"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamSites"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="address">
        Adresa
        <p-sortIcon field="address"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="address"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="quota">
        Kuotat
        <p-sortIcon field="quota"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="quota"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="administrationOffice">
        DAR/ZA
        <p-sortIcon field="administrationOffice"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="administrationOffice"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="academicYear">
        Viti
        <p-sortIcon field="academicYear"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="academicYear"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-academicYear>
    <tr>
      <td style="width: 14%; min-width: 10rem">
        {{ academicYear.name }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ academicYear.address }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ academicYear.quota }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ academicYear.administrationOfficeName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ academicYear.academicYear }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(academicYear)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(academicYear)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
