<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="examSites"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamSites"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <div>
          <p-sortIcon field="name"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="name"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="address">
        Adresa
        <div>
          <p-sortIcon field="address"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="address"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="quota">
        Kuotat
        <div>
          <p-sortIcon field="quota"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="quota"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="administrationOfficeName">
        ZVAP
        <div>
          <p-sortIcon field="administrationOfficeName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="administrationOfficeName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="academicYear">
        Viti
        <div>
          <p-sortIcon field="academicYear"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="academicYear"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="isFall">
        Vjeshtë?
        <div>
          <p-sortIcon field="isFall"></p-sortIcon>
          <p-columnFilter
            type="boolean"
            field="isFall"
            matchMode="equals"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examSite>
    <tr>
      <td style="width: 18%; min-width: 10rem">
        {{ examSite.name }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examSite.address }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examSite.quota }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examSite.administrationOfficeName }}
      </td>
      <td style="width: 18%; min-width: 10rem">
        {{ examSite.academicYear }}
      </td>
      <td style="width: 5%; min-width: 10rem">
        {{ examSite.isFall | app_bool }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examSite)"
            pTooltip="Ndrysho" />

          <img
             src="assets/svg/history.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onHistoryClick(examSite)"
            pTooltip="Historia" />
          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examSite)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
<p-dialog
  [(visible)]="displayHistoryForm"
  [style]="{ width: '80%' }"
  [modal]="true"
  [header]="headerText"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid">
  <ng-template pTemplate="content">
    <msh-exam-site-history
      [recordId]="id"
      [recordData]="selectedRecord">
    </msh-exam-site-history>
  </ng-template>
</p-dialog>
