<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  stateStorage="local"
  stateKey="ay-local"
  [value]="academicYears"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedAcademicYears"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="year">
        Kodi
        <p-sortIcon field="year"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="year"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="isActive">
        Është Aktiv?
        <p-sortIcon field="isActive"></p-sortIcon>
      </th>
      <th pSortableColumn="isFall">
        Vjeshtë
        <p-sortIcon field="isFall"></p-sortIcon>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-academicYear>
    <tr>
      <td style="width: 33%; min-width: 10rem">
        {{ academicYear.year }}
      </td>
      <td style="width: 33%; min-width: 10rem">
        {{ academicYear.isActive ? 'Po' : 'Jo' }}
      </td>

      <td style="width: 33%; min-width: 10rem">
        {{ academicYear.isFall ? 'Po' : 'Jo' }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(academicYear)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m mr-2 pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(academicYear)" />
        <img
          src="assets/svg/import.svg"
          class="p-button-rounded p-button-danger p-button-text ml-m pointer"
          pTooltip="Importo"
          tooltipPosition="bottom"
          (click)="onImportClick(academicYear)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
