<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field p-fluid">
    <label for="Year">Viti *</label>
    <input
      type="number"
      min="2000"
      pInputText
      id="Year"
      name="Year"
      [(ngModel)]="academicYear.year"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !academicYear.year }" />
    <small class="p-error block" *ngIf="submitted && !academicYear.year">
      Viti është fushë e kërkuar.
    </small>
    <small class="p-error block" *ngIf="academicYear.year !== '' && academicYear.year !== null && +academicYear.year < 2000">
      Viti duhet të jetë më i madh se 2000.
    </small>
  </div>

  <div class="field">
    <label class="mb-3">Është aktiv? *</label>
    <div class="formgrid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsActiveTrue"
          name="IsActive"
          [value]="true"
          [(ngModel)]="academicYear.isActive"></p-radioButton>
        <label for="IsActiveTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsActiveFalse"
          name="IsActive"
          [value]="false"
          [(ngModel)]="academicYear.isActive"></p-radioButton>
        <label for="IsActiveFalse">Jo</label>
      </div>
    </div>
  </div>


  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
