<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  stateStorage="local"
  stateKey="profile-group-local"
  [value]="profileGroups"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedProfileGroups"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="Name">
        Emri
        <p-sortIcon field="Name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="Name"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="Ordering">
        Renditja
        <p-sortIcon field="Ordering"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="Ordering"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-profileGroup>
    <tr>
      <td style="width: 50%; min-width: 10rem">
        {{ profileGroup.name }}
      </td>
      <td style="width: 50%; min-width: 10rem">
        {{ profileGroup.ordering }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(profileGroup)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(profileGroup)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
