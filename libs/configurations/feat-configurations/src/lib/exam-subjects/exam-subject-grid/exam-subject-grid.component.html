<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examSubjects"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamSubjects"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Menaxho Lëndët e Provimeve</h5>
      <span class="block mt-2 md:mt-0 p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Kërko..."
          class="w-full sm:w-auto" />
      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox (click)="onSelectAllClick()">
        </p-tableHeaderCheckbox>
      </th>
      <th pSortableColumn="code">
        Kodi
        <p-sortIcon field="code"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="code"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="examType">
        Tipi i provimit
        <p-sortIcon field="examType"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examType"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="academicYear">
        Viti akademik
        <p-sortIcon field="academicYear"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="academicYear"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="credits">
        Kredite
        <p-sortIcon field="credits"></p-sortIcon>
        <p-columnFilter
          type="number"
          field="credits"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="isOptional">
        Është Opsional?
        <p-sortIcon field="isOptional"></p-sortIcon>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examSubject>
    <tr>
      <td>
        <p-tableCheckbox [value]="examSubject"></p-tableCheckbox>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ examSubject.code }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ examSubject.name }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ examSubject.credits }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ examSubject.isOptional}}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(examSubject)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examSubject)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
