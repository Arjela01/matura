<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="examVariant.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examVariant.name }" />
    <small class="p-error block" *ngIf="submitted && !examVariant.name">
      Emri është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="NumberOfQuestions">Numri i pyetjeve *</label>
    <input
      type="number"
      pInputText
      id="NumberOfQuestions"
      name="NumberOfQuestions"
      [(ngModel)]="examVariant.numberOfQuestions"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.numberOfQuestions
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examVariant.numberOfQuestions">
      Numri i pyetjeve është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ProfileGroups">Grupi i Profileve</label>
    <p-dropdown
      id="profileGroups"
      [options]="profileGroups"
      optionValue="key"
      optionLabel="value"
      name="profileGroupId"
      [filter]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examVariant.profileGroupId"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.profileGroupId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examVariant.profileGroupId">
      Grupi i Profileve është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="Variant">Varianti *</label>
    <input
      type="text"
      pInputText
      id="Variant"
      name="Variant"
      [(ngModel)]="examVariant.variant"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.variant
      }" />
    <small class="p-error block" *ngIf="submitted && !examVariant.variant">
      Varianti është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ProfileGroups">Tipi i Provimit</label>
    <p-dropdown
      id="examTypes"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      appendTo="body"
      [filter]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examVariant.examTypeId"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.examTypeId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examVariant.examTypeId">
      Tipi i Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ProfileGroups">Lënda e Provimit</label>
    <p-dropdown
      id="examSubjects"
      [options]="examSubjects"
      optionValue="key"
      optionLabel="value"
      name="examSubjectId"
      [filter]="true"
      appendTo="body"
      [autoDisplayFirst]="false"
      [(ngModel)]="examVariant.examSubjectId"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.examSubjectId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examVariant.examSubjectId">
      Lënda e Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="Code">Kodi *</label>
    <input
      type="text"
      pInputText
      id="Code"
      name="Code"
      [(ngModel)]="examVariant.code"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examVariant.code }" />
    <small class="p-error block" *ngIf="submitted && !examVariant.code">
      Kodi është fushë e kërkuar.
    </small>
  </div>
  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
