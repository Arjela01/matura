<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="examVariant.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examVariant.name }" />
    <small class="p-error block" *ngIf="submitted && !examVariant.name">
      Emri është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ProfileGroups">Grupi i Profileve</label>
    <p-dropdown
      id="profileGroups"
      [options]="profileGroups"
      optionValue="key"
      optionLabel="value"
      name="profileGroupId"
      [filter]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examVariant.profileGroupId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.profileGroupId
      }">
    </p-dropdown>
  </div>
  <div class="field">
    <label for="ProfileGroups">Profili *</label>
    <p-dropdown
      id="profileGroups"
      [options]="profiles"
      optionValue="key"
      optionLabel="value"
      name="profileGroupId"
      [filter]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examVariant.profileId"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.profileGroupId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examVariant.profileGroupId">
       Profili është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ProfileGroups">Tipi i Provimit</label>
    <p-dropdown
      id="examTypes"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      appendTo="body"
      (onChange)="refreshExamSubjects()"
      [filter]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examVariant.examTypeId"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examType
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examType">
      Tipi i Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ProfileGroups">Lënda e Provimit</label>
    <p-dropdown
      id="examSubjects"
      [options]="examSubjects"
      optionValue="key"
      optionLabel="value"
      name="examSubjectId"
      [filter]="true"
      appendTo="body"
      [autoDisplayFirst]="false"
      [(ngModel)]="examVariant.examSubjectId"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.examSubjectId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examVariant.examSubjectId">
      Lënda e Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="academicYearSelect">Viti Shkollor</label>
    <p-dropdown
      [style]="{ minWidth: '250px' }"
      id="academicYearSelect"
      [options]="academicYears"
      optionLabel="value"
      optionValue="key"
      [(ngModel)]="academicYear!!.id"
      name="id"
      appendTo="body"
      [filter]="true"
      [autoDisplayFirst]="false"
      [showClear]="true">
    </p-dropdown>
  </div>
  <div class="field">
    <label for="MaximumScore">Pikët maksimale *</label>
    <input
      type="number"
      pInputText
      id="MaximumScore"
      name="MaximumScore"
      [(ngModel)]="examVariant.maximumScore"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.maximumScore
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examVariant.numberOfQuestions">
      Pikët maksimale është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="NumberOfQuestions">Numri i pyetjeve *</label>
    <input
      type="number"
      pInputText
      id="NumberOfQuestions"
      name="NumberOfQuestions"
      [(ngModel)]="examVariant.numberOfQuestions"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examVariant.numberOfQuestions
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examVariant.numberOfQuestions">
      Numri i pyetjeve është fushë e kërkuar.
    </small>
  </div>
  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
