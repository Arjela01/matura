<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examVariants"
  [scrollable]="true"
  scrollHeight="820px"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamVariants"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <div>
          <p-sortIcon field="name"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="name"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examTypeName">
        Tipi i Provimit
        <div>
          <p-sortIcon field="examTypeName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examTypeName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examSubjectName">
        Lënda e Provimit
        <div>
          <p-sortIcon field="examSubjectName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examSubjectName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="numberOfQuestions">
        Numri i pyetjeve
        <div>
          <p-sortIcon field="numberOfQuestions"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="numberOfQuestions"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="maximumScore">
        Pikët maksimale
        <div>
          <p-sortIcon field="maximumScore"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="maximumScore"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="maximumScore">
        Pikët e Hedhura
        <div>
          <p-sortIcon field="maximumScore"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="maximumScore"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examVariant>
    <tr>
      <td style="width: 15%; min-width: 10rem">
        {{ examVariant.name }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ examVariant.examTypeName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ examVariant.examSubjectName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ examVariant.numberOfQuestions }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ examVariant.maximumScore }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ examVariant.maximumScore }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/plus-sign.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 mt-1 pointer"
            tooltipPosition="bottom"
            (click)="onAddQuestionClick(examVariant)"
            pTooltip="Hidh Pyetjet" />
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examVariant)"
            pTooltip="Ndrysho" />
          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examVariant)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
