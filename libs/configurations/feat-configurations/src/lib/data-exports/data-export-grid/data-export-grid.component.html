<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="dataExports"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedDataExports"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emërtimi
        <div>
          <p-sortIcon field="name"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="name"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="query">
        Proçedura
        <div>
          <p-sortIcon field="query"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="query"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="displayOrder">
        Renditja
        <div>
          <p-sortIcon field="displayOrder"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="displayOrder"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="roles">
        Rolet
        <div>
          <p-sortIcon field="roles"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="roles"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="isVisible">
        Është e Dukshme?
        <div>
          <p-sortIcon field="isVisible"></p-sortIcon>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-dataExport>
    <tr>
      <td style="width: 25%; min-width: 10rem">
        {{ dataExport.name }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ dataExport.query }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ dataExport.displayOrder }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ dataExport.roles }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ dataExport.isVisible ? 'Po' : 'Jo' }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(dataExport)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(dataExport)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
