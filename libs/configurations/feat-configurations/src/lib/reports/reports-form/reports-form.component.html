<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="reports.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !reports.name }" />
    <small class="p-error block" *ngIf="submitted && !reports.name">
      Emri është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="Roles">Rolet</label>
    <p-multiSelect
      id="Roles"
      name="roles"
      [options]="rolesDropdown"
      optionValue="key"
      optionLabel="value"
      [(ngModel)]="reports.roles"
      [required]="true"
      appendTo="body"
      [showClear]="true"
      defaultLabel="Selekto Rolet"
      display="chip"></p-multiSelect>
  </div>
  <div class="field">
    <label for="Path">Linku *</label>
    <input
      type="text"
      pInputText
      id="Path"
      name="Path"
      [(ngModel)]="reports.path"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !reports.name }" />
    <small class="p-error block" *ngIf="submitted && !reports.name">
      Linku është fushë e kërkuar.
    </small>
  </div>
  <div class="field" *ngIf="reports.id">
    <label for="params">Parametrat </label>
    <input
      type="text"
      pInputText
      id="params"
      name="params"
      [(ngModel)]="reports.parameters"
      autofocus
      />
  </div>
  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
