<form #form="ngForm" (ngSubmit)="onSubmit()">

  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="universityDepartment.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !universityDepartment.name }" />
    <small class="p-error block" *ngIf="submitted && !universityDepartment.name">
      Emri është fushë e kërkuar.
    </small>
  </div>


  <div class="field">
    <label for="City">Universiteti *</label>
    <p-dropdown
      id="City"
      [options]="universities"
      optionValue="key"
      optionLabel="value"
      name="cityId"
      [(ngModel)]="universityDepartment.universityId"
      [autoDisplayFirst]="false"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !universityDepartment.universityId
      }">
    </p-dropdown>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
