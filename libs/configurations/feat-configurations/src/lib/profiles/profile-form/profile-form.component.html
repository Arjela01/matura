<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Code">Kodi *</label>
    <input
      type="text"
      pInputText
      id="Code"
      name="Code"
      [(ngModel)]="profile.code"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !profile.code }" />
    <small class="p-error block" *ngIf="submitted && !profile.code">
      Kodi është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="profile.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !profile.name }" />
    <small class="p-error block" *ngIf="submitted && !profile.name">
      Emri është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label class="mb-3">Është Teknike? *</label>
    <div class="formgrid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsTechnicalTrue"
          name="IsTechnical"
          [value]="true"
          [(ngModel)]="profile.isTechnical"></p-radioButton>
        <label for="IsTechnicalTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsPublicFalse"
          name="IsPublic"
          [value]="false"
          [(ngModel)]="profile.isTechnical"></p-radioButton>
        <label for="IsPublicFalse">Jo</label>
      </div>
    </div>
  </div>

  <div class="field">
    <label for="Code">Koefiçienti D1</label>
    <input
      type="number"
      pInputText
      id="D1Coefficient"
      name="D1Coefficient"
      [(ngModel)]="profile.d1Coefficient"
      autofocus
      />
  </div>

  <div class="field">
    <label for="Code">Koefiçienti D2 </label>
    <input
      type="number"
      pInputText
      id="D2Coefficient"
      name="D2Coefficient"
      [(ngModel)]="profile.d2Coefficient"
      autofocus
      />
  </div>

  <div class="field mb-5">
    <label for="ProfileGroup">Grupi i Profilit *</label>
    <p-dropdown
      id="ProfileGroup"
      [options]="profileGroups"
      name="regionId"
      optionValue="key"
      optionLabel="value"
      appendTo="body"
      [(ngModel)]="profile.profileGroupID"
      [autoDisplayFirst]="false"
      (onChange)="onProfileGroupChange($event)"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !profile.profileGroupID
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !profile.profileGroupID">
      Grupi i profilit është fushë e kërkuar.
    </small>
  </div>



  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
