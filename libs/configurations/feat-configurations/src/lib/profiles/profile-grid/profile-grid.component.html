<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="profiles"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedProfiles"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Menaxho Profilet</h5>
      <span class="block mt-2 md:mt-0 p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Kërko..."
          class="w-full sm:w-auto" />
      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox (click)="onSelectAllClick()">
        </p-tableHeaderCheckbox>
      </th>
      <th pSortableColumn="code">
        Kodi
        <p-sortIcon field="code"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="code"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="IsTechnical">
        Ështe Teknike?
        <p-sortIcon field="IsTechnical"></p-sortIcon>
      </th>
      <th pSortableColumn="D1Coefficient">
        Koefiçienti D1
        <p-sortIcon field="D1Coefficient"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="D1Coefficient"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="D2Coefficient">
        Koefiçienti D2
        <p-sortIcon field="D2Coefficient"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="D2Coefficient"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="AcademicYear">
        Viti Akademik
        <p-sortIcon field="AcademicYear"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="AcademicYear"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="ProfileGroup">
        Grupi i Profilit
        <p-sortIcon field="ProfileGroup"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="ProfileGroup"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-profile>
    <tr>
      <td>
        <p-tableCheckbox [value]="profile"></p-tableCheckbox>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ profile.code }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ profile.name }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ profile.IsTechnical ? 'Po' : 'Jo' }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ profile.D1Coefficient }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ profile.D2Coefficient }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ profile.AcademicYear }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ profile.ProfileGroup }}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(profile)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(profile)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
