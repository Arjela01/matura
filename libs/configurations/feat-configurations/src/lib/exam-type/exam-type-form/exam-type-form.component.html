<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Name">name</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="examType.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examType.name }"/>
    <small class="p-error block" *ngIf="submitted && !examType.name">
      Name is required.
    </small>
  </div>


  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Cancel"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Save"
      class="p-button-text w-auto"></button>
  </div>
</form>
