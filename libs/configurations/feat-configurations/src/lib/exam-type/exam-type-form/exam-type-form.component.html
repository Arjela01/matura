<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="examType.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examType.name }" />
    <small class="p-error block" *ngIf="submitted && !examType.name">
      Emri është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="MaximumValueWritingScore">Pikët maksimale me shtjellim *</label>
    <input
      type="text"
      pInputText
      id="maximumValueWritingScore"
      name="maximumValueWritingScore"
      [(ngModel)]="examType.maximumValueWritingScore"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examType.maximumValueWritingScore
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examType.maximumValueWritingScore">
      Pikët maksimale është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="MaximumValueMultipleScore"
      >Pikët maksimale me alternativa *</label
    >
    <input
      type="text"
      pInputText
      id="maximumValueMultipleScore"
      name="maximumValueMultipleScore"
      [(ngModel)]="examType.maximumValueMultipleScore"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examType.name }" />
    <small class="p-error block" *ngIf="submitted && !examType.name">
      Pikët maksimale është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label class="mb-3">Është Vjeshtë? *</label>
    <div class="form grid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallTrue"
          name="IsFallTrue"
          [value]="true"
          [(ngModel)]="examType.isFall"></p-radioButton>
        <label for="IsFallTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallFalse"
          name="IsFall"
          [value]="false"
          [(ngModel)]="examType.isFall"></p-radioButton>
        <label for="IsFallFalse">Jo</label>
      </div>
    </div>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
