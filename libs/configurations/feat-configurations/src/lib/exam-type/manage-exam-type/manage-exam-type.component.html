<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <!-- TODO: this can be reusable -->
      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-left">
          <div class="my-2">
            <button
              pButton
              pRipple
              label="New"
              icon="pi pi-plus"
              class="p-button-success mr-2"
              (click)="onNewClick()"></button>
            <button
              pButton
              pRipple
              label="Delete"
              icon="pi pi-trash"
              class="p-button-danger"
              [disabled]="(hasSelectedExamTypes$ | async) === false"
              (click)="onDeleteSelectedClick()"></button>
          </div>
        </div>
        <div class="p-toolbar-group-right">
          <button
            pButton
            pRipple
            label="Export"
            icon="pi pi-upload"
            class="p-button-help"></button>
        </div>
      </p-toolbar>

      <msh-exam-type-grid
        [examTypes]="(examTypes$ | async) || []"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamTypes($event)">
      </msh-exam-type-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="examTypeDialog"
  [style]="{ width: '500px' }"
  header="Exam Types Details"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onFormClose()">
  <ng-template pTemplate="content">
    <msh-exam-type-form
      [examTypeDetails]="activeExamTypes$ | async"
      (formClose)="onFormClose()"
      (formSave)="onFormSave($event)"></msh-exam-type-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Confirm"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="No"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Yes"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
