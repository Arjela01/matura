<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examTypes"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamTypes"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="maximumValueWritingScore">
        Pikët maksimale me shtjellim
        <p-sortIcon field="maximumValueWritingScore"></p-sortIcon>
        <p-columnFilter
          type="number"
          field="maximumValueWritingScore"
          display="menu"></p-columnFilter>
      </th>

      <th pSortableColumn="maximumValueMultipleScore">
        Pikët maksimale me alternativa
        <p-sortIcon field="maximumValueMultipleScore"></p-sortIcon>
        <p-columnFilter
          type="number"
          field="maximumValueMultipleScore"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examType>
    <tr>
      <td style="width: 30%">
        {{ examType.name }}
      </td>
      <td style="width: 30%">
        {{ examType.maximumValueWritingScore }}
      </td>
      <td style="width: 30%">
        {{ examType.maximumValueMultipleScore }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examType)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examType)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
