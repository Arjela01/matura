<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="universities"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedRegions"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox (click)="onSelectAllClick()">
        </p-tableHeaderCheckbox>
      </th>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="RegionName">
        Rrethi
        <p-sortIcon field="regionName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="regionName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="CityName">
        Qyteti
        <p-sortIcon field="cityName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="cityName"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-university>
    <tr>
      <td>
        <p-tableCheckbox [value]="university"></p-tableCheckbox>
      </td>

      <td style="width: 30%; min-width: 10rem">
        {{ university.name }}
      </td>
      <td style="width: 30%; min-width: 10rem">
        {{ university.regionName }}
      </td>
      <td style="width: 30%; min-width: 10rem">
        {{ university.cityName }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(university)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(university)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
