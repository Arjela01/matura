<form #form="ngForm" (ngSubmit)="onSubmit()">

  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="region.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !region.name }" />
    <small class="p-error block" *ngIf="submitted && !region.name">
      Emri është fushë e kërkuar.
    </small>
  </div>


  <div class="field mb-5">
    <label for="Region">Rrethi *</label>
    <p-dropdown
            id="Region"
            [options]="regions"
            name="regionId"
            optionValue="key"
            optionLabel="value"
            [(ngModel)]="university.regionId"
            [autoDisplayFirst]="false"
            (onChange)="onRegionChange($event)"
            [showClear]="true"
            [ngClass]="{
        'ng-invalid ng-dirty': submitted && !university.regionID
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !university.regionID">
      Rrethi është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="City">Qyteti/Fshati *</label>
    <p-dropdown
            id="City"
            [options]="citiesFiltered"
            optionValue="key"
            optionLabel="value"
            name="cityId"
            [(ngModel)]="university.cityId"
            [autoDisplayFirst]="false"
            [showClear]="true"
            [ngClass]="{
        'ng-invalid ng-dirty': submitted && !university.cityId
      }">
    </p-dropdown>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"></button>
  </div>
</form>
