<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="administrationOffices"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedAdministrationOffices"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        ZVAP
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="isAllowedToLogin">
        Statusi
        <p-sortIcon field="isAllowedToLogin"></p-sortIcon>
        <p-columnFilter
          type="custom"
          field="isAllowedToLogin"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th>Veprime</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-activateOverseer>
    <tr>
      <td style="width: 40%">
        {{ activateOverseer.cityName }}
      </td>

      <td style="width: 14%; min-width: 10rem">
        <span
          [ngClass]="
            activateOverseer.isAllowedToLogin === true
              ? ['bg-red-300', 'red-text', 'px-3', 'py-1', 'fb']
              : ['bg-green-300', 'green-text', 'px-3', 'py-1', 'fb']
          ">
          {{
            activateOverseer.isAllowedToLogin === true ? 'Jo Aktiv' : 'Aktiv'
          }}
        </span>
      </td>
      <td style="width: 14%; min-width: 10rem">
        <div class="flex">
          <button
            pButton
            pRipple
            class="p-button-rounded p-button-plain p-button-text mr-2 pointer"
            (click)="changeStatus(activateOverseer)"
            [ngClass]="
              activateOverseer.isAllowedToLogin === true
                ? ['bg-green-300', 'green-text', 'px-3', 'py-1', 'fb']
                : ['bg-red-300', 'red-text', 'px-3', 'py-1', 'fb']
            ">
            {{
              activateOverseer.isAllowedToLogin === true
                ? 'Aktivizo'
                : 'Çaktivizo'
            }}
          </button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
