<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="administrationOffices"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedAdministrationOffices"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="cityName">
        ZVAP
        <div>
          <p-sortIcon field="cityName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="cityName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="isAllowedToLogin">
        Statusi
        <div>
          <p-sortIcon field="isAllowedToLogin"></p-sortIcon>
          <p-columnFilter
            type="boolean"
            matchMode="equals"
            field="isAllowedToLogin"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th>Veprime</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-activateOverseer>
    <tr>
      <td style="width: 40%">
        {{ activateOverseer.name }}
      </td>

      <td style="width: 14%; min-width: 10rem">
        <span
          [ngClass]="
            activateOverseer.isAllowedToLogin === true
              ? ['bg-green-300', 'green-text', 'px-3', 'py-1', 'fb']
              : ['bg-red-300', 'red-text', 'px-3', 'py-1', 'fb']
          ">
          {{
            activateOverseer.isAllowedToLogin === true ? 'Aktiv' : ' Jo Aktiv'
          }}
        </span>
      </td>
      <td style="width: 14%; min-width: 10rem">
        <div class="flex">
          <button
            pButton
            pRipple
            class="p-button-rounded p-button-plain p-button-text mr-2 pointer"
            (click)="changeStatus(activateOverseer)"
            [ngClass]="
              activateOverseer.isAllowedToLogin === true
                ? ['bg-red-300', 'red-text', 'px-3', 'py-1', 'fb']
                : ['bg-green-300', 'green-text', 'px-3', 'py-1', 'fb']
            ">
            {{
              activateOverseer.isAllowedToLogin === true
                ? 'Çaktivizo'
                : 'Aktivizo'
            }}
          </button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
