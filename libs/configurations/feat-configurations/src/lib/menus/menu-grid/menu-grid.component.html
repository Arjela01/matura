<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="menus"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedMenus"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Menaxho Menutë</h5>
      <span class="block mt-2 md:mt-0 p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Kërko..."
          class="w-full sm:w-auto" />
      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox (click)="onSelectAllClick()">
        </p-tableHeaderCheckbox>
      </th>
      <th pSortableColumn="displayOrder">
        Renditja
        <p-sortIcon field="displayOrder"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="displayOrder"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="text">
        Emërtimi
        <p-sortIcon field="text"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="text"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="url">
        Url
        <p-sortIcon field="url"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="url"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="isVisible">
        Ështe E Dukshme?
        <p-sortIcon field="isVisible"></p-sortIcon>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-menu>
    <tr>
      <td>
        <p-tableCheckbox [value]="menu"></p-tableCheckbox>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ menu.displayOrder }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ menu.text }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ menu.url }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ menu.isVisible ? 'Po' : 'Jo' }}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(menu)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(menu)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
