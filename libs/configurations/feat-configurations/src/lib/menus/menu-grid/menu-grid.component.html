<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="menus"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedMenus"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="text">
        Emërtimi
        <div>
          <p-sortIcon field="text"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="text"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="url">
        Url
        <div>
          <p-sortIcon field="url"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="url"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="displayOrder">
        Renditja
        <div>
          <p-sortIcon field="displayOrder"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="displayOrder"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="parentText">
        Prindi
      </th>
      <th pSortableColumn="roles">
        Rolet
      </th>
      <th pSortableColumn="isVisible">
        Ështe E Dukshme?
        <div>
          <p-sortIcon field="isVisible"></p-sortIcon>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-menu>
    <tr>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.text }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.url }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.displayOrder }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.parentText }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.roles }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.isVisible ? 'Po' : 'Jo' }}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(menu)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(menu)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
