<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="menus"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalStudentRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedMenus"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="text">
        Emërtimi
        <div>
          <p-sortIcon field="text"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="text"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="url">
        Url
        <div>
          <p-sortIcon field="url"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="url"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="displayOrder">
        Renditja
        <div>
          <p-sortIcon field="displayOrder"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="displayOrder"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="parentText">
        Prindi
        <div>
          <p-sortIcon field="parentText"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="parentText"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="roles">
        Rolet
        <div>
          <p-sortIcon field="roles"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="roles"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="isVisible">
        Është e Dukshme?
        <div>
          <p-sortIcon field="isVisible"></p-sortIcon>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-menu>
    <tr>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.text }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.url }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.displayOrder }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.parentText }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.roles }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ menu.isVisible ? 'Po' : 'Jo' }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(menu)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(menu)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
