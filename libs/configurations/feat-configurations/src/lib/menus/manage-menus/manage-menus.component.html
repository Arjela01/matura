<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Menu</h2>
  <div class="flex align-items-center justify-content-center">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
  </div>
</div>

<div class="grid">
  <div class="col-9 m-auto">
    <div class="card">
      <msh-menu-tree [treeData]="treeData" (gridEvent)="onGridEvent($event)">
      </msh-menu-tree>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e Menusë"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-menu-form
      [parentMenus]="parentMenus"
      [roles]="roles"
      [menuDetails]="selectedMenu"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-menu-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
