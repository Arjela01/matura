<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card px-6 py-6">
    <h3>Detajet e Maturantit</h3>

    <form #form="ngForm"   *ngIf="student !== null">

      <div class="field" [style]="{ width: '500px' }">
        <label for="highSchool">Shkolla</label>
        <input
          type="text"
          pInputText
          id="highSchool"
          name="highSchool"
          [(ngModel)]="student.highSchoolName"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="schoolProfile">Profili Shkollës</label>
        <input
          type="text"
          pInputText
          id="schoolProfile"
          name="schoolProfile"
          [(ngModel)]="student.profileName"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label class="mb-3">Sesioni i Vjeshtës? *</label>
        <div class="formgrid grid">
          <div class="field-radiobutton col-6">
            <p-radioButton
              id="IsFallTrue"
              name="IsFall"
              [value]="true"
              [(ngModel)]="student.isFall"
              [disabled]="student.isFall"
            ></p-radioButton>
            <label for="IsFallTrue">Po</label>
          </div>
          <div class="field-radiobutton col-6">
            <p-radioButton
              id="IsFallFalse"
              name="IsFall"
              [value]="false"
              [(ngModel)]="student.isFall"
              [disabled]="student.isFall"
            ></p-radioButton>
            <label for="IsFallFalse">Jo</label>
          </div>
        </div>
      </div>

<!--      <div class="field" [style]="{ width: '500px' }">-->
<!--        <label class="mb-3">Është A2A3? *</label>-->
<!--        <div class="formgrid grid">-->
<!--          <div class="field-radiobutton col-6">-->
<!--            <p-radioButton-->
<!--              id="isA2A3True"-->
<!--              name="isA2A3"-->
<!--              [value]="true"-->
<!--              [(ngModel)]="student.isA2A3"></p-radioButton>-->
<!--            <label for="isA2A3True">Po</label>-->
<!--          </div>-->
<!--          <div class="field-radiobutton col-6">-->
<!--            <p-radioButton-->
<!--              id="isA2A3False"-->
<!--              name="isA2A3"-->
<!--              [value]="false"-->
<!--              [(ngModel)]="student.isA2A3"></p-radioButton>-->
<!--            <label for="isA2A3False">Jo</label>-->
<!--          </div>-->
<!--        </div>-->
<!--      </div>-->

      <div class="field" [style]="{ width: '500px' }">
        <label for="SchoolFinished">Shkolla qe kam perfunduar *</label>
        <input
          type="text"
          pInputText
          id="SchoolFinished"
          name="SchoolFinished"
          [(ngModel)]="student.schoolFinished"
          [(ngModel)]="student.schoolFinished"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="graduationYear"
          >Viti i përfundimit te shkollës së mesme? *</label
        >
        <p-calendar
          [(ngModel)]="student.graduationYear"
          dateFormat="yy"
          view="year"
          inputId="graduationYear"
          id="graduationYear"
          name="graduationYear"
          disabled
         ></p-calendar>
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="IdCard">Karta Identitetit *</label>
        <input
          type="text"
          pInputText
          id="IdCard"
          name="IdCard"
          [(ngModel)]="student.idCard"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="OldID">ID e vjetër e maturës *</label>
        <input
          type="number"
          pInputText
          id="OldID"
          name="OldID"
          [(ngModel)]="student.oldId"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="firstName">Emri *</label>
        <input
          type="text"
          pInputText
          id="firstName"
          name="firstName"
          [(ngModel)]="student.firstName"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="middleName">Atësia *</label>
        <input
          type="text"
          pInputText
          id="middleName"
          name="firstName"
          [(ngModel)]="student.middleName"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="lastName">Mbiemri *</label>
        <input
          type="text"
          pInputText
          id="lastName"
          name="lastName"
          [(ngModel)]="student.lastName"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="birthDate">Datëlindja * </label>
        <p-calendar
          [(ngModel)]="student.birthDate"
          dateFormat="dd-mm-yy"
          inputId="birthDate"
          id="birthDate"
          name="birthDate"
          disabled></p-calendar>
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="birthPlace">Vendlindja *</label>
        <input
          type="text"
          pInputText
          id="birthPlace"
          name="birthPlace"
          [ngModel]="student.birthPlace"
          disabled/>
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="gender">Gjinia *</label>
        <input
          type="text"
          pInputText
          id="gender"
          name="genders"
          [(ngModel)]="student.genderId"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="studyClass">Klasa *</label>
        <input
          type="text"
          pInputText
          id="studyClass"
          name="studyClass"
          [(ngModel)]="student.studyClass"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="session">Seksioni *</label>
        <input
          type="text"
          pInputText
          id="session"
          name="session"
          [(ngModel)]="student.session"
          disabled />
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="Email">Email *</label>
        <input
          type="email"
          pInputText
          id="Email"
          name="Email"
          [(ngModel)]="student.email"
          disabled/>
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label for="Cel">Cel *</label>
        <input
          type="cel"
          pInputText
          id="Cel"
          name="Cel"
          [(ngModel)]="student.mobilePhone"
          disabled/>
      </div>

      <div class="field" [style]="{ width: '500px' }">
        <label class="mb-3">Është Konfirmuar Nga Mbikëqyrësi? *</label>
        <div class="formgrid grid" >
          <div class="field-radiobutton col-6">
            <p-radioButton
              id="IsConfirmedBySupervisorTrue"
              name="IsConfirmedBySupervisor"
              [value]="true"
              [(ngModel)]="student.isConfirmedBySupervisor"
              [disabled]="student.isConfirmedBySupervisor">
              </p-radioButton>
            <label for="IsConfirmedBySupervisorTrue">Po</label>
          </div>
          <div class="field-radiobutton col-6">
            <p-radioButton
              id="IsConfirmedBySupervisorFalse"
              name="IsConfirmedBySupervisor"
              [value]="false"
              [(ngModel)]="student.isConfirmedBySupervisor"
              [disabled]="student.isConfirmedBySupervisor">
              </p-radioButton>
            <label for="IsConfirmedBySupervisorFalse">Jo</label>
          </div>
        </div>
      </div>
    </form>
    </div>
  </div>

</div>
