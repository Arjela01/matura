<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <div class="flex ml-2 mb-2 page-header">
        <h2 class="flex-1 mb-0">Maturantët</h2>
        <div class="flex align-items-right justify-content-right">
          <div class="my-2">
            <a href="/configurations/students-form">
              <button
                pButton
                pRipple
                [label]="hideStudentForm === false ? 'Anullo' : 'Shto'"
                icon="pi pi-plus"
                class="p-button-success mr-2"></button>
            </a>
          </div>
        </div>
      </div>

      <msh-students-grid
        [students]="(studentList$ | async) || []"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getStudent($event)">
      </msh-students-grid>
    </div>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="No"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Yes"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
