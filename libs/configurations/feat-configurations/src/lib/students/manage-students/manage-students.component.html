<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-left">
          <div class="my-2">
            <a href="/configurations/students-form">
              <button
                pButton
                pRipple
                [label]="hideStudentForm === false ? 'Anullo' : 'Shto'"
                icon="pi pi-plus"
                class="p-button-success mr-2"></button>
            </a>
            <button
              pButton
              pRipple
              label="Fshi"
              icon="pi pi-trash"
              class="p-button-danger"
              [disabled]="selectedStudentList.length === 0"
              (click)="onDeleteSelectedClick()"></button>
          </div>
        </div>
        <div class="p-toolbar-group-right">
          <button
            pButton
            pRipple
            label="Eksporto"
            icon="pi pi-upload"
            class="p-button-help"></button>
        </div>
        </p-toolbar>
        <msh-students-grid
          [students]="(studentList$ | async) || []"
          (gridEvent)="onGridEvent($event)"
          (lazyLoadData)="getStudent($event)">
        </msh-students-grid>
    </div>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="No"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Yes"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
