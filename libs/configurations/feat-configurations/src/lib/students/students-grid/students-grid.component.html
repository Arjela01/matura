<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="students"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedStudents"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Menaxho Maturantët</h5>
      <span class="block mt-2 md:mt-0 p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Kërko..."
          class="w-full sm:w-auto" />
      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox (click)="onSelectAllClick()">
        </p-tableHeaderCheckbox>
      </th>
      <th pSortableColumn="highSchool">
        Shkolla
        <p-sortIcon field="highSchool"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="highSchool"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="ID">
        ID
        <p-sortIcon field="ID"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="ID"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="firstName">
        Emri
        <p-sortIcon field="firstName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="firstName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="middleName">
        Atësia
        <p-sortIcon field="middleName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="middleName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="lastName">
        Mbiemri
        <p-sortIcon field="lastName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="lastName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="birthDate">
        Datëlindja
        <p-sortIcon field="birthDate"></p-sortIcon>
        <p-columnFilter
          type="number"
          field="birthDate"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="idCard">
        NID
        <p-sortIcon field="birthDate"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="idCard"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="schoolProfile">
        Profili Shkollës
        <p-sortIcon field="schoolProfile"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="schoolProfile"
          display="menu"></p-columnFilter>
      </th>
<!--      <th pSortableColumn="isPublic">-->
<!--        Ështe Publik?-->
<!--        <p-sortIcon field="isPublic"></p-sortIcon>-->
<!--      </th>-->
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <td>
        <p-tableCheckbox [value]="student"></p-tableCheckbox>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.highSchool }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.studentId }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.firstName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.middleName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.lastName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.birthDate }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.idCard }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.schoolProfile }}
      </td>

      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(student)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(student)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
