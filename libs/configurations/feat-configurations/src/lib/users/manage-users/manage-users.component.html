<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Përdorues</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <msh-user-grid
        [users]="(users$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getUsers($event)">
      </msh-user-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="userDialog"
  [style]="{ width: '500px' }"
  header="Detajet e Përdoruesit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onFormClose()">
  <ng-template pTemplate="content">
    <msh-user-form
      [userDetails]="selectedUser"
      (formClose)="onFormClose()"
      [highSchools]="highSchools"
      [universities]="universities"
      [studyPrograms]="studyPrograms"
      [universityDepartments]="universityDepartments"
      [cities]="cities"
      [administrationOffices]="administrationOffices"
      [roles]="roles"
      (formSave)="onFormSave($event)"></msh-user-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="No"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Yes"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
