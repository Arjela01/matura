<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-left">
          <div class="my-2">
            <button
              pButton
              pRipple
              label="Shto"
              icon="pi pi-plus"
              class="p-button-success mr-2"
              (click)="onNewClick()"></button>
            <button
              pButton
              pRipple
              label="Fshi"
              icon="pi pi-trash"
              class="p-button-danger"
              [disabled]="selectedUsers.length === 0"
              (click)="onDeleteSelectedClick()"></button>
          </div>
        </div>
        <div class="p-toolbar-group-right">
          <button
            pButton
            pRipple
            label="Exporto"
            icon="pi pi-upload"
            class="p-button-help"></button>
        </div>
      </p-toolbar>

      <msh-user-grid
        [users]="(users$ | async) || []"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getUsers($event)">
      </msh-user-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="userDialog"
  [style]="{ width: '500px' }"
  header="Detajet e Përdoruesit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onFormClose()">
  <ng-template pTemplate="content">
    <msh-user-form
      [userDetails]="selectedUser"
      (formClose)="onFormClose()"
      [highSchools]="highSchools"
      [universities]="universities"
      [studyPrograms]="studyPrograms"
      [universityDepartments]="universityDepartments"
      [cities]="cities"
      [administrationOffices]="administrationOffices"
      (formSave)="onFormSave($event)"></msh-user-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="No"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Yes"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
