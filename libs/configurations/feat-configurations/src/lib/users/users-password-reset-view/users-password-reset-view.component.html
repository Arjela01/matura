<form #form="ngForm">
  <p-card>
    <div class="grid">
      <div class="col-12 md:col-6 lg:col-6">
        <div class="copy" #data>

        <div class="field" >
          <strong><label>Përdoruesi : </label></strong>
          <br />
          {{ user.username }}
          <!--    here must to include username or NID this is just for test -->
        </div>

        <div class="field" >
          <strong><label>Fjalkalimi : </label></strong>
          <br />
          {{ user.username }}
          <!--    here must to include password this is just for test -->
        </div>
      </div>
        <button
          (click)="copyToClipboardWithParameter(data)"
          type="button"
          pButton
          icon="pi pi-copy"
          label="Kopjo"
          class="p-button-text w-auto mr-2"
         ></button>
      </div>
      <div class="col-12 md:col-6 lg:col-6">
        <img
          alt="Card"
          width="150px"
          src="https://cdn.pixabay.com/photo/2015/10/30/10/40/key-1013662_960_720.jpg" />
      </div>
    </div>
  </p-card>
</form>
