<form #form="ngForm" (ngSubmit)="onSubmit()">
  <p-card>
    <div class="grid">
      <div class="col-12 md:col-6 lg:col-3">
        <div class="copy" #data>

        <div class="field" >
          <strong><label>Përdoruesi : </label></strong>
          <br />
          {{ user.username }}
          <!--    here must to include username or NID this is just for test -->
        </div>

        <div class="field" >
          <strong><label>Fjalkalimi : </label></strong>
          <br />
          {{ user.username }}
          <!--    here must to include password this is just for test -->
        </div>
      </div>
        <button
          (click)="copyToClipboardWithParameter(data)"
          type="button"
          pButton
          icon="pi pi-copy"
          label="Kopjo"
          class="p-button-text w-auto mr-2"
         ></button>
      </div>
      <div class="col-12 md:col-6 lg:col-9">
        <img
          alt="Card"
          width="300px"
          src="https://primefaces.org/cdn/primeng/images/usercard.png" />
      </div>
    </div>
  </p-card>
</form>
