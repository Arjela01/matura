<form #form="ngForm">
  <div class="field">
    <div class="p-inputgroup">
      <input
        type="text"
        id="copyPassword"
        disabled
        pInputText
        placeholder="{{ userDetails.password }}"
        [(ngModel)]="userDetails.password" />
      <button
        [cdkCopyToClipboard]="userDetails.password"
        type="button"
        pButton
        pRipple
        icon="pi pi-copy"
        label="Kopjo"></button>
    </div>
  </div>
</form>
