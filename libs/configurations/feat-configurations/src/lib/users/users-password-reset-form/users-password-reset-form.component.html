<form #form="ngForm" (ngSubmit)="onSubmit()">

  <div class="field">
    <label for="username">Përdoruesi *</label>
    <input type="text" pInputText id="username" name="username" [(ngModel)]="user.username"  disabled/>
  </div>

    <div class="field">
      <label for="password">Fjalëkalimi i Ri*</label>
      <input type="password" pInputText id="password" name="password" [(ngModel)]="user.password" autofocus [ngClass]="{
          'ng-invalid ng-dirty': submitted && !user.password
        }" />
      <small class="p-error block" *ngIf="submitted && !user.password">
        Fjalëkalimi është fushë e kërkuar.
      </small>
    </div>

  <div class="field">
    <label for="confirmPassword">Konfirmo Fjalëkalimin *</label>
    <input type="password" pInputText id="confirmPassword" name="confirmPassword" [(ngModel)]="user.confirmPassword" autofocus [ngClass]="{
          'ng-invalid ng-dirty': submitted && !user.confirmPassword
        }" />
    <small class="p-error block" *ngIf="submitted && !user.confirmPassword">
      Fjalëkalimi është fushë e kërkuar.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button type="button" pButton icon="pi pi-times" label="Anullo" class="p-button-text w-auto mr-2"
            (click)="onCancelClick()"></button>
    <button type="submit" pButton icon="pi pi-check" label="Ruaj" class="p-button-text w-auto"></button>
  </div>
</form>
