<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="username">Përdoruesi *</label>
    <input
      type="text"
      pInputText
      id="username"
      name="username"
      [(ngModel)]="user.username"
      disabled />
  </div>

  <div class="field">
    <label for="resetPassword">Fjalëkalimi i Ri *</label>
  <p-password
    id="resetPassword"
    [toggleMask]="true"
    name="resetPassword"
    [(ngModel)]="user.resetPassword"
    autofocus
    mshStrongPasswordValidator
    #password="ngModel"
    [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.resetPassword
      }">
    <ng-template pTemplate="header">
      <h6>Zgjidh nje Fjalëkalim</h6>
    </ng-template>
    <ng-template pTemplate="footer">
      <p-divider></p-divider>
      <p class="mt-2">Sugjerime</p>
      <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5">
        <li>Të paktën një shkronjë të vogel</li>
        <li>Të paktën një shkronjë të madhe</li>
        <li>Të paktën një numer</li>
        <li>Minimumi 8 karaktere</li>
      </ul>
    </ng-template>
  </p-password>
  <small class="p-error block" *ngIf="submitted && !user.resetPassword">
    Fjalëkalimi është fushë e kërkuar.
  </small>
  </div>

    <div class="field">
      <label for="confirmPassword">Konfirmo Fjalëkalimin *</label>
      <p-password
        id="confirmPassword"
        [feedback]="false"
        [toggleMask]="true"
        name="confirmPassword"
        [(ngModel)]="user.confirmPassword"
        autofocus
        mshStrongPasswordValidator
        #password="ngModel"
        [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.confirmPassword
      }">
      </p-password>
      <small class="p-error block" *ngIf="submitted && !user.confirmPassword">
        Fjalëkalimi është fushë e kërkuar.
      </small>
    </div>


   <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"
    ></button>
  </div>
</form>
