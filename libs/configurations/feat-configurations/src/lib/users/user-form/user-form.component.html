<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="nid">NID *</label>
    <input
      type="text"
      pInputText
      mshAlbanianNidValidator
      id="nid"
      name="nid"
      [(ngModel)]="user.nid"
      #nidModel="ngModel"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.nid
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && (user.nid === '' || user.nid === null)">
      NID është fushë e kërkuar.
    </small>
    <small
      class="p-error block"
      *ngIf="
        submitted && nidModel.errors && nidModel.errors['albanianNidValidator']
      ">
      NID nuk i përshtatet formatit shqiptar.
    </small>
  </div>
  <div class="field">
    <label for="name">Emri *</label>
    <input
      type="text"
      pInputText
      id="name"
      name="name"
      [(ngModel)]="user.name"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.name
      }" />
    <small class="p-error block" *ngIf="submitted && !user.name">
      Emri është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="lastName">Mbiemri *</label>
    <input
      type="text"
      pInputText
      id="lastName"
      name="lastName"
      [(ngModel)]="user.lastName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.lastName
      }" />
    <small class="p-error block" *ngIf="submitted && !user.lastName">
      Mbiemri është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="userName">Përdoruesi *</label>
    <input
      [disabled]="!!user.id"
      type="text"
      pInputText
      id="userName"
      name="userName"
      [(ngModel)]="user.username"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.username
      }" />
    <small class="p-error block" *ngIf="submitted && !user.username">
      Përdoruesi është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="role">Roli *</label>
    <p-dropdown
      id="role"
      name="role"
      [options]="roles"
      optionValue="key"
      optionLabel="value"
      [required]="true"
      (onChange)="onRoleChange($event)"
      [(ngModel)]="user.roleId"
      [autoDisplayFirst]="false"
      [showClear]="true"
      appendTo="body"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.roleId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !user.roleId">
      Roli është fushë e kërkuar.
    </small>
  </div>

  <div class="field" [hidden]="showAdministrationOffice === false">
    <label for="administrationOfficeId">DAR/ZA *</label>
    <p-dropdown
      id="administrationOfficeId"
      optionValue="key"
      optionLabel="value"
      [options]="administrationOffices"
      [disabled]="showAdministrationOffice === false"
      name="administrationOfficeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.administrationOfficeId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field" [hidden]="showUniversity === false">
    <label for="universityId">Universiteti *</label>
    <p-dropdown
      id="universityId"
      optionValue="key"
      optionLabel="value"
      [options]="universities"
      [disabled]="showUniversity === false"
      name="universityId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.universityId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field" [hidden]="showUniversityDepartment === false">
    <label for="universityDepartmentId">Fakulteti *</label>
    <p-dropdown
      id="universityDepartmentId"
      optionValue="key"
      optionLabel="value"
      [options]="universityDepartments"
      [disabled]="showUniversityDepartment === false"
      name="universityDepartmentId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.universityDepartmentId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field" [hidden]="showStudyProgram === false">
    <label for="studyProgramId">Programi i Studimit *</label>
    <p-dropdown
      id="studyProgramId"
      optionValue="key"
      optionLabel="value"
      [options]="studyPrograms"
      [disabled]="showStudyProgram === false"
      name="studyProgramId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.studyProgramId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field" [hidden]="showOverseerCode === false">
    <label for="overseerCode">Kodi I Mbikqyresit *</label>
    <input
      type="text"
      pInputText
      id="overseerCode"
      name="overseerCode"
      [(ngModel)]="user.overseerCode"
      autofocus />
  </div>

  <div class="field" [hidden]="user.id">
    <label for="password">Fjalëkalimi *</label>
    <div class="p-inputgroup">
      <button
        [disabled]="!!user.id"
        onclick="this.disabled = true"
        style="min-width: 8% !important"
        value="Save"
        type="button"
        pButton
        pRipple
        icon="pi pi-key"
        (click)="onPasswordCreate()"
        pTooltip="Gjenero Fjalëkalimin"
        tooltipPosition="bottom"></button>
      <input
        type="text"
        id="password"
        name="password"
        disabled
        pInputText
        placeholder="{{ user.password }}"
        [(ngModel)]="user.password" />
      <button
        class="password-button"
        style="min-width: 8% !important"
        onclick="this.disabled = true"
        [cdkCopyToClipboard]="user.password"
        type="button"
        pButton
        pRipple
        icon="pi pi-copy"
        pTooltip="Kopjo Fjalëkalimin"
        tooltipPosition="bottom"></button>
    </div>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
