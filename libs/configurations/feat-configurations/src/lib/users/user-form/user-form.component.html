  <div class="field">
    <label for="fileName">File Name *</label>
    <input
      type="text"
      pInputText
      id="fileName"
      name="fileName"
      [(ngModel)]="user.fileName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.fileName
      }" />
    <small class="p-error block" *ngIf="submitted && !user.fileName">
      fileName is required.
    </small>
  </div>

  <div class="field">
    <label for="name">Emri *</label>
    <input
      type="text"
      pInputText
      id="name"
      name="name"
      [(ngModel)]="user.name"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.name
      }" />
    <small class="p-error block" *ngIf="submitted && !user.name">
      name is required.
    </small>
  </div>

  <div class="field">
    <label for="lastName">Mbiemri *</label>
    <input
      type="text"
      pInputText
      id="lastName"
      name="lastName"
      [(ngModel)]="user.lastName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.lastName
      }" />
    <small class="p-error block" *ngIf="submitted && !user.lastName">
      lastName is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">overseerCode *</label>
    <input
      type="text"
      pInputText
      id="overseerCode"
      name="overseerCode"
      [(ngModel)]="user.overseerCode"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.overseerCode
      }" />
    <small class="p-error block" *ngIf="submitted && !user.overseerCode">
      overseerCode is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">Id e Studentit</label>
    <input
      type="text"
      pInputText
      id="studentId"
      name="studentId"
      [(ngModel)]="user.studentId"
      autofocus />
    <!-- <small class="p-error block" *ngIf="submitted && !user.studentId">
      studentId is required.
    </small> -->
  </div>

  <div class="field">
    <label for="studyProgramId">Id e Programit te Studimit</label>
    <p-dropdown
      id="studyProgramId"
      [options]="studyPrograms"
      optionValue="key"
      optionLabel="value"
      name="studyProgramId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.studyProgramId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field">
    <label for="nodes">Menu Nodes *</label>
    <p-dropdown
      id="nodes"
      [options]="studyPrograms"
      optionValue="key"
      optionLabel="value"
      name="nodes"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.nodes"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field">
    <label for="universityId">Id e Universitetit</label>
    <p-dropdown
      id="universityId"
      [options]="universities"
      optionValue="key"
      optionLabel="value"
      name="universityId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.universityId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field">
    <label for="Name">Valid nga</label>
    <p-calendar
      [(ngModel)]="user.validFrom"
      name="validFrom"
      [showTime]="true"
      [showSeconds]="true"
      inputId="validFrom"
      autofocus
      [showIcon]="true"></p-calendar>
  </div>

  <div class="field">
    <label for="Name">Valid deri ne</label>
    <p-calendar
      [(ngModel)]="user.validTo"
      name="validTo"
      [showTime]="true"
      [showSeconds]="true"
      inputId="validTo"
      [showIcon]="true"
      autofocus></p-calendar>
  </div>

  <div class="field">
    <label for="userName">Username *</label>
    <input
      type="text"
      pInputText
      id="userName"
      name="userName"
      [(ngModel)]="user.userName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.userName
      }" />
    <small class="p-error block" *ngIf="submitted && !user.userName">
      username is required.
    </small>
  </div>

  <div class="field">
    <label for="password">password *</label>
    <input
      type="password"
      pInputText
      id="password"
      name="password"
      [(ngModel)]="user.password"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.password
      }" />
    <small class="p-error block" *ngIf="submitted && !user.password">
      password is required.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"></button>
  </div>
</form>
