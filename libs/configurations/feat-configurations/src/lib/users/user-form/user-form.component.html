<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="name">Emri *</label>
    <input
      type="text"
      pInputText
      id="name"
      name="name"
      [(ngModel)]="user.name"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.name
      }" />
    <small class="p-error block" *ngIf="submitted && !user.name">
      name is required.
    </small>
  </div>

  <div class="field">
    <label for="lastName">Mbiemri *</label>
    <input
      type="text"
      pInputText
      id="lastName"
      name="lastName"
      [(ngModel)]="user.lastName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.lastName
      }" />
    <small class="p-error block" *ngIf="submitted && !user.lastName">
      lastName is required.
    </small>
  </div>

  <div class="field">
    <label for="userName">Perdoruesi *</label>
    <input
      type="text"
      pInputText
      id="userName"
      name="userName"
      [(ngModel)]="user.userName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.userName
      }" />
    <small class="p-error block" *ngIf="submitted && !user.userName">
      username is required.
    </small>
  </div>

  <div class="field">
    <label for="role">Roli *</label>
    <p-dropdown
      id="role"
      optionValue="value"
      optionLabel="value"
      [options]="roles"
      [required]="true"
      name="roles"
      (onChange)="onRoleChange($event)"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.role"
      [showClear]="true">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !user.role">
      Roli është fushë e kërkuar.
    </small>
  </div>

  <div class="field" [hidden]="showAdministrationOffice === false">
    <label for="administrationOfficeId">DAR/ZA *</label>
    <p-dropdown
      id="administrationOfficeId"
      optionValue="key"
      optionLabel="value"
      [options]="administrationOffices"
      [disabled]="showAdministrationOffice === false"
      name="administrationOfficeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.administrationOfficeId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field" [hidden]="showUniversity === false">
    <label for="universityId">Universiteti *</label>
    <p-dropdown
      id="universityId"
      optionValue="key"
      optionLabel="value"
      [options]="universities"
      [disabled]="showUniversity === false"
      name="universityId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.universityId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field" [hidden]="showUniversityDepartment === false">
    <label for="universityDepartmentId">Fakulteti *</label>
    <p-dropdown
      id="universityDepartmentId"
      optionValue="key"
      optionLabel="value"
      [options]="universityDepartments"
      [disabled]="showUniversityDepartment === false"
      name="universityDepartmentId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.universityDepartmentId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field" [hidden]="showStudyProgram === false">
    <label for="studyProgramId">Programi i Studimit *</label>
    <p-dropdown
      id="studyProgramId"
      optionValue="key"
      optionLabel="value"
      [options]="studyPrograms"
      [disabled]="showStudyProgram === false"
      name="studyProgramId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.studyProgramId"
      [showClear]="true">
    </p-dropdown>
  </div>

  <div class="field" [hidden]="showOverseerCode === false">
    <label for="overseerCode">Kodi I Mbikqyresit *</label>
    <input
      type="text"
      pInputText
      id="overseerCode"
      name="overseerCode"
      [(ngModel)]="user.overseerCode"
      autofocus />
  </div>

  <div class="field">
    <label for="password">Fjalekalimi *</label>
    <input
      type="password"
      pInputText
      id="password"
      name="password"
      [(ngModel)]="user.password"
      autofocus />
  </div>

  <div class="field">
    <label class="mb-3">Është aktiv? *</label>
    <div class="formgrid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="isActiveTrue"
          name="isActive"
          [value]="true"
          [(ngModel)]="user.isActive"></p-radioButton>
        <label for="isActiveTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="isActiveFalse"
          name="isWithCompetition"
          [value]="false"
          [(ngModel)]="user.isActive"></p-radioButton>
        <label for="isActiveFalse">Jo</label>
      </div>
    </div>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"></button>
  </div>
</form>
