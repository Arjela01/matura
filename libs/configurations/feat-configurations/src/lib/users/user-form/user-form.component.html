<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="displayName">Emri</label>
    <input
      type="text"
      pInputText
      id="displayName"
      name="displayName"
      [(ngModel)]="user.displayName"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !user.displayName }" />
    <small class="p-error block" *ngIf="submitted && !user.displayName">
      Emri eshte i detyruar.
    </small>
  </div>

  <div class="field">
    <label for="AdministrationOffice">DAR/ZA *</label>
    <p-dropdown
      id="AdministrationOffice"
      [options]="administrationOffices"
      optionValue="key"
      optionLabel="value"
      name="administrationOfficeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="user.administrationOffice"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.administrationOffice
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !user.administrationOffice">
      DAR/ZA është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="Name">Departamenti Univeristar</label>
    <input
      type="text"
      pInputText
      id="universityDepartment"
      name="universityDepartment"
      [(ngModel)]="user.universityDepartment"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.universityDepartment
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !user.universityDepartment">
      universityDepartment is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">Shkolla e Mesme</label>
    <input
      type="text"
      pInputText
      id="highSchool"
      name="highSchool"
      [(ngModel)]="user.highSchool"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.highSchool
      }" />
    <small class="p-error block" *ngIf="submitted && !user.highSchool">
      highSchool is required.
    </small>
  </div>
  <div class="field">
    <label for="Name">Emri</label>
    <input
      type="text"
      pInputText
      id="name"
      name="name"
      [(ngModel)]="user.name"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.name
      }" />
    <small class="p-error block" *ngIf="submitted && !user.name">
      name is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">Mbiemri</label>
    <input
      type="text"
      pInputText
      id="lastName"
      name="lastName"
      [(ngModel)]="user.lastName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.lastName
      }" />
    <small class="p-error block" *ngIf="submitted && !user.lastName">
      lastName is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">overseerCode</label>
    <input
      type="text"
      pInputText
      id="overseerCode"
      name="overseerCode"
      [(ngModel)]="user.overseerCode"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.overseerCode
      }" />
    <small class="p-error block" *ngIf="submitted && !user.overseerCode">
      overseerCode is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">Id e Studentit</label>
    <input
      type="text"
      pInputText
      id="studentId"
      name="studentId"
      [(ngModel)]="user.studentId"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.studentId
      }" />
    <small class="p-error block" *ngIf="submitted && !user.studentId">
      studentId is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">Id e Programit te Studimit</label>
    <input
      type="text"
      pInputText
      id="studyProgramId"
      name="studyProgramId"
      [(ngModel)]="user.studyProgramId"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.studyProgramId
      }" />
    <small class="p-error block" *ngIf="submitted && !user.studyProgramId">
      studyProgramId is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">Id e Universitetit</label>
    <input
      type="text"
      pInputText
      id="universityId"
      name="universityId"
      [(ngModel)]="user.universityId"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.universityId
      }" />
    <small class="p-error block" *ngIf="submitted && !user.universityId">
      universityId is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">Valid nga</label>
    <p-calendar
      [(ngModel)]="user.validFrom"
      name="validFrom"
      [showTime]="true"
      [showSeconds]="true"
      inputId="time"
      [required]="true"
      autofocus
      [showIcon]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.validFrom
      }"></p-calendar>
    <small class="p-error block" *ngIf="submitted && !user.validFrom">
      validFrom is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">Valid deri ne</label>
    <p-calendar
      [(ngModel)]="user.validTo"
      name="validTo"
      [showTime]="true"
      [showSeconds]="true"
      inputId="time"
      [showIcon]="true"
      [required]="true"
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !user.validTo
      }"></p-calendar>
    <small class="p-error block" *ngIf="submitted && !user.validTo">
      validTo is required.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"></button>
  </div>
</form>
