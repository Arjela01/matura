<form #form="ngForm" (ngSubmit)="onSubmit()">

  <div class="field">
    <label for="ExamType">Tipi i Provimit *</label>
    <p-dropdown
      id="ExamType"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="examDate.examTypeId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examDate.examTypeId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examDate.examTypeId">
     Tipi i Provimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="ExamSite">Qendra e Provimit *</label>
    <p-dropdown
      id="ExamSite"
      [options]="examSites"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="examDate.examSiteId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examDate.examSiteId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examDate.examSiteId">
      Qendra e Provimit është fushë e kërkuar.
    </small>
  </div>


  <div class="field">
    <label for="dateTime">Data *</label>
    <input
      value="01-01-2001"
      type="date"
      pInputText
      id="dateTime"
      name="dateTime"
      [(ngModel)]="examDate.dateTime"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examDate.dateTime }" />
    <small class="p-error block" *ngIf="submitted && !examDate.dateTime">
     Data dhe Ora  është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="dateTime">Ora *</label>
    <input
      placeholder="HH:mm"
      type="time"
      pInputText
      id="dateTime"
      name="dateTime"
      [(ngModel)]="examDate.dateTime"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examDate.dateTime }" />
    <small class="p-error block" *ngIf="submitted && !examDate.dateTime">
      Data dhe Ora  është fushë e kërkuar.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"></button>
  </div>
</form>
