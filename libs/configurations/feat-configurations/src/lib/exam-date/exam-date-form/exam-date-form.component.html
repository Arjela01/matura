<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="ExamType">Tipi i Provimit *</label>
    <p-dropdown
      id="ExamType"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      appendTo="body"
      [filter]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examDate.examTypeId"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examDate.examTypeId,
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examDate.examTypeId">
      Tipi i Provimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field" *ngIf="examDate.id">
    <label for="ExamSite">Qendra e Provimit *</label>
    <p-dropdown
      id="ExamSite"
      [options]="examSites"
      optionValue="key"
      optionLabel="value"
      name="examSiteId"
      appendTo="body"
      [filter]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examDate.examSiteId"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examDate.examSiteId,
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examDate.examSiteId">
      Qendra e Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field" *ngIf="!examDate.id">
    <label for="ExamSites">Qendra e Provimit *</label>
    <p-multiSelect
      id="ExamSites"
      [options]="examSites"
      optionValue="key"
      optionLabel="value"
      name="examSiteId"
      defaultLabel="Zgjidh Qendrën"
      display="chip"
      appendTo="body"
      [(ngModel)]="examDate.examSiteIds"
      [showClear]="true"
      [required]="true"
      [filter]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examDate.examSiteIds,
      }">
    </p-multiSelect>
    <small class="p-error block" *ngIf="submitted && !examDate.examSiteIds">
      Qendra e Provimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="date">Data *</label>
    <p-calendar
      [(ngModel)]="date"
      dateFormat="dd/mm/yy"
      inputId="date"
      id="date"
      appendTo="body"
      name="date"
      [minDate]="minimumDate"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !date,
      }"></p-calendar>
    <small class="p-error block" *ngIf="submitted && !date">
      Data është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="time">Ora *</label>
    <input
      type="time"
      pInputText
      id="time"
      name="time"
      [(ngModel)]="examDate.time"
      required
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examDate.time }" />
    <small class="p-error block" *ngIf="submitted && !examDate.time">
      Ora është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label class="mb-3">Është Vjeshtë? *</label>
    <div class="form grid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallTrue"
          name="IsFallTrue"
          [value]="true"
          [(ngModel)]="examDate.isFall"></p-radioButton>
        <label for="IsFallTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallFalse"
          name="IsFall"
          [value]="false"
          [(ngModel)]="examDate.isFall"></p-radioButton>
        <label for="IsFallFalse">Jo</label>
      </div>
    </div>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
