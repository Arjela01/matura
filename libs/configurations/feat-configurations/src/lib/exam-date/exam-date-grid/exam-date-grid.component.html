<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examDates"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamDates"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="examTypeName">
        Tipi i Provimit
        <p-sortIcon field="examTypeName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examTypeName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="examSiteName">
        Qendra e Provimit
        <p-sortIcon field="examSiteName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examSiteName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="date">
        Data
        <p-sortIcon field="date"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="date"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="time">
        Ora
        <p-sortIcon field="time"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="time"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examDate>
    <tr>
      <td style="width: 25%; min-width: 10rem">
        {{ examDate.examSiteName }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ examDate.examTypeName}}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ examDate.date | date : 'dd/MM/YYYY'}}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ examDate.time}}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(examDate)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examDate)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
