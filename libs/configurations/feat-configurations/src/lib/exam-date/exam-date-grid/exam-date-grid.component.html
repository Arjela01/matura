<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="examDates"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamDates"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="examTypeName">
        Tipi i Provimit
        <div>
          <p-sortIcon field="examTypeName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examTypeName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examSiteName">
        Qendra e Provimit
        <div>
          <p-sortIcon field="examSiteName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examSiteName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="date">
        Data
        <div>
          <p-sortIcon field="date"></p-sortIcon>
          <p-columnFilter
            type="date"
            field="date"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="time">
        Ora
        <div>
          <p-sortIcon field="time"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="time"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="isFall">
        Është Vjeshtë
        <div>
          <p-sortIcon field="time"></p-sortIcon>
          <p-columnFilter
            type="boolean"
            field="isFall"
            display="menu"
            matchMode="equals"
            ></p-columnFilter>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examDate>
    <tr>
      <td style="width: 20%; min-width: 10rem">
        {{ examDate.examTypeName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examDate.examSiteName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examDate.date | app_date }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examDate.time }}
      </td>
      <td style="width: 20%">
        {{ examDate.isFall | app_bool }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examDate)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examDate)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
