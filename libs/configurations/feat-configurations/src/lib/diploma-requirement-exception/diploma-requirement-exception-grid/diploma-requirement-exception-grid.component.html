<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  stateStorage="local"
  stateKey="dr-local"
  [value]="students"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedStudents"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="studentId">
        ID
        <p-sortIcon field="studentId"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="studentId"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="firstName">
        Emri
        <p-sortIcon field="firstName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="firstName"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="middleName">
        Atësia
        <p-sortIcon field="middleName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="middleName"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="lastName">
        Mbiemri
        <p-sortIcon field="lastName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="lastName"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <td style="width: 30%">
        {{ student.studentId }}
      </td>
      <td style="width: 30%">
        {{ student.firstName }}
      </td>
      <td style="width: 20%">
        {{ student.middleName }}
      </td>
      <td style="width: 40%">
        {{ student.lastName }}
      </td>

      <td style="width: 14%; min-width: 10rem">
        <div class="flex">
          <button
            pButton
            pRipple
            class="p-button-rounded p-button-plain p-button-text mr-2 pointer"
            (click)="changeStatus(student)"
            [ngClass]="
              student.isDiplomaRequirementException === true
                ? ['bg-red-300', 'red-text', 'px-3', 'py-1', 'fb']
                : ['bg-green-300', 'green-text', 'px-3', 'py-1', 'fb']
            ">
            {{
              student.isDiplomaRequirementException === true
                ? 'Anullo'
                : 'Konfirmo'
            }}
          </button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
