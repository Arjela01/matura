<div class="flex ml-2 mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Përjashtim Kushti Diplome</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-1">
      <p-fileUpload
        name="myfile[]"
        [multiple]="true"
        [customUpload]="true"
        chooseLabel="Ngarko"
        [auto]="true"
        accept=".xlsm,.xlsx,application/msexcel"
        (uploadHandler)="onUpload($event)">
      </p-fileUpload>
    </div>
  </div>
</div>

<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-diploma-requirement-exception-grid
        [students]="(studentList$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getStudent($event)">
      </msh-diploma-requirement-exception-grid>
    </div>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
<ng-container *ngIf="academicYear$ | async"></ng-container>
