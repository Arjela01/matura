<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examAssignments"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamAssignments"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="examSiteName">
        Qendra e Provimit
        <p-sortIcon field="examSiteName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examSiteName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="examTypeName">
        Tipi i Provimit
        <p-sortIcon field="examTypeName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examTypeName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="date">
        Data e Provimit
        <p-sortIcon field="date"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="date"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="examTime">
        Ora e Provimit
        <p-sortIcon field="examTime"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examTime"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="studentName">
        Studenti
        <p-sortIcon field="studentName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="studentName"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examAssignment>
    <tr>
      <td style="width: 23%; min-width: 10rem">
        {{ examAssignment.examSiteName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examAssignment.examTypeName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examAssignment.date | date : 'dd.MM.yyyy' }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examAssignment.date | date : 'hh:mm' }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examAssignment.studentName }}
      </td>

      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            (click)="onEditClick(examAssignment)"
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examAssignment)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
