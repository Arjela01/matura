<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examAssignments"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamAssignments"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="examSiteName">
        Qendra e Provimit
        <p-sortIcon field="examSiteName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examSiteName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="examTypeName">
        Tipi i Provimit
        <p-sortIcon field="examTypeName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examTypeName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="date">
        Data e Provimit
        <p-sortIcon field="date"></p-sortIcon>
        <p-columnFilter
          type="date"
          field="date"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="time">
        Ora e Provimit
        <p-sortIcon field="time"></p-sortIcon>
        <p-columnFilter
          type="number"
          field="time"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="studentName">
        Emri i Studentit
        <p-sortIcon field="studentName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="studentName"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examAssignment>
    <tr>
      <td style="width: 23%; min-width: 10rem">
        {{ examAssignment.examSiteName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examAssignment.examTypeName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examAssignment.date | date : 'dd/MM/yyyy' }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examAssignment.time }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examAssignment.studentName }}
      </td>

      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examAssignment)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examAssignment)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
