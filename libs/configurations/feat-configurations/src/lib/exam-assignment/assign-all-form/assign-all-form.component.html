<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card">
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="field mt-4 mb-4">
          <label for="ExamDate"> ZVAP *</label>
          <p-dropdown
            class="mt-4 mb-4"
            id="ExamDate"
            [options]="administrationOffices"
            optionValue="key"
            optionLabel="value"
            (onChange)="onAdministrationOfficeChanged($event)"
            (onClear)="onAdministrationOfficeChanged($event)"
            [virtualScroll]="true"
            [autoDisplayFirst]="false"
            [virtualScrollItemSize]="43"
            name="ExamDate"
            appendTo="body"
            [(ngModel)]="examAssignment.administrationOfficeId"
            [showClear]="true"
            [ngClass]="{
              'ng-invalid ng-dirty':
                submitted && !examAssignment.administrationOfficeId
            }">
          </p-dropdown>
          <small
            class="p-error block"
            *ngIf="submitted && !examAssignment.administrationOfficeId">
            Dar/Za është fushë e kërkuar.
          </small>
        </div>
        <div class="field mt-4 mb-4">
          <label for="examSite"> Qendra e Provimit *</label>
          <p-multiSelect
            class="mt-4 mb-4"
            id="examSite"
            display="chip"
            [virtualScroll]="true"
            defaultLabel="Zgjidh Qendrën"
            [options]="examSites"
            optionValue="key"
            optionLabel="value"
            name="ExamDate"
            appendTo="body"
            (onClear)="onExamSiteChanged($event)"
            (onChange)="onExamSiteChanged($event)"
            [virtualScrollItemSize]="43"
            [(ngModel)]="examAssignment.examSiteId"
            [showClear]="true"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !examAssignment.examSiteId
            }">
          </p-multiSelect>
          <small
            class="p-error block"
            *ngIf="submitted && !examAssignment.examSiteId">
            Qendra e Provimit është fushë e kërkuar.
          </small>
        </div>

        <div class="field">
          <label for="examInfo"> Tipi dhe Data e Provimit *</label>
          <p-multiSelect
            id="examInfo"
            display="chip"
            defaultLabel="Zgjidh Datën"
            [virtualScrollItemSize]="43"
            [options]="examDates"
            optionValue="key"
            optionLabel="value"
            name="examInfoId"
            appendTo="body"
            [required]="true"
            (onClear)="onExamDateChanged($event)"
            (onChange)="onExamDateChanged($event)"
            [(ngModel)]="examAssignment.examDateId"
            [showClear]="true"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !examAssignment.examDateId
            }">
          </p-multiSelect>
          <small
            class="p-error block"
            *ngIf="submitted && !examAssignment.examDateId">
            Data e Provimit është fushë e kërkuar.
          </small>
        </div>

        <div class="flex justify-content-end mt-4">
          <button
            type="button"
            pButton
            label="Anullo"
            class="p-button-text w-auto mr-2"
            (click)="onCancelClick()"></button>
          <button
            [disabled]="form.invalid"
            type="submit"
            pButton
            label="Cakto"
            class="p-button w-auto"></button>
        </div>
      </form>
    </div>
  </div>
</div>
