<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="ExamSite">Qendra e Provimit *</label>
    <p-dropdown
      id="ExamSite"
      [options]="examSites"
      optionValue="key"
      optionLabel="value"
      name="examSiteId"
      appendTo="body"
      [required]="true"
      (onChange)="refreshExamDates()"
      [autoDisplayFirst]="false"
      [(ngModel)]="examAssignment.examSiteId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examAssignment.examSiteId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examAssignment.examSiteId">
      Qendra e Provmit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="examInfo"> Tipi dhe Data e Provimit *</label>
    <p-dropdown
      id="examInfo"
      [options]="examDates"
      optionValue="key"
      optionLabel="value"
      name="examInfoId"
      appendTo="body"
      [required]="true"
      (onChange)="getValue($event)"
      [autoDisplayFirst]="false"
      [(ngModel)]="examAssignment.examDateId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examAssignment.examDateId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examAssignment.examDateId">
      Data e Provimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="studentInputData">Maturant *</label>
    <div class="p-inputgroup">
      <p-button
        label="Kërko"
        icon="pi pi-search"
        (click)="onSearchClick()"
        [style]="{ height: '100%' }"></p-button>
      <input
        [value]="studentInputData"
        type="text"
        pInputText
        id="studentInputData"
        name="studentInputData"
        [(ngModel)]="studentInputData"
        [required]="true"
        [ngClass]="{
          'ng-invalid ng-dirty': submitted && !studentInputData
        }" />
    </div>
    <small class="p-error block" *ngIf="submitted && !studentInputData">
      Studenti është fushë e kërkuar.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>

<p-dialog
  [(visible)]="displayModal"
  [modal]="true"
  header="Kërko Maturantin"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-shared-student-lookup
      [students]="(studentList$ | async) || []"
      [totalRecords]="totalRecords"
      (gridEvent)="onGridEvent($event)"
      (lazyLoadData)="getStudents($event)">
    </msh-shared-student-lookup>
  </ng-template>
</p-dialog>
