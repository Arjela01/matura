<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card">
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="field mt-4 mb-4">
          <label for="ExamDate"> Data e Provimit *</label>
          <p-dropdown
            class="mt-4 mb-4"
            id="ExamDate"
            [options]="examDates"
            optionValue="key"
            optionLabel="value"
            name="ExamDate"
            appendTo="body"
            [autoDisplayFirst]="false"
            [(ngModel)]="command.examDateId"
            [showClear]="true"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !command.examDateId
            }">
          </p-dropdown>
          <small class="p-error block" *ngIf="submitted && !command.examDateId">
            Data e Provimit është fushë e kërkuar.
          </small>
        </div>
        <div class="field mt-4 mb-4">
          <label>Importo Dokument *</label>
          <p-fileUpload
            name="myfile[]"
            [multiple]="true"
            [customUpload]="true"
            accept=".xlsm,.xlsx,application/msexcel"
            chooseLabel="Zgjidh"
            [auto]="true"
            (uploadHandler)="onUpload($event)">
          </p-fileUpload>
          <small class="p-error block" *ngIf="submitted && !command.file">
            Ju lutem zgjidhni një dokument.
          </small>
        </div>

        <div class="flex justify-content-end">
          <button
            type="button"
            pButton
            label="Anullo"
            class="p-button-text w-auto mr-2"
            (click)="onCancelClick()"></button>
          <button
            [disabled]="form.invalid"
            type="submit"
            pButton
            label="Ngarko"
            class="p-button w-auto"></button>
        </div>
      </form>
    </div>
  </div>
</div>
