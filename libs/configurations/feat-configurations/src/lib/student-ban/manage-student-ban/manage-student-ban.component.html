<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Skualifikim</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <msh-student-ban-grid
        [bannedStudents]="(bannedStudents$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getBannedStudents($event)">
      </msh-student-ban-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '1000px' }"
  header="Detajet e Skualifikimit të Studentëve"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-student-ban-form
      [bannedStudentsDetails]="selectedBannedStudent"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-student-ban-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
