<div>
  <h2 class="flex-1 mb-0">Lista Emërore</h2>
  <div class="mt-4">
    <msh-list-of-students-filters
      [showSortButton]="showSortButton"
      [totalRecords]="totalRecords"
      (formSave)="getExamAssignments($event)"
      (sort)="sortExamAssignments($event)"
      [examDates]="examDates"
      [examSites]="examSites"
      [administrationOffices]="administrationOffices"
      (administrationOfficeChanged)="getExamSiteDropdown($event)"
      (examDateChanged)="getExamDateDropdown()">
    </msh-list-of-students-filters>
  </div>
  <div class="mt-4">
    <msh-list-of-students-grid
      [totalRecords]="totalRecords"
      [studentsList]="
        (studentsList$ | async) || []
      "></msh-list-of-students-grid>
  </div>
</div>
