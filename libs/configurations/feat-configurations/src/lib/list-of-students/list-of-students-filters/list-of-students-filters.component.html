<form #form="ngForm" class="dropdown-row" (ngSubmit)="onSubmit()">
  <div class="field column">
    <label for="examType">ZVAP</label>
    <p-dropdown
      id="administrationOffice"
      [style]="{ width: '100%', minWidth: '150px' }"
      [options]="administrationOffices"
      optionValue="key"
      optionLabel="value"
      name="examType"
      appendTo="body"
      [filter]="true"
      [autoDisplayFirst]="false"
      (onChange)="onAdministrationOfficeChanged()"
      (onClear)="onAdministrationOfficeChanged()"
      [(ngModel)]="studentList.administrationOfficeId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !studentList.administrationOfficeId,
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !studentList.administrationOfficeId">
      Qendra e Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field column">
    <label for="examType">Qendra e Provimit *</label>
    <p-dropdown
      id="examType"
      [style]="{ width: '100%', minWidth: '150px' }"
      [options]="examSites"
      optionValue="key"
      optionLabel="value"
      name="examType"
      appendTo="body"
      [filter]="true"
      [autoDisplayFirst]="false"
      (onChange)="onExamSiteChanged()"
      (onClear)="onExamSiteChanged()"
      [(ngModel)]="studentList.examSiteId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !studentList.examSiteId,
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !studentList.examSiteId">
      Qendra e Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field column">
    <label for="archiveFolder">Tipi dhe Data e Provimit *</label>
    <p-dropdown
      [style]="{ width: '100%', minWidth: '150px' }"
      id="archiveFolder"
      [options]="examDates"
      optionValue="key"
      optionLabel="value"
      name="archiveFolderId"
      appendTo="body"
      (onChange)="onSubmit()"
      [filter]="true"
      [required]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="studentList.examDateId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !studentList.examDateId,
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !studentList.examDateId">
      Tipi dhe Data e Provimit është fushë e kërkuar.
    </small>
  </div>
  <div></div>
  <div class="text-center">
    <button pButton class="btn btn-primary mt-2" type="submit">Kërko</button>
  </div>
  <div
    class="text-center"
    *ngIf="userRole === RoleName.Admin && showSortButton && totalRecords !== 0">
    <button
      pButton
      class="btn btn-primary mt-2"
      (click)="sortAssignments()"
      type="button">
      Rendit
    </button>
  </div>
</form>
