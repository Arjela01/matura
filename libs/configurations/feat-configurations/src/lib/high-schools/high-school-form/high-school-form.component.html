<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Code">code</label>
    <input
      type="text"
      pInputText
      id="Code"
      name="Code"
      [(ngModel)]="highSchool.code"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !highSchool.code }" />
    <small class="p-error block" *ngIf="submitted && !highSchool.code">
      code is required.
    </small>
  </div>

  <div class="field">
    <label for="Name">name</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="highSchool.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !highSchool.name }" />
    <small class="p-error block" *ngIf="submitted && !highSchool.name">
      name is required.
    </small>
  </div>

  <div class="field">
    <label class="mb-3">Is Public?</label>
    <div class="formgrid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          inputId="IsPublicTrue"
          name="IsPublic"
          value="1"
          [(ngModel)]="highSchool.isPublic"></p-radioButton>
        <label for="IsPublicTrue">Yes</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          inputId="IsPublicFalse"
          name="IsPublic"
          value="0"
          [(ngModel)]="highSchool.isPublic"></p-radioButton>
        <label for="IsPublicFalse">No</label>
      </div>
    </div>
  </div>

  <div class="field">
    <label for="AdministrationOffice">Administration Office</label>
    <input
      type="text"
      pInputText
      id="AdministrationOffice"
      name="AdministrationOffice"
      [(ngModel)]="highSchool.administrationOfficeId"
      required
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !highSchool.administrationOfficeId
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !highSchool.administrationOfficeId">
      Administration Office is required.
    </small>
  </div>

  <div class="field">
    <label for="City">cityName</label>
    <input
      type="text"
      pInputText
      id="City"
      name="City"
      [(ngModel)]="highSchool.cityName"
      required
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !highSchool.cityName }" />
    <small class="p-error block" *ngIf="submitted && !highSchool.cityName">
      cityName is required.
    </small>
  </div>

  <div class="field mb-5">
    <label for="Name">regionName</label>
    <input
      type="text"
      pInputText
      id="Region"
      name="Region"
      [(ngModel)]="highSchool.regionName"
      required
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !highSchool.regionName }" />
    <small class="p-error block" *ngIf="submitted && !highSchool.regionName">
      regionName is required.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Cancel"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Save"
      class="p-button-text w-auto"></button>
  </div>
</form>
