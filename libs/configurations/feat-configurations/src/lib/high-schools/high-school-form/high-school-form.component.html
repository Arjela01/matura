<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="Code">Kodi *</label>
    <input
      type="number"
      pInputText
      id="Code"
      name="Code"
      [(ngModel)]="highSchool.code"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !highSchool.code }" />
    <small class="p-error block" *ngIf="submitted && !highSchool.code">
      Kodi është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="Name">Emri *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="highSchool.name"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !highSchool.name }" />
    <small class="p-error block" *ngIf="submitted && !highSchool.name">
      Emri është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label class="mb-3">Is Public? *</label>
    <div class="formgrid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsPublicTrue"
          name="IsPublic"
          [value]="true"
          [(ngModel)]="highSchool.isPublic"></p-radioButton>
        <label for="IsPublicTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsPublicFalse"
          name="IsPublic"
          [value]="false"
          [(ngModel)]="highSchool.isPublic"></p-radioButton>
        <label for="IsPublicFalse">Jo</label>
      </div>
    </div>
  </div>

  <div class="field">
    <label for="AdministrationOffice">DAR/ZA *</label>
    <p-dropdown
      id="AdministrationOffice"
      [options]="administrationOffices"
      optionValue="key"
      optionLabel="value"
      name="administrationOfficeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="highSchool.administrationOfficeId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !highSchool.administrationOfficeId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !highSchool.administrationOfficeId">
      DAR/ZA është fushë e kërkuar.
    </small>
  </div>

  <div class="field mb-5">
    <label for="Region">Rrethi *</label>
    <p-dropdown
      id="Region"
      [options]="regions"
      name="regionId"
      optionValue="key"
      optionLabel="value"
      [(ngModel)]="highSchool.regionId"
      [autoDisplayFirst]="false"
      (onChange)="onRegionChange($event)"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !highSchool.regionId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !highSchool.regionId">
      Rrethi është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="City">Qyteti/Fshati *</label>
    <p-dropdown
      id="City"
      [options]="citiesFiltered"
      optionValue="key"
      optionLabel="value"
      name="cityId"
      appendTo="body"
      [(ngModel)]="highSchool.cityId"
      [autoDisplayFirst]="false"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !highSchool.cityId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !highSchool.cityId">
      Qyeti/Fshati është fushë e kërkuar.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"
    ></button>
  </div>
</form>
