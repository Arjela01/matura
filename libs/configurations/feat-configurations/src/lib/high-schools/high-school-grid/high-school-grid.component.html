<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="highSchools"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedHighSchools"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="code">
        Kodi
        <p-sortIcon field="code"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="code"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="isPublic">
        Është Publik?
        <p-sortIcon field="isPublic"></p-sortIcon>
        <p-columnFilter
          type="boolean"
          field="isPublic"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="administrationOfficeName">
        ZVAP
        <p-sortIcon field="administrationOfficeName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="administrationOfficeName"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="regionName">
        Rrethi
        <p-sortIcon field="regionName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="regionName"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="cityName">
        Qyteti/Fshati
        <p-sortIcon field="cityName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="cityName"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-highSchool>
    <tr>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.code }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.name }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.isPublic ? 'Po' : 'Jo' }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ highSchool.administrationOfficeName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.regionName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.cityName }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(highSchool)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(highSchool)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
