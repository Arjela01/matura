<p-table
  #dt
  [value]="highSchools"
  responsiveLayout="scroll"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
  [rowHover]="true"
  dataKey="id"
  [(selection)]="selectedHighSchools"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Manage High Schools</h5>
      <span class="block mt-2 md:mt-0 p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Search..."
          class="w-full sm:w-auto" />
      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox (click)="onSelectAllClick()">
        </p-tableHeaderCheckbox>
      </th>
      <th pSortableColumn="code">
        code
        <p-sortIcon field="code"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="code"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="name">
        name
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="isPublic">
        Is Public?
        <p-sortIcon field="isPublic"></p-sortIcon>
      </th>
      <th pSortableColumn="administrationOffice">
        Administration Office
        <p-sortIcon field="administrationOffice"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="administrationOffice"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="cityName">
        cityName
        <p-sortIcon field="cityName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="cityName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="regionName">
        regionName
        <p-sortIcon field="regionName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="regionName"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-highSchool>
    <tr>
      <td>
        <p-tableCheckbox [value]="highSchool"></p-tableCheckbox>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.Code }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.Name }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.IsPublic ? 'Yes' : 'No' }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ highSchool.AdministrationOffice }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.City }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ highSchool.Region }}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Edit"
            tooltipPosition="bottom"
            (click)="onEditClick(highSchool)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Delete"
            tooltipPosition="bottom"
            (click)="onDeleteClick(highSchool)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
