<div class="flex center mb-5 mt-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Kontrollet e Sistemit</h2>
</div>
<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card-form px-6 py-6">
      <ng-container *ngIf="features$">
        <div class="col-8">
          <table id="my-table-2">
            <thead>
              <tr>
                <th>Emri</th>
                <th style="text-align: center;">Aktive?</th>
                <th>Nga data</th>
                <th>Në datë</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let feat of (features$ | async) || []">
                <td class="font-semibold">{{ feat.name }}</td>
                <td>
                  <p-inputSwitch
                    class="center-content"
                    [(ngModel)]="feat.isAvailable"
                    (onChange)="saveChanges(feat)">
                  </p-inputSwitch>
                </td>
                <td class="font-semibold">
                  <p-calendar
                    [disabled]="!feat.isAvailable"
                    [(ngModel)]="feat.availableFrom"
                    (onSelect)="saveChanges(feat)"
                    (onClear)="saveChanges(feat)"
                    [showClear]="true"
                    dateFormat="dd.mm.yy"
                    appendTo="body">
                  </p-calendar>
                </td>
                <td class="font-semibold">
                  <p-calendar
                    [disabled]="!feat.isAvailable"
                    [(ngModel)]="feat.availableTo"
                    (onSelect)="saveChanges(feat)"
                    (onClear)="saveChanges(feat)"
                    [showClear]="true"
                    dateFormat="dd.mm.yy"
                    appendTo="body">
                  </p-calendar>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </ng-container>
    </div>
  </div>
</div>
