<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <div class="flex ml-2 mb-2 page-header">
        <h2 class="flex-1 mb-0">Lëndë-Profile për D1/D2</h2>
        <div class="flex align-items-right justify-content-right">
          <div class="my-2">
            <button
              pButton
              pRipple
              label="Shto"
              icon="pi pi-plus"
              class="p-button-success mr-2"
              (click)="onNewClick()"></button>
          </div>
        </div>
      </div>

      <msh-exam-subject-profile-grid
        [examSubjects]="(examSubjectProfiles$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamSubjectProfiles($event)">
      </msh-exam-subject-profile-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e Lëndë-Profile për D1/D2"
  [modal]="true"
  [draggable]="false"
  [resizable]="true"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-exam-subject-profile-form
      [examSubjectDetails]="selectedExamSubject"
      [examTypes]="examTypes"
      [examSubjects]="examSubjects"
      [academicYears]="academicYears"
      (loadExamSubjects)="loadExamSubjects($event)"
      [profiles]="profiles"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-exam-subject-profile-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
