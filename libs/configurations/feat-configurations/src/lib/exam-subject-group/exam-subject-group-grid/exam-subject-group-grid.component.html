<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="examSubjectGroup"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamSubjectGroup"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <div>
          <p-sortIcon field="name"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="name"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examSubjects">
        Lëndët e Provimit
        <div>
          <p-sortIcon field="examSubjects"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examSubjects"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examSubjectGroup>
    <tr>
      <td style="width: 20%; min-width: 10rem">
        {{ examSubjectGroup.name }}
      </td>
      <td style="width: 30%; min-width: 10rem">
        {{ examSubjectGroup.examSubjects }}
      </td>
      <td>
        <div class="flex justify-content-end">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examSubjectGroup)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examSubjectGroup)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
