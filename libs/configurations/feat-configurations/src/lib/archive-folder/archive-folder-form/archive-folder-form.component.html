<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="examTypes">Tipet e Provimeve *</label>
    <p-dropdown
      id="examTypes"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypes"
      [autoDisplayFirst]="false"
      [(ngModel)]="archiveFolder.id"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !archiveFolder.id
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !archiveFolder.id">
      Tipet e provimeve është fushë e kërkuar.
    </small>
  </div>

  <div class="field mb-5">
    <label for="Region">Versionet e Provimeve *</label>
    <p-dropdown
      id="Region"
      [options]="examTypes"
      name="regionId"
      optionValue="key"
      optionLabel="value"
      [(ngModel)]="archiveFolder.id"
      [autoDisplayFirst]="false"
      (onChange)="onExamTypeChange($event)"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !archiveFolder.id
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !archiveFolder.id">
      Rrethi është fushë e kërkuar.
    </small>
  </div>


  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Hap Dosjen"
      class="p-button-text w-auto"
      (click)="onSubmit()"></button>
  </div>
</form>
