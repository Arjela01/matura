<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="archiveFolders"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedArchiveFolders"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="examTypes">
        Dosja
        <p-sortIcon field="examTypes"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="examTypes"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="examTypes">
        Total
        <p-sortIcon field="examTypes"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examTypes"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="examType">
        Tipi i Provimit
        <p-sortIcon field="examType"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examType"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="operator">
        Operatori
        <p-sortIcon field="operator"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="operator"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="status">
        Statusi
        <p-sortIcon field="status"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="status"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="activateFolder">
        Aktivizo Dosjen
        <p-sortIcon field="activateFolder"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="activateFolder"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="dropBarcode">
        Hidh BarKode
        <p-sortIcon field="dropBarcode"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="dropBarcode"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="deleteFolder">
        Fshi Dosjen
        <p-sortIcon field="deleteFolder"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="deleteFolder"
          display="menu"></p-columnFilter>
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-archiveFolder>
    <tr>
      <td style="width: 14%; min-width: 10rem">
        <a [routerLink]="['/configurations/archive-view', archiveFolder.examTypeName]">
          {{ this.archiveFolder.examTypeId }}
        </a>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveFolder.examTypeId }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveFolder.name }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ archiveFolder.administrationOfficeName }}
      </td>
      <td>

<!--        <button-->
<!--          pButton-->
<!--          pRipple-->
<!--        style="color: #256029; background-color:#C8E6C9">-->
<!--          <span-->
<!--            [class]="'product-badge status-' + archiveFolder.id.toLowerCase()"-->
<!--            disabled>-->
<!--            {{ _opened ? 'Aktiv ' : 'Mbyllur' }}</span-->
<!--          >-->
<!--        </button>-->

      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            class="p-button-rounded p-button-info p-button-text mr-2"
            pTooltip="{{ _opened ? 'Mbyll Dosjen' : 'Aktivizo Dosjen' }}"
            tooltipPosition="bottom"
            (click)="clickOpen()"
            icon="{{
              _opened ? 'pi pi-folder-open' : 'pi pi-folder'
            }}"></button>
        </div>
      </td>
      <td>
        <div [hidden]="hideBarCode">
          <div class="flex">
            <a [routerLink]="['/configurations/add-barCode']">
              <button
                pButton
                pRipple
                icon="pi pi-qrcode"
                class="p-button-rounded p-button-warning p-button-text mr-2"
                pTooltip="Hidh Barkode"
                tooltipPosition="bottom"></button>
            </a>
          </div>
        </div>
      </td>
      <td>
        <div [hidden]="hideBarCode">
          <div class="flex">
            <button
              pButton
              pRipple
              icon="pi pi-trash"
              class="p-button-rounded p-button-danger p-button-text"
              pTooltip="Fshi"
              tooltipPosition="bottom"
              (click)="onDeleteClick(archiveFolder)"></button>
          </div>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
