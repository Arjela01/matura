<form #form="ngForm" (ngSubmit)="onOpen()">
  <div class="field">
    <label for="examTypes">Tipet e Provimeve *</label>
    <p-dropdown
      id="examTypes"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypes"s
      [autoDisplayFirst]="false"
      [(ngModel)]="archiveFolder.examTypeId"
      [showClear]="true"
      (onChange)="onExamTypeChange($event)"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !archiveFolder.examTypeId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !archiveFolder.examTypeId">
      Tipet e provimeve është fushë e kërkuar.
    </small>
  </div>
