<form #form="ngForm" (ngSubmit)="onSearchClick()">
  <div class="field">
    <label for="examTypes">Tipet *</label>
    <p-dropdown
      id="examTypes"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypes"
      [autoDisplayFirst]="false"
      [(ngModel)]="archiveFolder.id"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !archiveFolder.id
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !archiveFolder.id">
      Tipet e provimeve është fushë e kërkuar.
    </small>
  </div>

  <div class="field mb-5">
    <label for="Fodler">Dosja *</label>
    <input
      type="text"
      pInputText
      id="Fodler"
      name="Fodler"
      [(ngModel)]="archiveFolder.id"
      required
      autofocus
      [ngClass]="{
              'ng-invalid ng-dirty': submitted && !archiveFolder.id
            }" />
    <small class="p-error block" *ngIf="submitted && !archiveFolder.id">
      Dosja është fushë e kërkuar.
    </small>
  </div>


  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Kerko"
      class="p-button-text w-auto"
      (click)="onSearchClick()"></button>
  </div>
</form>
