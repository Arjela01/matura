<form #form="ngForm" (ngSubmit)="onSearchClick()">
  <div class="field">
    <label for="examTypes">Tipet *</label>
    <p-dropdown
      id="examTypes"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypes"
      [autoDisplayFirst]="false"
      [(ngModel)]="archiveFolder.id"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': searching && !archiveFolder.id
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="searching && !archiveFolder.id">
      Tipet e provimeve është fushë e kërkuar.
    </small>
  </div>

  <div class="field mb-5">
    <label for="Folder">Dosja *</label>
    <input
      type="text"
      maxlength="7"
      pInputText
      id="Folder"
      name="Folder"
      [(ngModel)]="archiveFolder.name"
      required
      autofocus
      [ngClass]="{
              'ng-invalid ng-dirty': searching && !archiveFolder.name
            }" />
    <small class="p-error block" *ngIf="searching && !archiveFolder.name">
      Dosja është fushë e kërkuar.
    </small>
  </div>


  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Kerko"
      class="p-button-text w-auto"></button>
  </div>
</form>
