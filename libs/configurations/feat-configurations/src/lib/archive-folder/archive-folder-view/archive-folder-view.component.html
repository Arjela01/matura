<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <p></p>

      <!-- TODO: this can be reusable -->
      <p-toolbar styleClass="mb-4">
        <div *ngIf="archiveFolder !== null">
          <div class="p-toolbar-group-left">
            <h2 class="flex-1 mb-0">
              Dosja: {{ archiveFolder.nr }}:{{
                archiveFolder.examSubjectName
              }}
            </h2>
          </div>
        </div>
        <div class="p-toolbar-group-right">
          <a href="/configurations/archive-folder">
            <button
              pButton
              pRipple
              label="Kthehu"
              icon="pi pi-arrow-left"
              class="p-button-danger mr-2"
              [ngStyle]="{ backgroundColor: 'var(--bluegray-600)' }"></button>
          </a>
          <a href="/configurations/report-layout-page">
            <button
              pButton
              pRipple
              label="Hapur"
              icon="pi pi-file-edit"
              class="p-button-danger mr-2"></button>
          </a>
          <a href="/configurations/report-layout-page">
            <button
              pButton
              pRipple
              label="Mbyllur"
              icon="pi pi-print"
              class="p-button-success mr-2"></button>
          </a>
          <button
            pButton
            pRipple
            label="{{ totalRecords }}/50"
            icon="pi pi-database"
            disabled
            class="p-button-danger mr-2"></button>
        </div>
      </p-toolbar>

      <p-table
        #dt
        dataKey="id"
        responsiveLayout="scroll"
        [value]="archiveFolders"
        [totalRecords]="totalRecords"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="[10, 20, 30]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
        [rowHover]="true"
        [(selection)]="selectedArchiveFolders"
        selectionMode="multiple"
                (onLazyLoad)="loadRows($event)" [lazy]="true">

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="numri">
              Numri
              <p-sortIcon field="numri"></p-sortIcon>
              <p-columnFilter
                type="numeric"
                field="numri"
                display="menu"></p-columnFilter>
            </th>
            <th pSortableColumn="barcode">
              Barkodi
              <p-sortIcon field="barcode"></p-sortIcon>
              <p-columnFilter
                type="numeric"
                field="barcode"
                display="menu"></p-columnFilter>
            </th>
            <th pSortableColumn="emri">
              Emri
              <p-sortIcon field="emri"></p-sortIcon>
              <p-columnFilter
                type="text"
                field="emri"
                display="menu"></p-columnFilter>
            </th>
            <th></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-archiveFolder>
          <tr>
            <td style="width: 14%; min-width: 10rem">
              {{ archiveFolder.lastName }}
            </td>
            <td style="width: 14%; min-width: 10rem">
              {{ archiveFolder.lastName }}
            </td>
            <td style="width: 14%; min-width: 10rem">
              {{ archiveFolder.examSubjectName }}
            </td>
            <td>
              <div class="flex">
                <button
                  pButton
                  pRipple
                  icon="pi pi-pencil"
                  class="p-button-rounded p-button-warning p-button-text mr-2"
                  pTooltip="Ndrysho"
                  tooltipPosition="bottom"></button>
                <button
                  pButton
                  pRipple
                  icon="pi pi-trash"
                  class="p-button-rounded p-button-danger p-button-text"
                  pTooltip="Fshi"
                  tooltipPosition="bottom"
                  (click)="onDeleteClick(archiveFolder)"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
