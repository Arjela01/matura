<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <!-- TODO: this can be reusable -->
      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-left">
          <h2 class="flex-1 mb-0">
            Dosja: {{ 'DOSJA: 607,     D3:   TURQISHT D3 (B1)' }}
          </h2>
        </div>
        <div class="p-toolbar-group-right">
          <a href="/configurations/archive-folder">
            <button
              pButton
              pRipple
              label="Kthehu"
              icon="pi pi-arrow-left"
              class="p-button-danger mr-2"
              [ngStyle]="{ backgroundColor: 'var(--bluegray-600)' }"></button>
          </a>
          <a href="/configurations/report-layout-page">
            <button
              pButton
              pRipple
              label="Hapur"
              icon="pi pi-file-edit"
              class="p-button-danger mr-2"></button>
          </a>
          <a href="/configurations/report-layout-page">
            <button
              pButton
              pRipple
              label="Mbyllur"
              icon="pi pi-print"
              class="p-button-success mr-2"></button>
          </a>
          <button
            pButton
            pRipple
            label="17/50"
            icon="pi pi-database"
            disabled
            class="p-button-danger mr-2"></button>
        </div>
      </p-toolbar>
      <p-table
        #dt
        dataKey="id"
        responsiveLayout="scroll"
        [value]="archiveFolders"
        [totalRecords]="totalRecords"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="[10, 20, 30]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
        [rowHover]="true"
        [(selection)]="selectedArchiveFolders"
        selectionMode="multiple">
        <!--        (onRowSelect)="onRowSelect($event)"-->
        <!--        (onRowUnselect)="onRowUnselect($event)"-->
        (onLazyLoad)="loadRows($event)" [lazy]="true">

        <ng-template pTemplate="header" *ngIf="student !== null">
          <tr>
            <th pSortableColumn="folderId">
              Numri
              <p-sortIcon field="folderId"></p-sortIcon>
              <p-columnFilter
                type="numeric"
                field="folderId"
                display="menu"></p-columnFilter>
            </th>
            <th pSortableColumn="barcode">
              Barkodi
              <p-sortIcon field="barcode"></p-sortIcon>
              <p-columnFilter
                type="numeric"
                field="barcode"
                display="menu"></p-columnFilter>
            </th>
            <th pSortableColumn="studentName">
              Emri
              <p-sortIcon field="studentName"></p-sortIcon>
              <p-columnFilter
                type="text"
                field="studentName"
                display="menu"></p-columnFilter>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-student>
          <tr>
            <td style="width: 14%; min-width: 10rem">
              {{ student.code }}
            </td>
            <td style="width: 14%; min-width: 10rem">
              {{ student.name }}
            </td>
            <td style="width: 14%; min-width: 10rem">
              {{ student.name }}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
