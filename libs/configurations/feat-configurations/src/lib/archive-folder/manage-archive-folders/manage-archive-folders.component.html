  <div class="col-12">

      <div class="flex ml-2 mb-2 page-header">
        <h2 class="flex-1 mb-0">Menaxho Dosjet</h2>
        <div class="flex align-items-right justify-content-right">
          <div class="my-2">
            <button
              pButton
              pRipple
              label="Hap nje Dosje te re"
              icon="pi pi-folder-open"
              class="p-button-success mr-2"
              (click)="onNewClick()"></button>
          </div>
        </div>
      </div>

      <msh-archive-folder-grid
        [archiveFolders]="(archiveFolders$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getArchiveFolders($event)">
      </msh-archive-folder-grid>
    </div>
  </div>
</div>
<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Hap nje Dosje te re"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-archive-open-folder-form
      [archiveFolders]="selectedArchiveFolder"
      [examTypes]="examTypes"
      (formClose)="onModalClose()">
    </msh-archive-open-folder-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
