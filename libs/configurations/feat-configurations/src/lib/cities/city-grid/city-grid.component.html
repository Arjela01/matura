<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="cities"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedCities"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="isCity">
        Është Qytet?
        <p-sortIcon field="isCity"></p-sortIcon>
        <p-columnFilter
          type="boolean"
          field="isCity"
          display="menu"
          matchMode="equals"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="regionName">
        Rrethi
        <p-sortIcon field="regionName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="regionName"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-city>
    <tr>
      <td style="width: 30%; min-width: 10rem">
        {{ city.name }}
      </td>
      <td style="width: 30%; min-width: 10rem">
        {{ city.isCity ? 'Po' : 'Jo' }}
      </td>
      <td style="width: 30%; min-width: 10rem">
        {{ city.regionName }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(city)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(city)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
