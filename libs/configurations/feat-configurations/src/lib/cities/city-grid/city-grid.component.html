<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="cities"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedCities"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Menaxho Qytetet</h5>
      <span class="block mt-2 md:mt-0 p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Kërko..."
          class="w-full sm:w-auto" />
      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 3rem">
        <p-tableHeaderCheckbox (click)="onSelectAllClick()">
        </p-tableHeaderCheckbox>
      </th>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="isActive">
        Është Aktiv?
        <p-sortIcon field="isActive"></p-sortIcon>
      </th>
      <th pSortableColumn="isACity">
        Është Qytet?
        <p-sortIcon field="isCity"></p-sortIcon>
      </th>
      <th pSortableColumn="region">
        Rrethi
        <p-sortIcon field="region"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="region"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-city>
    <tr>
      <td>
        <p-tableCheckbox [value]="city"></p-tableCheckbox>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ city.name }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ city.isActive ? 'Po' : 'Jo' }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ city.isCity ? 'Po' : 'Jo' }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ city.region }}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(city)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(city)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
