<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="students"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedStudents"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="highSchoolName">
        Shkolla
        <div>
          <p-sortIcon field="highSchoolName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="highSchoolName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="studentId">
        Matura ID
        <div>
          <p-sortIcon field="studentId"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="studentId"
            display="menu"  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="firstName">
        Emri
        <div>
          <p-sortIcon field="firstName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="firstName"
            display="menu"  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="middleName">
        Atësia
        <div>
          <p-sortIcon field="middleName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="middleName"
            display="menu"  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="lastName">
        Mbiemri
        <div>
          <p-sortIcon field="lastName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="lastName"
            display="menu"  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="birthDate">
        Datëlindja
        <div>
          <p-sortIcon field="birthDate"></p-sortIcon>
          <p-columnFilter
            type="date"
            field="birthDate"
            display="menu"  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="idCard">
        NID
        <div>
          <p-sortIcon field="idCard"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="idCard"
            display="menu"  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="profileName">
        Profili
        <div>
          <p-sortIcon field="profileName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="profileName"
            display="menu"  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>

      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <td style="width: 14%; min-width: 10rem">
        {{ student.highSchoolName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.studentId }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.firstName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.middleName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.lastName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.birthDate | date : 'dd/MM/yyyy' }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.idCard }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.profileName }}
      </td>

      <td style="width: 14%; min-width: 10rem">
        <div class="flex">
          <!-- <img [routerLink]="['/configurations', 'student-view', student.id]" src="assets/svg/view-form.svg"
                        class="p-button-rounded p-button-warning p-button-text ml-m pointer" tooltipPosition="bottom"
                        pTooltip="Shiko me shume" />
                    <img [routerLink]="['/configurations', 'student-edit', student.id]" src="assets/svg/edit-form.svg"
                        class="p-button-rounded p-button-warning p-button-text ml-m pointer" tooltipPosition="bottom"
                        pTooltip="Ndrysho" />
                    <div>
                        <img src="assets/svg/delete-form.svg"
                            class="p-button-rounded p-button-danger p-button-text ml-m pointer" pTooltip="Fshi"
                            tooltipPosition="bottom" (click)="onDeleteClick(student)" />
                    </div> -->
          <div>
            <img
              src="assets/svg/print.svg"
              class="p-button-rounded p-button-danger p-button-text ml-m pointer"
              pTooltip="Printo Diploma"
              tooltipPosition="bottom"
              (click)="onPrint(student)" />
          </div>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
