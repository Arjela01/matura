<div class="flex center mb-2 page-header mb-header">
    <h2 class="flex-1 mb-0">{{title}}</h2>
    <div class="flex align-items-right justify-content-right">
        <div class="my-2">
            <button pButton pRipple label="Shkarko dokument" icon="pi pi-plus" (click)="onNewClick()"
                class="p-button-success mr-2"></button>

        </div>
    </div>
</div>
<div class="grid">
    <div class="col-12">
        <div class="card">
            <msh-diplomas-student-grid [students]="(studentList$ | async) || []" [totalRecords]="totalRecords"
                (gridEvent)="onGridEvent($event)" (lazyLoadData)="getStudentDiplomas($event)">
            </msh-diplomas-student-grid>
        </div>
    </div>
</div>


<p-confirmDialog #cd header="Konfirmo" icon="pi pi-exclamation-triangle" [style]="{ width: '450px' }">
    <ng-template pTemplate="footer">
        <button type="button" pButton icon="pi pi-times" label="Jo" class="p-button-text"
            (click)="cd.reject()"></button>
        <button type="button" pButton icon="pi pi-check" label="Po" class="p-button border"
            (click)="cd.accept()"></button>
    </ng-template>
</p-confirmDialog>
