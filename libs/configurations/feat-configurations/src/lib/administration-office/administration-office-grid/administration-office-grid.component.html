<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="administrationOffices"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalStudentRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedAdministrationOffices"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Emri
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="name"
          display="menu" mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="isRegionalOffice">
        Është DAR
        <p-sortIcon field="isRegionalOffice"></p-sortIcon>
        <p-columnFilter
          type="boolean"
          field="isRegionalOffice"
          display="menu"
          matchMode="equals" mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="directorName">
        Emri i drejtorit
        <p-sortIcon field="directorName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="directorName"
          display="menu" mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="cityName">
        Qyteti
        <p-sortIcon field="cityName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="cityName"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="parentOfficeName">
        Varur nga
        <p-sortIcon field="parentOfficeId"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="parentOfficeId"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-administrationOffice>
    <tr>
      <td style="width: 20%; min-width: 10rem">
        {{ administrationOffice.name }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ administrationOffice.isRegionalOffice ? 'Po' : 'Jo' }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ administrationOffice.directorName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ administrationOffice.cityName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ administrationOffice.parentOfficeName }}
      </td>

      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(administrationOffice)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(administrationOffice)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
