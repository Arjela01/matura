<div class="outer-wrapper">
  <div class="login-container">
    <div class="split left">
      <div class="centered">
        <div class="institution">
          <img
            src="assets/images/institution-logo.png"
            class="w-full"
            alt="Institution Logo" />
        </div>
      </div>
    </div>
    <div class="split right">
      <div class="p-5 mb-5" style="border-radius: 2rem">
        <div class="eAlbania-logo">
          <a href="{{ ealbania_sso_url }}">
            <img
              src="assets/images/eAlbaniaLogo.png"
              class="h-6rem ml-7 mb-2"
              alt="E-Albania" />
          </a>
        </div>
        <div>
          <a
            href="{{ ealbania_sso_url }}"
            class="eAlbaniaLogin text-m font-bold mt-10">
            Identifikohu me e-Albania
          </a>
        </div>
        <div class="bottom-right mb-7 mr-5">
          <a
            class="userLogin text-m font-bold cursor-pointer"
            [routerLink]="'/user-login'"
            >Identifikohu me përdorues</a
          >
        </div>
      </div>
    </div>
  </div>
</div>
