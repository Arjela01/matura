<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Detajet e Maturantit</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        type="button"
        pButton
        icon="pi pi-arrow-left"
        label="Kthehu"
        class="w-auto mr-2"
        style="background: #f7f7fa; color: #155eef"
        [routerLink]="'/applications/students'"></button>
      <button
        pButton
        label="Konfirmuar"
        icon="pi pi-check"
        class="p-button-success p-button-outlined mr-2"
        *ngIf="student?.isConfirmedBySupervisor"></button>

      <ng-container *ngFor="let a1 of forms">
        <p-button
          type="button"
          icon="pi pi-pencil  "
          styleClass="p-button-secondary"
          (click)="navigateToForm(a1)"
          [label]="
            showEditButton ? 'Ndrysho Formularin A1' : 'Shiko Formularin A1'
          "
          *ngIf="a1.isA1"></p-button>
        <p-button
          type="button"
          icon="pi pi-pencil  "
          styleClass="p-button-secondary"
          (click)="navigateToForm(a1)"
          [label]="
            showEditButton ? 'Ndrysho Formularin A1Z' : 'Shiko Formularin A1Z'
          "
          *ngIf="!a1.isA1"></p-button>
      </ng-container>
    </div>
  </div>
</div>
<p-tabView>
  <p-tabPanel header="Të dhëna të përgjithshme">
    <msh-students-data
      [student]="student"
      [forms]="forms"
      [showStudent]="showStudent"
      [finishedAtSameSchool]="finishedAtSameSchool"></msh-students-data>
  </p-tabPanel>
  <p-tabPanel header="Caktimet për Provime">
    <msh-students-assignments
      [assignments]="(assignments$ | async) || []"></msh-students-assignments
  ></p-tabPanel>
  <p-tabPanel header="Lëndët nga A1/A1Z">
    <msh-students-subjects
      [subjects]="(subjects$ | async) || []"></msh-students-subjects
  ></p-tabPanel>
  <p-tabPanel header="Notat">
    <msh-students-grades
      [gradesDifferentYear]="gradesDifferentYear"
      [gradesMatchingYear]="gradesMatchingYear"></msh-students-grades
  ></p-tabPanel>
  <p-tabPanel header="Pikët e Provimeve">
    <msh-students-scores
      [scores]="(scores$ | async) || []"></msh-students-scores
  ></p-tabPanel>
</p-tabView>
