<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Detajet e Maturantit</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        type="button"
        pButton
        icon="pi pi-arrow-left"
        label="Kthehu"
        class="w-auto mr-2"
        style="background: #f7f7fa; color: #155eef"
        [routerLink]="'/applications/students'"></button>
    </div>
  </div>
</div>
<p-tabView>
  <p-tabPanel header="Të dhëna të përgjithshme">
    <msh-students-data
      [student]="student"
      [forms]="forms"
      [showStudent]="showStudent"
      [finishedAtSameSchool]="finishedAtSameSchool"></msh-students-data>
  </p-tabPanel>
  <p-tabPanel header="Caktimet për Provime">
    <msh-students-assignments
      [assignments]="(assignments$ | async) || []"></msh-students-assignments
  ></p-tabPanel>
  <p-tabPanel header="Notat">
    <msh-students-grades
      [grades]="(grades$ | async) || []"></msh-students-grades
  ></p-tabPanel>
</p-tabView>
