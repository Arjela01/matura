<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Maturantë</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2" *ngIf="showEditButton">
      <a [routerLink]="['/applications', 'students', 'add']">
        <button
          pButton
          pRipple
          [label]="!hideStudentForm ? 'Anullo' : 'Shto'"
          icon="pi pi-plus"
          class="p-button-success mr-2"></button>
      </a>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-students-grid
        [showEditButton]="showEditButton"
        [students]="(studentList$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getStudent($event)"
        [selectedRecord]="selectedRecord"
        [studentId]="studentId"
        [headerText]="headerText"
        [displayHistoryForm]="displayHistoryForm">
      </msh-students-grid>
    </div>
  </div>
</div>
<ng-container *ngIf="academicYear$ | async"></ng-container>
<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
