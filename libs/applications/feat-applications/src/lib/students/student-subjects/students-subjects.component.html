<div class="grid">
    <div class="col-12 p-fluid">
        <div class="card-form px-6 py-6">
            <ng-container
                    *ngIf="subjects && subjects.length > 0; else noSubjects">
                <div class="col-6">
                    <table id="my-table-2">
                        <thead>
                        <tr>
                            <th>Tipi i Provimit</th>
                            <th>Lënda e Provimit</th>
                            <th>Vlerëshet</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr *ngFor="let subject of subjects">
                            <td class="font-semibold">{{ subject.examTypeName }}</td>
                            <td class="font-semibold">{{ subject.name }}</td>
                            <td class="font-semibold">{{ subject.isNotGraded ? 'Jo' : 'Po' }}</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </ng-container>
            <ng-template #noSubjects>
                <div class="col-12">
                    <p>Maturanti nuk ka lëndë për provim!</p>
                </div>
            </ng-template>
        </div>
    </div>
</div>
