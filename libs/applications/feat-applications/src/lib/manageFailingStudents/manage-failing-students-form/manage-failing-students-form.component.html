<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="grid">
    <div class="field col-4">
      <label for="firstName">Emri </label>
      <input
        type="text"
        pInputText
        id="firstName"
        name="firstName"
        [value]="student.firstName"
        disabled
        autofocus />
    </div>
    <div class="field col-4">
      <label for="lastName">Mbiemri </label>
      <input
        type="text"
        pInputText
        id="lastName"
        name="lastName"
        [value]="student.lastName"
        disabled
        autofocus />
    </div>
    <div class="field col-4">
      <label for="email">Email </label>
      <input
        type="text"
        pInputText
        id="email"
        name="email"
        [value]="student.email"
        disabled
        autofocus />
    </div>
    <div class="field col-4">
      <label for="genderName">Gjinia </label>
      <input
        type="text"
        pInputText
        id="genderName"
        name="genderName"
        [value]="student.genderName"
        disabled
        autofocus />
    </div>
    <div class="field col-4">
      <label for="highSchoolName">Shkolla e Mesme </label>
      <input
        type="text"
        pInputText
        id="highSchoolName"
        name="highSchoolName"
        [value]="student.highSchoolName"
        disabled
        autofocus />
    </div>
    <div class="field col-4">
      <label for="profileName">Profili </label>
      <input
        type="text"
        pInputText
        id="profileName"
        name="profileName"
        [value]="student.profileName"
        disabled
        autofocus />
    </div>
    <div class="field col-4">
      <label for="birthPlace">Vendlindja </label>
      <input
        type="text"
        pInputText
        id="birthPlace"
        name="birthPlace"
        [value]="student.birthPlace"
        disabled
        autofocus />
    </div>
    <div class="field col-4">
      <label for="studentId">ID </label>
      <input
        type="text"
        pInputText
        id="studentId"
        name="studentId"
        [value]="student.studentId"
        disabled
        autofocus />
    </div>
    <div class="field col-4">
      <label for="birthDate">Datëlindja </label>
      <input
        type="text"
        pInputText
        id="birthDate"
        name="birthDate"
        [value]="student.birthDate | date"
        disabled
        autofocus />
    </div>
  </div>

  <div class="field">
    <label for="subject">Lënda </label>
    <input
      type="text"
      pInputText
      id="subject"
      name="subject"
      [(ngModel)]="failingStudent.subject"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !failingStudent.subject
      }" />
    <small class="p-error block" *ngIf="submitted && !failingStudent.subject">
      Lënda është fushë e kërkuar.
    </small>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button type="submit" pButton label="Ruaj" class="p-button w-auto"></button>
  </div>
</form>
