<div class="flex page-header mb-header">
  <h2 class="flex-1 mb-0">Diploma për të Huaj</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <p-button
        (click)="printForeignDiplomas()"
        label="Printo Diplomat"
        icon="pi pi-print"
        class="mr-2">
      </p-button>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-diplomas-student-grid
        [diplomas]="(diplomaList$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getStudentDiplomas($event)">
      </msh-diplomas-student-grid>
    </div>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>

<ng-container *ngIf="academicYear$ | async"></ng-container>
