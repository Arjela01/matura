<div class="flex ml-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Diploma</h2>
  <div class="flex-col">
    <div class="flex">
      <div class="my-2">
        <p-button
          (click)="generateDiplomas()"
          label="Gjenero Diplomat"
          icon="pi pi-play"
          class="mr-2">
        </p-button>
      </div>
      <div class="my-2">
        <button
          pButton
          pRipple
          icon="pi pi-chevron-circle-up"
          label="Dërgo Diplomat për Maturantë që Aplikojnë Jashtë"
          (click)="approveStudentsApplyingAbroad()"
          class="p-button-danger mr-2"></button>
      </div>
      <div class="my-2">
        <button
          pButton
          pRipple
          icon="pi pi-chevron-circle-up"
          label="Dërgo Diplomat të Gjithë"
          (click)="approveEveryone()"
          class="p-button-danger mr-2"></button>
      </div>
    </div>
    <div class="mt-2 mb-2 justify-content-start">
      <span class="text-orange-800 pr-2"
        >Në Pritje: {{ status.waitingCount }}</span
      >
      <span class="text-green-500 pr-2"
        >Dërguar: {{ status.successCount }}</span
      >
      <span class="text-red-500 pr-2">Gabim: {{ status.errorCount }}</span>
      <span class="text-blue-500"
        >Për Miratim: {{ status.needApprovalCount }}</span
      >
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-diplomas-student-grid
        [diplomas]="(diplomaList$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getStudentDiplomas($event)">
      </msh-diplomas-student-grid>
    </div>
  </div>
</div>
<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Informacionet rreth diplomës"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-diplomas-student-form
      [diplomaStatus]="diplomaStatus"
      [selectedAction]="selectedAction"
      [administrationOffices]="administrationOffices"
      [highSchools]="(highSchools$ | async)!!"
      [studentTypes]="studentTypes"
      (admOfficeChanged)="getHighSchoolsByOffice($event)"
      (formClose)="onModalClose()">
    </msh-diplomas-student-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>

<ng-container *ngIf="academicYear$ | async"></ng-container>
