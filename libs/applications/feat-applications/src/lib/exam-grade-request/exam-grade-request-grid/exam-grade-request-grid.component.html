<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examGradeRequest"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="firstName">
        Emri
        <p-sortIcon field="firstName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="firstName"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="middleName">
        Atësia
        <p-sortIcon field="middleName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="middleName"
          matchMode="equals"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="lastName">
        Mbiemri
        <p-sortIcon field="lastName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="lastName"
          matchMode="equals"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="dateOfBirth">
        Datëlindja
        <p-sortIcon field="dateOfBirth"></p-sortIcon>
        <p-columnFilter
          type="date"
          field="dateOfBirth"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="academicYearId">
        Viti Akademik
        <p-sortIcon field="academicYearId"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="academicYearId"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examGradeRequest>
    <tr>
      <td style="width: 20%; min-width: 10rem">
        {{ examGradeRequest.firstName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examGradeRequest.middleName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examGradeRequest.lastName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examGradeRequest.dateOfBirth | date : 'dd/MM/yyyy' }}
      </td>
      <td style="width: 25%; min-width: 10rem">
        {{ examGradeRequest.academicYearId }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text ml-7 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examGradeRequest)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-2 pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examGradeRequest)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
