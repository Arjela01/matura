<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="idCard">NID *</label>
    <input
      type="text"
      pInputText
      id="idCard"
      name="idCard"
      [(ngModel)]="examGradeRequest.idCard"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examGradeRequest.idCard
      }" />
    <small class="p-error block" *ngIf="submitted && !examGradeRequest.idCard">
      NID është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="studentId">Matura ID</label>
    <input
      type="text"
      pInputText
      id="studentId"
      name="studentId"
      [(ngModel)]="examGradeRequest.maturaId"
      autofocus />
  </div>
  <div class="field">
    <label for="firstName">Emri *</label>
    <input
      type="text"
      pInputText
      id="firstName"
      name="firstName"
      [(ngModel)]="examGradeRequest.firstName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examGradeRequest.firstName
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examGradeRequest.firstName">
      Emri është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="middleName">Atësia *</label>
    <input
      type="text"
      pInputText
      id="middleName"
      name="middleName"
      [(ngModel)]="examGradeRequest.middleName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examGradeRequest.middleName
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examGradeRequest.middleName">
      Atësia është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="lastName">Mbiemri *</label>
    <input
      type="text"
      pInputText
      id="lastName"
      name="lastName"
      [(ngModel)]="examGradeRequest.lastName"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examGradeRequest.lastName
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examGradeRequest.lastName">
      Mbiemri është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="email">Email *</label>
    <input
      type="text"
      pInputText
      id="email"
      name="email"
      [(ngModel)]="examGradeRequest.email"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examGradeRequest.email
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examGradeRequest.email">
      Email është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="highSchool"
    >Shkolla ku keni përfunduar arsimin e mesëm. *</label
    >
    <p-dropdown
      id="highSchool"
      [options]="highSchools"
      optionValue="key"
      optionLabel="value"
      name="highSchool"
      appendTo="body"
      [filter]="true"
      [required]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examGradeRequest.highSchoolId"
      [showClear]="true"
      [ngClass]="{
                'ng-invalid ng-dirty':
                  submitted && !examGradeRequest.highSchoolId
              }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examGradeRequest.highSchoolId">
      Shkolla është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="date">Ditëlindja *</label>
    <p-calendar
      [(ngModel)]="date"
      dateFormat="dd/mm/yy"
      inputId="date"
      id="date"
      appendTo="body"
      name="date"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !date
      }"></p-calendar>
    <small class="p-error block" *ngIf="submitted && !date">
      Ditëlindja është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="academicYear">Viti i përfundimit të Maturës *</label>
    <p-dropdown
      id="academicYear"
      [options]="academicYears"
      optionValue="key"
      optionLabel="value"
      name="academicYear"
      appendTo="body"
      [filter]="true"
      [required]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examGradeRequest.academicYearId"
      [showClear]="true">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examGradeRequest.academicYearId">
      Viti është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="description">Përshkrimi</label>
    <textarea
      name="description"
      id="description"
      rows="5"
      cols="30"
      pInputTextarea
      [(ngModel)]="examGradeRequest.description"></textarea>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
