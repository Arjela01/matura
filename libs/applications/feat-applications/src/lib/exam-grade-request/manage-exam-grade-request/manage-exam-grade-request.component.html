<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Kërkesa për notat e provimeve të MSH</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-exam-grade-request-grid
        [examGradeRequest]="(examGradeRequest$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamGradeRequest($event)"
        [selectedRecord]="selectedRecord"
        [studentId]="studentId"
        [headerText]="headerText"
        [displayHistoryForm]="displayHistoryForm">
      </msh-exam-grade-request-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '600px' }"
  header="Detajet e Kërkesës"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-exam-grade-request-form
      [highSchools]="highSchools"
      [academicYears]="academicYears"
      [examGradeRequestDetails]="selectedExamGrade"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-exam-grade-request-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
