<div class="flex ml-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Kërkesë për Diplomë</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
    </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-diploma-request-grid
        [diplomas]="(diplomaRequests$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getDiplomaRequests($event)">
      </msh-diploma-request-grid>
    </div>
  </div>
</div>
<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '600px' }"
  header="Informacionet rreth kërkesës"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-diploma-request-form
      [diplomaDetails]="selectedDiplomaRequest"
      (formSave)="onFormSave($event)"
      (formClose)="onModalClose()">
    </msh-diploma-request-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>

<ng-container *ngIf="academicYear$ | async"></ng-container>
