<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="students"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="firstName">
        Emri
        <p-sortIcon field="firstName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="firstName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="middleName">
        Atesia
        <p-sortIcon field="middleName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="middleName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="lastName">
        Mbiemri
        <p-sortIcon field="lastName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="lastName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="studentId">
        Id e Maturantit
        <p-sortIcon field="studentId"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="studentId"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="idCard">
        NID
        <p-sortIcon field="idCard"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="idCard"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="highSchoolName">
        Shkolla e Mesme
        <p-sortIcon field="highSchoolName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="highSchoolName"
          display="menu"></p-columnFilter>
      </th>
      <th>Shto Lenden</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-failingStudent>
    <tr>
      <td style="width: 15%; min-width: 10rem">
        {{ failingStudent.firstName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ failingStudent.middleName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ failingStudent.lastName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ failingStudent.studentId }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ failingStudent.idCard }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ failingStudent.highSchoolName }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(failingStudent)"
            pTooltip="Shto Lenden" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
