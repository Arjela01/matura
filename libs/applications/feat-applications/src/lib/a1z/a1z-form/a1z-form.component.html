<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card px-6 py-6">
      <div class="text-5xl font-semibold mb-5">Shto Formular A1Z</div>
      <div class="text-3xl font-semibold mb-3">Te dhënat e përgjithshme</div>
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="field" [style]="{ width: '500px' }">
          <label for="academicYearId">Viti Akademik *</label>
          <p-dropdown
            id="academicYearId"
            [options]="academicYears"
            optionValue="key"
            optionLabel="value"
            name="academicYearId"
            [autoDisplayFirst]="false"
            [(ngModel)]="a1z.academicYearId"
            [showClear]="true">
          </p-dropdown>
        </div>

        <button
          type="button"
          pButton
          (click)="onStudentShow()"
          icon="pi pi-search"
          label="Kerko Maturantin"
          class="p-button-text w-auto mb-3 mt-3 surface-500 text-white hover:surface-400"></button>

        <div class="field" [style]="{ width: '500px' }">
          <label for="studentInputData">Maturanti *</label>
          <input
            type="text"
            pInputText
            [value]="studentInputData"
            id="studentInputData"
            name="studentInputData"
            disabled
            [(ngModel)]="a1z.studentInputData"
            required
            autofocus
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !a1z.studentInputData
            }" />
          <small
            class="p-error block"
            *ngIf="submitted && !a1z.studentInputData">
            Maturanti është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label for="isA1">Tip Formulari *</label>
          <input
            type="text"
            pInputText
            id="isA1"
            name="isA1"
            disabled
            [value]="'A1Z'"
            autofocus />
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label for="a1ZCategoryId">Kategoria</label>
          <p-dropdown
            id="a1ZCategoryId"
            [options]="a1Categories"
            optionValue="key"
            optionLabel="value"
            name="a1ZCategoryId"
            [autoDisplayFirst]="false"
            [(ngModel)]="a1z.a1ZCategoryId"
            [showClear]="true">
          </p-dropdown>
          <small class="p-error block" *ngIf="submitted && !a1z.a1ZCategoryId">
            Kategoria është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label class="mb-3">Aplikon jashte vendit? *</label>
          <div class="formgrid grid">
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="isApplyingToForeignCountriesTrue"
                name="isApplyingToForeignCountries"
                [value]="true"
                [(ngModel)]="a1z.isApplyingToForeignCountries"></p-radioButton>
              <label for="isApplyingToForeignCountriesTrue">Po</label>
            </div>
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="isApplyingToForeignCountriesFalse"
                name="isApplyingToForeignCountries"
                [value]="false"
                [(ngModel)]="a1z.isApplyingToForeignCountries"></p-radioButton>
              <label for="isApplyingToForeignCountriesFalse">Jo</label>
            </div>
          </div>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label class="mb-3">Keni marre diplome/deftese pjekurie? *</label>
          <div class="formgrid grid">
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="alreadyHaveDiplomaTrue"
                name="alreadyHaveDiploma"
                [value]="true"
                [(ngModel)]="a1z.alreadyHaveDiploma"></p-radioButton>
              <label for="alreadyHaveDiplomaTrue">Po</label>
            </div>
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="alreadyHaveDiplomaFalse"
                name="alreadyHaveDiploma"
                [value]="false"
                [(ngModel)]="a1z.alreadyHaveDiploma"></p-radioButton>
              <label for="alreadyHaveDiplomaFalse">Jo</label>
            </div>
          </div>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label for="yearOfSchoolA1Z"
            >Viti i perfundimit te shkolles se mesme</label
          >
          <p-dropdown
            id="yearOfSchoolA1Z"
            [options]="academicYears"
            optionValue="key"
            optionLabel="value"
            name="yearOfSchoolA1Z"
            [autoDisplayFirst]="false"
            [(ngModel)]="a1z.yearOfSchoolA1Z"
            [showClear]="true">
          </p-dropdown>
        </div>

        <div class="text-3xl font-semibold mb-3 mt-5">Lendet e Detyruara</div>

        <div class="field" [style]="{ width: '500px' }">
          <label class="mb-3">Lëndët e detyruara që do të mbarten: </label>
          <div class="formgrid grid">
            <div class="field-radiobutton col-2">
              <p-radioButton
                id="noCarriedSubjetsZero"
                name="noCarriedSubjets"
                [value]="0"
                onchange="onNeededSubjectsChange($event)"
                [(ngModel)]="a1z.noCarriedSubjets"></p-radioButton>
              <label for="noCarriedSubjetsZero">Jo</label>
            </div>
            <div class="field-radiobutton col-2">
              <p-radioButton
                id="noCarriedSubjetsOne"
                name="noCarriedSubjets"
                [value]="1"
                onchange="onNeededSubjectsChange($event)"
                [(ngModel)]="a1z.noCarriedSubjets"></p-radioButton>
              <label for="noCarriedSubjetsOne">1</label>
            </div>
            <div class="field-radiobutton col-2">
              <p-radioButton
                id="noCarriedSubjetsTwo"
                name="isWithCompetition"
                [value]="2"
                onchange="onNeededSubjectsChange($event)"
                [(ngModel)]="a1z.noCarriedSubjets"></p-radioButton>
              <label for="noCarriedSubjetsTwo">2</label>
            </div>
            <div class="field-radiobutton col-2">
              <p-radioButton
                id="noCarriedSubjetsThree"
                name="isWithCompetition"
                [value]="3"
                onchange="onNeededSubjectsChange($event)"
                [(ngModel)]="a1z.noCarriedSubjets"></p-radioButton>
              <label for="noCarriedSubjetsThree">3</label>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="formgrid grid">
            <div class="field col-2">
              <label for="carriedSubjectD1">Lenda e detyruar D1</label>
              <p-dropdown
                id="carriedSubjectD1"
                [options]="examSubjects"
                optionValue="key"
                [placeholder]="'Letersi'"
                optionLabel="value"
                name="carriedSubjectD1"
                [disabled]="disableD1Subject"
                [autoDisplayFirst]="false"
                [(ngModel)]="a1z.carriedSubjectD1"
                [showClear]="true">
              </p-dropdown>
            </div>
            <div class="field col-2" [style]="{ width: '100px' }">
              <label for="carriedGradeD1">Nota e gjetur</label>
              <input
                type="number"
                pInputText
                max="10"
                min="4"
                id="carriedGradeD1"
                [disabled]="disableD1Subject"
                name="carriedGradeD1"
                [(ngModel)]="
                  a1z.carriedGradeD1 ? a1z.carriedGradeD1 : a1z.scoreD1A1Z
                "
                required
                autofocus />
            </div>
            <div class="field col-2" [style]="{ width: '100px' }">
              <label for="carriedGradeD1">Nota D1</label>
              <input
                type="number"
                pInputText
                [disabled]="disableD1Subject"
                max="10"
                min="4"
                id="carriedGradeD1"
                name="carriedGradeD1"
                [(ngModel)]="
                  a1z.carriedGradeD1 ? a1z.carriedGradeD1 : a1z.scoreD1A1Z
                "
                required
                autofocus />
            </div>
            <div class="field col-2">
              <label for="carriedReasonD1">Arsye</label>
              <input
                type="text"
                pInputText
                [disabled]="disableD1Subject"
                id="carriedReasonD1"
                name="carriedReasonD1"
                [(ngModel)]="a1z.carriedReasonD1"
                autofocus />
            </div>
          </div>
        </div>

        <div class="field">
          <div class="formgrid grid">
            <div class="field col-2">
              <label for="carriedSubjectD2">Lenda e detyruar D2</label>
              <p-dropdown
                id="carriedSubjectD2"
                [options]="examSubjects"
                [placeholder]="'Matematike'"
                optionValue="key"
                optionLabel="value"
                [disabled]="disableD2Subject"
                name="carriedSubjectD2"
                [autoDisplayFirst]="false"
                [(ngModel)]="a1z.carriedSubjectD2"
                [showClear]="true">
              </p-dropdown>
            </div>
            <div class="field col-2" [style]="{ width: '100px' }">
              <label for="carriedGradeD2">Nota e gjetur</label>
              <input
                type="number"
                pInputText
                max="10"
                min="4"
                [disabled]="disableD2Subject"
                id="carriedGradeD2"
                name="carriedGradeD2"
                [(ngModel)]="
                  a1z.carriedGradeD2 ? a1z.carriedGradeD2 : a1z.scoreD2A1Z
                "
                required
                autofocus />
            </div>
            <div class="field col-2" [style]="{ width: '100px' }">
              <label for="carriedGradeD2">Nota D2</label>
              <input
                type="number"
                pInputText
                max="10"
                min="4"
                id="carriedGradeD2"
                [disabled]="disableD2Subject"
                name="carriedGradeD2"
                [(ngModel)]="
                  a1z.carriedGradeD2 ? a1z.carriedGradeD2 : a1z.scoreD2A1Z
                "
                required
                autofocus />
            </div>
            <div class="field col-2">
              <label for="carriedReasonD2">Arsye</label>
              <input
                type="text"
                pInputText
                [disabled]="disableD2Subject"
                id="carriedReasonD2"
                name="carriedReasonD2"
                [(ngModel)]="a1z.carriedReasonD2"
                autofocus />
            </div>
          </div>
        </div>

        <div class="field">
          <div class="formgrid grid">
            <div class="field col-2">
              <label for="carriedSubjectD3">Lenda e detyruar D3</label>
              <p-dropdown
                id="carriedSubjectD3"
                [options]="examSubjects"
                optionValue="key"
                optionLabel="value"
                name="carriedSubjectD3"
                [disabled]="disableD3Subject"
                [autoDisplayFirst]="false"
                [(ngModel)]="a1z.subjectD3A1ZId"
                [showClear]="true">
              </p-dropdown>
            </div>
            <div class="field col-2" [style]="{ width: '100px' }">
              <label for="carriedGradeD3">Nota e gjetur</label>
              <input
                type="number"
                pInputText
                max="10"
                min="4"
                [disabled]="disableD3Subject"
                id="carriedGradeD3"
                name="carriedGradeD3"
                [(ngModel)]="a1z.carriedGradeD3"
                required
                autofocus />
            </div>
            <div class="field col-2" [style]="{ width: '100px' }">
              <label for="carriedGradeD3">Nota D3</label>
              <input
                type="number"
                pInputText
                max="10"
                min="4"
                [disabled]="disableD3Subject"
                id="carriedGradeD3"
                name="carriedGradeD3"
                [(ngModel)]="a1z.carriedGradeD3"
                required
                autofocus />
            </div>
            <div class="field col-2">
              <label for="carriedReasonD3">Arsye</label>
              <input
                type="text"
                pInputText
                [disabled]="disableD3Subject"
                id="carriedReasonD3"
                name="carriedReasonD3"
                [(ngModel)]="a1z.carriedReasonD3"
                autofocus />
            </div>
          </div>
        </div>

        <div class="text-3xl font-semibold mb-3 mt-5">
          Lendet e detyruara qe do te jepen provim:
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label for="subjectD1A1ZId">Lenda D1:</label>
          <p-dropdown
            id="subjectD1A1ZId"
            [options]="examSubjects"
            optionValue="key"
            optionLabel="value"
            [placeholder]="'Letersi'"
            [disabled]="true"
            name="subjectD1A1ZId"
            [disabled]="true"
            [autoDisplayFirst]="false"
            [(ngModel)]="a1z.subjectD1A1ZId"
            [showClear]="true">
          </p-dropdown>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label for="subjectD2A1ZId">Lenda D2:</label>
          <p-dropdown
            id="subjectD2A1ZId"
            [options]="examSubjects"
            optionValue="key"
            optionLabel="value"
            [placeholder]="'Matematike'"
            [disabled]="true"
            name="subjectD2A1ZId"
            [disabled]="true"
            [autoDisplayFirst]="false"
            [(ngModel)]="a1z.subjectD2A1ZId"
            [showClear]="true">
          </p-dropdown>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label for="d3Subject">Lenda D3:</label>
          <p-dropdown
            id="subjectD3"
            [options]="examSubjects"
            optionValue="key"
            optionLabel="value"
            name="subjectD3"
            [disabled]="false"
            [autoDisplayFirst]="false"
            [(ngModel)]="a1z.subjectD3A1ZId"
            [showClear]="true">
          </p-dropdown>
        </div>

        <div class="text-3xl font-semibold mb-3 mt-5">Lendet me zgjedhje</div>

        <div class="field" [style]="{ width: '500px' }">
          <label class="mb-3">Lendet me zgjedhje qe do te mbarten: </label>
          <div class="formgrid grid">
            <div class="field-radiobutton col-2">
              <p-radioButton
                id="noCarriedSubjetsZTrue"
                name="hasZ1Subject"
                [value]="0"
                [(ngModel)]="a1z.noCarriedSubjetsZ"></p-radioButton>
              <label for="noCarriedSubjetsZTrue">Jo</label>
            </div>
            <div class="field-radiobutton col-2">
              <p-radioButton
                id="noCarriedSubjetsZFalse"
                name="hasZ1Subject"
                [value]="1"
                [(ngModel)]="a1z.noCarriedSubjetsZ"></p-radioButton>
              <label for="noCarriedSubjetsZFalse">1</label>
            </div>
          </div>
        </div>

        <!-- TODO: Get z1 subject from new endpoint -->
        <div class="field" [hidden]="a1z.noCarriedSubjetsZ === 0">
          <div class="formgrid grid">
            <div class="field col-2">
              <label for="yearZ1">Viti</label>
              <p-dropdown
                id="yearZ1"
                [options]="academicYears"
                optionValue="key"
                optionLabel="value"
                name="yearZ1"
                [disabled]="a1z.noCarriedSubjetsZ === 0"
                [autoDisplayFirst]="false"
                [(ngModel)]="a1z.yearZ1"
                [showClear]="true">
              </p-dropdown>
            </div>
            <!-- <div class="field col-2">
              <label for="carriedSubjectAZ1">Lenda me zgjedhje:</label>
              <input
                type="text"
                pInputText
                id="carriedSubjectAZ1"
                name="carriedSubjectAZ1"
                [disabled]="a1z.noCarriedSubjetsZ === 0"
                [(ngModel)]="a1z.carriedSubjectAZ1"
                autofocus />
            </div> -->

            <div class="field" [style]="{ width: '500px' }">
              <label for="carriedSubjectAZ1">Lenda me zgjedhje:</label>
              <p-dropdown
                id="carriedSubjectAZ1"
                [options]="examSubjects"
                optionValue="key"
                optionLabel="value"
                name="carriedSubjectAZ1"
                [disabled]="false"
                [autoDisplayFirst]="false"
                [(ngModel)]="a1z.carriedSubjectZ1"
                [showClear]="true">
              </p-dropdown>
            </div>

            <div class="field col-2" [style]="{ width: '100px' }">
              <label for="carriedGradeAZ1">Nota e gjetur</label>
              <input
                type="number"
                pInputText
                max="10"
                min="4"
                id="carriedGradeAZ1"
                name="carriedGradeAZ1"
                [(ngModel)]="a1z.carriedGradeZ1"
                [disabled]="a1z.noCarriedSubjetsZ === 0"
                [required]="a1z.noCarriedSubjetsZ === 1"
                autofocus />
            </div>
            <div class="field col-2" [style]="{ width: '100px' }">
              <label for="carriedGradeAZ1">Nota Z1</label>
              <input
                type="number"
                pInputText
                id="carriedGradeAZ1"
                name="carriedGradeAZ1"
                max="10"
                min="4"
                [(ngModel)]="a1z.carriedGradeZ1"
                [disabled]="a1z.noCarriedSubjetsZ === 0"
                [required]="a1z.noCarriedSubjetsZ === 1"
                autofocus />
            </div>
            <div class="field col-2">
              <label for="carriedReasonAZ1">Arsye</label>
              <input
                type="text"
                pInputText
                id="carriedReasonAZ1"
                name="carriedReasonAZ1"
                [(ngModel)]="a1z.carriedReasonAZ1"
                [disabled]="a1z.noCarriedSubjetsZ === 0"
                autofocus />
            </div>
          </div>
        </div>

        <div class="text-3xl font-semibold mb-3 mt-5">
          Lendet me zgjedhje qe do te jepen provim
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label for="z1Subject">Lenda Z1:</label>
          <p-dropdown
            id="subjectZ1"
            [options]="examSubjects"
            optionValue="key"
            optionLabel="value"
            name="subjectZ1"
            [disabled]="false"
            [autoDisplayFirst]="false"
            [(ngModel)]="a1z.subjectZ1A1ZId"
            [showClear]="true">
          </p-dropdown>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label for="overseerCode">Kodi I Mbikqyresit</label>
          <input
            type="text"
            pInputText
            id="overseerCode"
            name="overseerCode"
            required
            [(ngModel)]="a1z.overSeerCode"
            autofocus />
          <small class="p-error block" *ngIf="submitted && !a1z.overSeerCode">
            Kodi i mbikqyrësit është fushë e kërkuar.
          </small>
        </div>

        <div class="flex justify-content-end">
          <button
            type="button"
            pButton
            (click)="onExitForm()"
            icon="pi pi-times"
            label="Anullo"
            class="p-button-text w-auto mr-2"></button>
          <button
            type="submit"
            pButton
            icon="pi pi-check"
            label="Ruaj"
            class="p-button-text w-auto"></button>
        </div>
      </form>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="showStudentModal"
  [style]="{ width: '1000px' }"
  header="Maturanti"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onStudentHide()">
  <ng-template pTemplate="content">
    <msh-a1z-student-search
      [students]="(studentList$ | async) || []"
      [totalRecords]="totalRecords"
      (gridEvent)="onGridEvent($event)"
      (lazyLoadData)="getStudents($event)">
    </msh-a1z-student-search>
  </ng-template>
</p-dialog>
