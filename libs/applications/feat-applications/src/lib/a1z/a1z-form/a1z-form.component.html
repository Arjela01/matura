<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card px-6 py-6">
      <h3 class="font-semibold mb-5">Formulari A1Z</h3>
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="field mt-4 mb-4" [style]="{ width: '500px' }">
          <label for="studentInputData">Student *</label>
          <div class="p-inputgroup">
            <p-button
              label="Kerko"
              icon="pi pi-search"
              (click)="onNewClick()"
              [style]="{ height: '100%' }"></p-button>
            <input
              [value]="studentInputData"
              type="text"
              pInputText
              id="studentInputData"
              name="studentInputData"
              [(ngModel)]="studentInputData"
              required
              autofocus
              disabled
              [ngClass]="{
                'ng-invalid ng-dirty': submitted && !studentInputData
              }" />
          </div>
          <small class="p-error block" *ngIf="submitted && !studentInputData">
            Studenti është fushë e kërkuar.
          </small>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label class="mb-3">Aplikon jashtë vendit? *</label>
          <div class="formgrid grid">
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="isApplyingToForeignCountriesTrue"
                name="isApplyingToForeignCountries"
                [value]="true"
                [(ngModel)]="a1z.isApplyingToForeignCountries"></p-radioButton>
              <label for="isApplyingToForeignCountriesTrue">Po</label>
            </div>
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="isApplyingToForeignCountriesFalse"
                name="isApplyingToForeignCountries"
                [value]="false"
                [(ngModel)]="a1z.isApplyingToForeignCountries"></p-radioButton>
              <label for="isApplyingToForeignCountriesFalse">Jo</label>
            </div>
          </div>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label class="mb-3">Keni marre diplome/deftese pjekurie? *</label>
          <div class="formgrid grid">
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="alreadyHaveDiplomaTrue"
                name="alreadyHaveDiploma"
                [value]="true"
                [(ngModel)]="a1z.alreadyHaveDiploma"></p-radioButton>
              <label for="alreadyHaveDiplomaTrue">Po</label>
            </div>
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="alreadyHaveDiplomaFalse"
                name="alreadyHaveDiploma"
                [value]="false"
                [(ngModel)]="a1z.alreadyHaveDiploma"></p-radioButton>
              <label for="alreadyHaveDiplomaFalse">Jo</label>
            </div>
          </div>
        </div>

        <div class="field" [style]="{ width: '500px' }">
          <label for="yearOfSchoolA1Z"
            >Viti i përfundimit të shkollës së mesme</label
          >
          <input
            type="number"
            pInputText
            id="yearOfSchoolA1Z"
            name="yearOfSchoolA1Z"
            [(ngModel)]="a1z.yearOfSchoolA1Z"
            autofocus />
        </div>

        <div class="text-3xl font-semibold mb-3 mt-5">Lëndët e Detyruara</div>

        <table class="table w-100">
          <tr>
            <th>Tipi</th>
            <th>Lënda</th>
            <th>Mbart</th>
            <th>Nota e Mbartur</th>
            <th>Viti</th>
            <th>Arsyeja</th>
          </tr>
          <tr>
            <td>D1</td>
            <td>
              <p-dropdown
                [style]="{ minWidth: '200px' }"
                id="subjectD1Id"
                [options]="d1ExamSubjects"
                optionValue="key"
                optionLabel="value"
                name="carriedSubjectD1"
                [filter]="true"
                [disabled]="true"
                [autoDisplayFirst]="false"
                [(ngModel)]="a1z.subjectD1Id"
                [showClear]="true">
              </p-dropdown>
            </td>
            <td>
              <p-dropdown
                id="carriedSubjectD1"
                [options]="booly"
                (onChange)="onSubjectD1Change($event)"
                optionValue="value"
                optionLabel="label"
                name="enableD1Subject"
                [filter]="false"
                [disabled]="false"
                [autoDisplayFirst]="false"
                [(ngModel)]="enableD1Subject">
              </p-dropdown>
            </td>
            <td>
              <input
                type="number"
                pInputText
                max="10"
                [disabled]="!enableD1Subject"
                min="4"
                id="scoreD1"
                name="scoreD1"
                [(ngModel)]="a1z.scoreD1"
                autofocus />
            </td>
            <td>
              <input
                type="text"
                pInputText
                [disabled]="!enableD1Subject"
                id="yearD1"
                name="yearD1"
                [(ngModel)]="a1z.yearD1"
                autofocus />
            </td>
            <td>
              <input
                type="text"
                pInputText
                [disabled]="!enableD1Subject"
                id="reasonD1"
                name="reasonD1"
                [(ngModel)]="a1z.reasonD1"
                autofocus />
            </td>
          </tr>
          <tr>
            <td>D2</td>
            <td>
              <p-dropdown
                [style]="{ minWidth: '200px' }"
                id="subjectD2Id"
                [options]="d2ExamSubjects"
                optionValue="key"
                optionLabel="value"
                name="carriedSubjectD2"
                [filter]="true"
                [disabled]="true"
                [autoDisplayFirst]="false"
                [(ngModel)]="a1z.subjectD2Id"
                [showClear]="true">
              </p-dropdown>
            </td>
            <td>
              <p-dropdown
                id="carriedSubjectD2"
                [options]="booly"
                (onChange)="onSubjectD2Change($event)"
                optionValue="value"
                optionLabel="label"
                name="enableD2Subject"
                [filter]="false"
                [disabled]="false"
                [autoDisplayFirst]="false"
                [(ngModel)]="enableD2Subject">
              </p-dropdown>
            </td>
            <td>
              <input
                type="number"
                pInputText
                max="10"
                [disabled]="!enableD2Subject"
                min="4"
                id="scoreD2"
                name="scoreD2"
                [(ngModel)]="a1z.scoreD2"
                autofocus />
            </td>
            <td>
              <input
                type="text"
                pInputText
                [disabled]="!enableD2Subject"
                id="yearD2"
                name="yearD2"
                [(ngModel)]="a1z.yearD2"
                autofocus />
            </td>
            <td>
              <input
                type="text"
                pInputText
                [disabled]="!enableD2Subject"
                id="reasonD2"
                name="reasonD2"
                [(ngModel)]="a1z.reasonD2"
                autofocus />
            </td>
          </tr>
          <tr>
            <td>D3</td>
            <td>
              <p-dropdown
                [style]="{ minWidth: '200px' }"
                id="subjectD3Id"
                [options]="d3ExamSubjects"
                optionValue="key"
                optionLabel="value"
                name="carriedSubjectD3"
                [filter]="true"
                [disabled]="true"
                [autoDisplayFirst]="false"
                [(ngModel)]="a1z.subjectD3Id"
                [showClear]="true">
              </p-dropdown>
            </td>
            <td>
              <p-dropdown
                id="carriedSubjectD3"
                [options]="booly"
                (onChange)="onSubjectD3Change($event)"
                optionValue="value"
                optionLabel="label"
                name="enableD3Subject"
                [filter]="false"
                [disabled]="false"
                [autoDisplayFirst]="false"
                [(ngModel)]="enableD3Subject">
              </p-dropdown>
            </td>
            <td>
              <input
                type="number"
                pInputText
                max="10"
                [disabled]="!enableD3Subject"
                min="4"
                id="scoreD3"
                name="scoreD3"
                [(ngModel)]="a1z.scoreD3"
                autofocus />
            </td>
            <td>
              <input
                type="text"
                pInputText
                [disabled]="!enableD3Subject"
                id="yearD3"
                name="yearD3"
                [(ngModel)]="a1z.yearD3"
                autofocus />
            </td>
            <td>
              <input
                type="text"
                pInputText
                [disabled]="!enableD3Subject"
                id="reasonD3"
                name="reasonD3"
                [(ngModel)]="a1z.reasonD3"
                autofocus />
            </td>
          </tr>
        </table>

        <div class="text-3xl font-semibold mb-3 mt-5">Lëndët me Zgjedhje</div>

        <table class="table">
          <tr>
            <th>Tipi</th>
            <th>Lënda</th>
            <th>Mbart</th>
            <th>Nota e Gjetur</th>
            <th>Nota e Mbartur</th>
            <th>Arsyeja</th>
          </tr>
          <tr>
            <td>Z1</td>
            <td>
              <p-dropdown
                [style]="{ minWidth: '200px' }"
                id="subjectZ1Id"
                [options]="z1ExamSubjects"
                optionValue="key"
                optionLabel="value"
                name="carriedSubjectZ1"
                [filter]="true"
                [disabled]="true"
                [autoDisplayFirst]="false"
                [(ngModel)]="a1z.subjectZ1Id"
                [showClear]="true">
              </p-dropdown>
            </td>
            <td>
              <p-dropdown
                id="carriedSubjectZ1"
                [options]="booly"
                (onChange)="onSubjectZ1Change($event)"
                optionValue="value"
                optionLabel="label"
                name="enableZ1Subject"
                [filter]="false"
                [disabled]="false"
                [autoDisplayFirst]="false"
                [(ngModel)]="enableZ1Subject">
              </p-dropdown>
            </td>
            <td>
              <input
                type="number"
                pInputText
                max="10"
                [disabled]="!enableZ1Subject"
                min="4"
                id="scoreZ1"
                name="scoreZ1"
                [(ngModel)]="a1z.scoreZ1"
                autofocus />
            </td>
            <td>
              <input
                type="text"
                pInputText
                [disabled]="!enableZ1Subject"
                id="yearZ1"
                name="yearZ1"
                [(ngModel)]="a1z.yearZ1"
                autofocus />
            </td>
            <td>
              <input
                type="text"
                pInputText
                [disabled]="!enableZ1Subject"
                id="reasonZ1"
                name="reasonZ1"
                [(ngModel)]="a1z.reasonZ1"
                autofocus />
            </td>
          </tr>
        </table>

        <hr />

        <div class="field" [style]="{ width: '500px' }">
          <label for="overseerCode">Kodi i Mbikqyresit</label>
          <input
            type="password"
            pPassword
            [feedback]="false"
            id="overseerCode"
            name="overseerCode"
            required
            [(ngModel)]="a1z.overSeerCode"
            autofocus />
          <small class="p-error block" *ngIf="submitted && !a1z.overSeerCode">
            Kodi i mbikqyrësit është fushë e kërkuar.
          </small>
        </div>

        <div class="flex justify-content-end">
          <button
            type="button"
            pButton
            (click)="onExitForm()"
            icon="pi pi-times"
            label="Anullo"
            class="p-button-text w-auto mr-2"></button>
          <button
            type="submit"
            pButton
            icon="pi pi-check"
            label="Ruaj"
            class="p-button-text w-auto"></button>
        </div>
      </form>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="showStudentModal"
  [style]="{ width: '1000px' }"
  header="Maturanti"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onStudentHide()">
  <ng-template pTemplate="content">
    <msh-shared-student-lookup
      [students]="(studentList$ | async) || []"
      [totalRecords]="totalRecords"
      (gridEvent)="onGridEvent($event)"
      (lazyLoadData)="getStudents($event)">
    </msh-shared-student-lookup>
  </ng-template>
</p-dialog>
