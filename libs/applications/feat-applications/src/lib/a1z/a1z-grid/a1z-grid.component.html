<p-table
  #dt
  [lazy]="true"
  [value]="a1z"
  responsiveLayout="scroll"
  [rows]="10"
  [totalRecords]="totalRecords"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  dataKey="Id"
  [(selection)]="selectedA1Z"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="studentId">
        ID Maturanti
        <div>
          <p-sortIcon field="studentId"></p-sortIcon>
          <p-columnFilter
                  type="text"
                  field="studentId"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="NID">
        NID
        <div>
          <p-sortIcon field="NID"></p-sortIcon>
          <p-columnFilter
                  type="text"
                  field="NID"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="firstName">
        Emri i Studentit
        <div>
          <p-sortIcon field="firstName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="firstName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="middleName">
        Atësia
        <div>
          <p-sortIcon field="middleName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="middleName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="lastName">
        Mbiemri
        <div>
          <p-sortIcon field="lastName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="lastName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="studentOldIdentifier">
        ID e vjetër
        <div>
          <p-sortIcon field="studentOldIdentifier"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="studentOldIdentifier"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="birthDate">
        Datëlindja
        <div>
          <p-sortIcon field="birthDate"></p-sortIcon>
          <p-columnFilter
            type="date"
            field="birthDate"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="birthPlace">
        Vendlindja
        <div>
          <p-sortIcon field="birthPlace"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="birthPlace"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="academicYear">
        Viti
        <div>
          <p-sortIcon field="academicYear"></p-sortIcon>
          <p-columnFilter
                  type="text"
                  field="academicYear"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-a1z>
    <tr>
      <td style="width: 10%; min-width: 10rem">
        <a [routerLink]="['/configurations/student-view', a1z.studentId]" class="p-button-link">{{ a1z.studentId }}</a>
      </td>
      <td style="width: 10%; min-width: 10rem">
        {{ a1z.nid }}
      </td>
      <td style="width: 10%; min-width: 10rem">
        {{ a1z.firstName }}
      </td>
      <td style="width: 10%; min-width: 10rem">
        {{ a1z.middleName }}
      </td>
      <td style="width: 10%; min-width: 10rem">
        {{ a1z.lastName }}
      </td>
      <td style="width: 10%; min-width: 10rem">
        {{ a1z.studentOldIdentifier }}
      </td>
      <td style="width: 10%; min-width: 10rem">
        {{ a1z.birthDate | date }}
      </td>
      <td style="width: 10%; min-width: 10rem">
        {{ a1z.birthPlace }}
      </td>
      <td style="width: 10%; min-width: 10rem">
        {{ a1z.academicYear }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(a1z)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(a1z)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
