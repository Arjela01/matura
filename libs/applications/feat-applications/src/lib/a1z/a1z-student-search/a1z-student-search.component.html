<p-table
  #dt
  dataKey="Id"
  responsiveLayout="scroll"
  [value]="students"
  stateStorage="local"
  stateKey="a1-student-local"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Kërko Maturantin</h5>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id">
        ID
        <p-sortIcon field="id"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="id"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="firstName">
        Emri
        <p-sortIcon field="firstName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="firstName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="fatherName">
        Atësia
        <p-sortIcon field="fatherName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="fatherName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="lastName">
        Mbiemri
        <p-sortIcon field="lastName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="lastName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="studentId">
        NID
        <p-sortIcon field="studentId"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="studentId"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <td style="width: 20%; min-width: 10rem">
        {{ student.studentId }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ student.firstName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ student.middleName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ student.lastName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ student.idCard }}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            icon="pi pi-check"
            class="p-button-success mr-2"
            label="Zgjidh"
            (click)="onStudentSelect(student)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
