<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="students"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Kerko Maturantin</h5>
      <!-- <span class="block mt-2 md:mt-0 p-input-icon-left">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Kërko..."
          class="w-full sm:w-auto" />
      </span> -->
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <!-- <th style="width: 3rem">
        <p-tableHeaderCheckbox (click)="onSelectAllClick()">
        </p-tableHeaderCheckbox>
      </th> -->
      <th pSortableColumn="id">
        ID
        <p-sortIcon field="id"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="id"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="studentFirstName">
        Emri
        <p-sortIcon field="studentFirstName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="studentFirstName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="studentFatherName">
        Atesia
        <p-sortIcon field="studentFatherName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="studentFatherName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="studentLastName">
        Mbiemri
        <p-sortIcon field="studentLastName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="studentLastName"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="nid">
        NID
        <p-sortIcon field="nid"></p-sortIcon>
        <p-columnFilter type="text" field="nid" display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <!-- <td>
        <p-tableCheckbox [value]="student"></p-tableCheckbox>
      </td> -->
      <td style="width: 14%; min-width: 10rem">
        {{ student.id }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.studentFirstName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.studentFatherName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.studentLastName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ student.nid }}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-check"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Zgjidh"
            tooltipPosition="bottom"
            (click)="onStudentSelect(student)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
