<p-table
  #dt
  dataKey="code"
  responsiveLayout="scroll"
  [value]="carriedGrades"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedGrades"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="ID">
        ID
        <div>
          <p-sortIcon field="ID"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="ID"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="NID">
        NID
        <div>
          <p-sortIcon field="NID"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="NID"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="NID">
        Studenti
        <div>
          <p-sortIcon field="StudentFullName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="StudentFullName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examTypeName">
        Tipi
        <div>
          <p-sortIcon field="examTypeName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examTypeName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examSubjectName">
        Lënda
        <div>
          <p-sortIcon field="examSubjectName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examSubjectName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="academicYearName">
        Viti
        <div>
          <p-sortIcon field="academicYearName"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="academicYearName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="grade">
        Nota
        <div>
          <p-sortIcon field="grade"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="grade"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="isDocument">
        Dokument?
        <div>
          <p-sortIcon field="isDocument"></p-sortIcon>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-grade>
    <tr>
      <td style="width: 5%">
        {{ grade.id }}
      </td>
      <td style="width: 5%; min-width: 10rem">
        {{ grade.nid }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ grade.studentFullName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ grade.examTypeName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ grade.examSubjectName }}
      </td>
      <td style="width: 5%; min-width: 10rem">
        {{ grade.academicYearName }}
      </td>
      <td style="width: 5%; min-width: 10rem">
        {{ grade.grade }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        <div *ngIf="grade.document">
          <img
            src="assets/svg/download.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            pTooltip="Shkarko"
            (click)="onDownloadClick(grade)" />
        </div>
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(grade)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(grade)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
