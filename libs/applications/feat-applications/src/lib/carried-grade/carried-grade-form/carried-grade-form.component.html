<form #carriedGradeForm="ngForm" (ngSubmit)="onSubmit()">
  <div class="field w-full">
    <label for="studentInputData-carried-grade-form">Maturant *</label>
    <div class="p-inputgroup">
      <input
        type="text"
        [disabled]="!showStudentSearchButton"
        pInputText
        id="studentInputData-carried-grade-form"
        name="studentInputData"
        [(ngModel)]="studentInputData"
        autofocus
        readonly="readonly"
        [required]="true"
        [ngClass]="{
          'ng-invalid ng-dirty': submitted && !studentInputData
        }" />
      <p-button
        *ngIf="showStudentSearchButton"
        label="Kërko"
        icon="pi pi-search"
        (click)="openStudentModal.emit()"
        [style]="{ height: '100%' }"></p-button>
    </div>
    <small class="p-error block" *ngIf="submitted && !studentInputData">
      Studenti është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="academicYearId">Viti *</label>
    <p-dropdown
      id="academicYearId"
      optionValue="key"
      optionLabel="value"
      appendTo="body"
      name="academicYearId"
      [filter]="true"
      [options]="academicYearDropdown"
      [ngModelOptions]="{ standalone: true }"
      [required]="true"
      [autoDisplayFirst]="false"
      [style]="{ width: '100%' }"
      (onChange)="examTypeChangedLocally()"
      [(ngModel)]="grade.academicYearId"
      [ngClass]="{
        'ng-invalid ng-dirty':
          submitted && (!grade.academicYearId || grade.academicYearId === 0)
      }">
    </p-dropdown>

    <small class="p-error block" *ngIf="submitted && !grade.academicYearId">
      Viti është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ExamTypeID">Tipi I Provimit *</label>
    <p-dropdown
      id="ExamTypeID"
      optionValue="key"
      optionLabel="value"
      appendTo="body"
      name="ExamTypeID"
      [filter]="true"
      [options]="examTypeDropdown"
      [ngModelOptions]="{ standalone: true }"
      [required]="true"
      [autoDisplayFirst]="false"
      [style]="{ width: '100%' }"
      [(ngModel)]="grade.examTypeId"
      (onChange)="examTypeChangedLocally()"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !this.examTypeId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !this.examTypeId">
      Tipi i provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ExamSubjectID">Lënda *</label>
    <p-dropdown
      id="ExamSubjectID"
      optionValue="key"
      optionLabel="value"
      appendTo="body"
      defaultLabel="Zgjidh Lëndën"
      name="ExamSubjectID"
      [options]="examSubjectDropdown"
      [ngModelOptions]="{ standalone: true }"
      [required]="true"
      [autoDisplayFirst]="false"
      [virtualScrollItemSize]="10"
      [filter]="true"
      [virtualScroll]="true"
      [style]="{ width: '100%' }"
      [(ngModel)]="grade.examSubjectId"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !grade.examSubjectId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !grade.examSubjectId">
      Lënda i provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="Grade">Nota *</label>
    <input
      type="number"
      pInputText
      id="Grade"
      name="Grade"
      [(ngModel)]="grade.grade"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !grade.grade }" />
    <small class="p-error block" *ngIf="submitted && !grade.grade">
      Nota është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="reason">Arsyetimi *</label>
    <textarea
      type="text"
      pInputTextarea
      id="reason"
      name="reason"
      [(ngModel)]="grade.reason"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !grade.reason }"
      rows="5"></textarea>
    <small class="p-error block" *ngIf="submitted && !grade.reason">
      NID është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="document"
      >Dokumenti
      <a class="p-button-text cursor-pointer" (click)="clearFile()"
        >Fshi</a
      ></label
    >
    <div class="form-group drop-files noLabel">
      <p-fileUpload
        #uploader
        id="document"
        [showUploadButton]="false"
        class="ie-file-upload"
        (onSelect)="selectFiles($event)"
        accept=".pdf,.docx,.jpg,.png,.txt,.xlsx,.">
        <ng-template pTemplate="content">
          <img
            [src]="'data:image;base64,' + grade.document"
            width="100"
            height="100"
            *ngIf="grade.document && !uploaded && grade.document"
            alt="" />
        </ng-template>
      </p-fileUpload>
    </div>
  </div>
  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
