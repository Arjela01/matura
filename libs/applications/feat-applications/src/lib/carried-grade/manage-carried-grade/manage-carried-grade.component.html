<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Nota të Mbartura</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success"
        (click)="onNewClick()"></button>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-carried-grades-grid
        [carriedGrades]="(carriedGrades$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getCarriedGrades($event)"
        [selectedRecord]="selectedRecord"
        [studentId]="studentId"
        [headerText]="headerText"
        [displayHistoryForm]="displayHistoryForm">
      </msh-carried-grades-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e notës"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-carried-grade-form
      [gradeDetails]="selectedCarriedGrade"
      [examTypeDropdown]="examTypeDropdown"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)"
      (openStudentModal)="this.showStudentModal = true"
      (examTypeChanged)="getSubjectsDropdown($event)"
      [examSubjectDropdown]="examSubjectsDropdown"
      [selectedStudent]="selectedStudent"
      [academicYearDropdown]="academicYearsDropdown">
    </msh-carried-grade-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>

<p-dialog
  [(visible)]="showStudentModal"
  [style]="{ width: '1000px' }"
  [modal]="true"
  header="Kërko Maturantin"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onStudentHide()">
  <ng-template pTemplate="content">
    <msh-shared-student-lookup
      [students]="(studentList$ | async) || []"
      [totalRecords]="totalStudentRecords"
      (gridEvent)="onStudentGridEvent($event)"
      (lazyLoadData)="getStudents($event)">
    </msh-shared-student-lookup>
  </ng-template>
</p-dialog>
<ng-container *ngIf="academicYear$ | async"></ng-container>
