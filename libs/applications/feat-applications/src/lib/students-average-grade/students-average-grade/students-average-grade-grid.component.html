<div class="flex ml-2 mb-5 page-header mb-header">
  <h2 class="flex-1 mb-0">Notat Mesatare</h2>
</div>

<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [totalRecords]="totalRecords"
  [scrollable]="true"
  scrollHeight="820px"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  (onLazyLoad)="getAverageGrades($event)"
  [value]="(avgGradeList$ | async) || []"
  selectionMode="multiple"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="studentStudentId">
        Matura ID
        <div>
          <p-sortIcon field="studentStudentId"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="studentStudentId"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="studentFirstName">
        Emri
        <div>
          <p-sortIcon field="studentFirstName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="studentFirstName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="studentMiddleName">
        Atësia
        <div>
          <p-sortIcon field="studentMiddleName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="studentMiddleName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="barcode">
        Mbiemri
        <div>
          <p-sortIcon field="barcode"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="barcode"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="studentNid">
        Nid
        <div>
          <p-sortIcon field="studentNid"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="studentNid"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="averageGrade">
        Nota mesatare
        <div>
          <p-sortIcon field="averageGrade"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="averageGrade"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="academicYearName">
        Viti
        <div>
          <p-sortIcon field="academicYearName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="academicYearName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <td style="width: 15%; min-width: 10rem">
        <a
          [routerLink]="['/applications/students/view', student.studentId]"
          class="p-button-link">
          {{ student.studentStudentId }}
        </a>
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ student.studentFirstName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ student.studentMiddleName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ student.studentLastName }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ student.studentNid }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ student.averageGrade }}
      </td>
      <td style="width: 15%; min-width: 10rem">
        {{ student.academicYearName }}
      </td>
    </tr>
  </ng-template>
</p-table>
<ng-container *ngIf="academicYear$ | async"></ng-container>
