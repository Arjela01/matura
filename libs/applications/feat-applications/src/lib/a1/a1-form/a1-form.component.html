<div class="grid">
    <div class="col-12">
        <div class="card">
            <h3>Shto Formular A1</h3>
            <h5 class="uppercase">Të Dhëna të përgjithshme</h5>
            <form #form="ngForm" class="mt-5" (ngSubmit)="onSubmit()" *ngIf="showForm">

                <div class="field xl:w-4  lg:w-6 sm:w-full">
                    <label for="academicYear">Viti akademik </label>
                    <input type="text" class="w-full" pInputText id="academicYear" name="academicYear"
                        [(ngModel)]="academicYear!!.year" readonly />
                </div>
                <div class="field xl:w-4 lg:w-6 sm:w-full">
                    <label for="student">Maturanti</label>
                    <input type="text" class="w-full" [(ngModel)]="choosenStudent" pInputText id="studentInfo"
                        name="studentInfo" readonly
                        [ngClass]="{ 'ng-invalid ng-dirty': submitted  && (!choosenStudent || choosenStudent==='') }"
                        required />
                    <small class="p-error block" *ngIf="submitted && !choosenStudent">
                        Maturanti është fushë e kërkuar.
                    </small>
                </div>
                <div [style]="{ width: '180px' }" *ngIf="!id">
                    <button pButton pRipple type="button" icon="pi pi-search" label="Kërko maturantin"
                        (click)="initializeDialog()" class="p-button-gray w-full"></button>
                </div>

                <div class="field xl:w-4 mt-5 lg:w-6 sm:w-full">
                    <label for="d3Dubject">Lenda D3</label>
                    <p-dropdown id="d3Dubject" [options]="d3Dropdown" optionValue="key" autoWidth="false"
                        [style]="{'width':'100%'}" optionLabel="value" name="subjectD3Id" [required]="false"
                        class="w-full block" [(ngModel)]="a1.subjectD3Id" [autoDisplayFirst]="false" [showClear]="true"
                        [ngClass]="{ 'ng-invalid ng-dirty': submitted  && (!a1.subjectD3Id || a1.subjectD3Id==='') }">
                    </p-dropdown>
                    <small class="p-error block" *ngIf="submitted && (!a1.subjectD3Id || a1.subjectD3Id==='')">
                        Lënda D3 është fushë e kërkuar.
                    </small>
                </div>
                <div class="field xl:w-4  lg:w-6  sm:w-full">
                    <label class="mb-3">Aplikon jashtë vendit *</label>
                    <div class="formgrid grid w-full">
                        <div class="field-radiobutton col-6">
                            <p-radioButton id="isApplyingToForeignCountriesTrue" name="isApplyingToForeignCountries"
                                [value]="true" [(ngModel)]="a1.isApplyingToForeignCountries"></p-radioButton>
                            <label for="isApplyingToForeignCountriesTrue">Po</label>
                        </div>
                        <div class="field-radiobutton col-6">
                            <p-radioButton id="isApplyingToForeignCountriesFalse" name="isApplyingToForeignCountries"
                                [value]="false" [(ngModel)]="a1.isApplyingToForeignCountries"></p-radioButton>
                            <label for="isApplyingToForeignCountriesFalse">Jo</label>
                        </div>
                    </div>
                </div>
                <div class="field xl:w-4  lg:w-6  sm:w-full">
                    <label class="mb-3">Keni marrë diplomë/dëftesë pjekurie</label>
                    <div class="formgrid grid w-full">
                        <div class="field-radiobutton col-6">
                            <p-radioButton id="alreadyHaveDiplomaTrue" name="alreadyHaveDiploma" [value]="true"
                                [(ngModel)]="a1.alreadyHaveDiploma"></p-radioButton>
                            <label for="alreadyHaveDiplomaTrue">Po</label>
                        </div>
                        <div class="field-radiobutton col-6">
                            <p-radioButton id="alreadyHaveDiplomaFalse" name="alreadyHaveDiploma" [value]="false"
                                [(ngModel)]="a1.alreadyHaveDiploma"></p-radioButton>
                            <label for="alreadyHaveDiplomaFalse">Jo</label>
                        </div>
                    </div>
                </div>
                <h5 class="uppercase mt-5">Lëndët me zgjedhje</h5>
                <div class="field xl:w-4  lg:w-6  smxs:w-full">
                    <label for="optionalSubjects">Lëndët me zgjedhje</label>
                    <p-dropdown id="optionalSubjects" [options]="optionalSubjects" autoWidth="false"
                        [style]="{'width':'100%'}" optionLabel="value" name="optionalSubject" class="w-full block"
                        [(ngModel)]="optionalSubjectChoosen" [autoDisplayFirst]="false" [showClear]="true"
                        [ngClass]="{ 'ng-invalid ng-dirty': submitted  && subjectsChoosen.length < 1 }">
                    </p-dropdown>

                </div>
                <div [style]="{ width: '180px' }">
                    <button pButton pRipple type="button" label="Zgjidh" (click)="addSubject()"
                        class="p-button-gray w-full"></button>
                </div>
                <div class="field xl:w-4  lg:w-6 sm:w-full  mt-5" *ngIf="subjectsChoosen && subjectsChoosen.length > 0">
                    <h5 class="px-0">Ju zgjodhët lëndët</h5>
                    <p-table #dt dataKey="key" responsiveLayout="scroll" [value]="subjectsChoosen" [rows]="10"
                        class="px-0 mt-5" [rowHover]="true">

                        <ng-template pTemplate="header">
                            <tr>

                                <th pSortableColumn="name" class="px-0">
                                    Emri
                                </th>
                                <th></th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-subject let-rowIndex="rowIndex">
                            <tr>

                                <td style="width: 100%; min-width: 10rem" class="px-0">
                                    {{ subject.value }}
                                </td>
                                <td>
                                    <div class="flex">

                                        <button pButton pRipple icon="pi pi-trash" (click)="onDeleteClick(rowIndex)"
                                            class="p-button-rounded p-button-danger p-button-text" pTooltip="Fshi"
                                            tooltipPosition="bottom"></button>
                                    </div>
                                </td>
                            </tr>
                        </ng-template>
                    </p-table>

                </div>
                <small class="p-error block" *ngIf="submitted && (subjectsChoosen.length < 1 )">
                    *Duhet zgjedhur minimalisht 1 lëndë
                </small>
                <small class="p-error block" *ngIf="moreSubjectThanAllowed">
                    *Duhen zgjedhur maksimalisht 2 lëndë
                </small>
                <div class="field lg:w-4 md:w-6 sm:w-full mt-5">
                    <label for="isA1">Kodi i mbikqyrësit</label>
                    <input type="password" pInputText required id="overSeerCode" class="w-full"
                        [(ngModel)]="a1.overSeerCode" name="overSeerCode"
                        [ngClass]="{ 'ng-invalid ng-dirty': submitted  && (!a1.overSeerCode || a1.overSeerCode==='') }" />
                </div>
                <small class="p-error block" *ngIf="submitted && (!a1.overSeerCode || a1.overSeerCode==='')">
                    Kodi i mbikqyrësit është fushë e kërkuar.
                </small>
                <div class="flex justify-content-end">
                    <button type="button" pButton icon="pi pi-times" label="Anullo" class="p-button-text w-auto mr-2"
                        (click)="onCancelClick()"></button>
                    <button type="submit" pButton icon="pi pi-check" label="Ruaj" class="p-button-text w-auto"></button>
                </div>
            </form>
        </div>
    </div>
</div>
