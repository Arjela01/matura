<div class="flex ml-2 mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">
    {{
    A1FormModeEnum.Add === mode || A1FormModeEnum.AddWithStudent === mode
      ? 'Shto Formular A1'
      : 'Ndrysho Formularin A1'
    }}
  </h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        label="Konfirmuar"
        icon="pi pi-check"
        class="p-button-success p-button-outlined mr-2"
        *ngIf="selectedStudent?.isConfirmedBySupervisor"></button>
      <button
        *ngIf="!showStudentSearchButton"
        pButton
        label="Ndrysho Maturantin"
        icon="pi pi-pencil  "
        class="mr-2 p-button-secondary"
        (click)="editStudent()"></button>
    </div>
  </div>
</div>

<div class="grid">
  <div class="col-12">
    <div class="card-form px-6 py-4 mb-header mt-3">
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="field xl:w-4 mt-5 lg:w-6 sm:w-full">
          <label for="studentInputData">Maturant *</label>
          <div class="p-inputgroup">
            <input
              type="text"
              [disabled]="!showStudentSearchButton"
              pInputText
              id="studentInputData"
              name="studentInputData"
              [(ngModel)]="studentInputData"
              autofocus
              readonly="readonly"
              [required]="true"
              [ngClass]="{
                'ng-invalid ng-dirty': submitted && !studentInputData
              }"/>
            <p-button
              *ngIf="showStudentSearchButton"
              label="Kërko"
              icon="pi pi-search"
              (click)="showStudentModal = true"
              [style]="{ height: '100%' }"></p-button>
          </div>
          <small class="p-error block" *ngIf="submitted && !studentInputData">
            Studenti është fushë e kërkuar.
          </small>
        </div>
        <div class="field pt-3 xl:w-4 lg:w-6 sm:w-full">
          <label class="mb-3">Aplikon jashtë vendit *</label>
          <div class="formgrid grid w-full">
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="isApplyingToForeignCountriesTrue"
                name="isApplyingToForeignCountries"
                [value]="true"
                [(ngModel)]="a1.isApplyingToForeignCountries"></p-radioButton>
              <label for="isApplyingToForeignCountriesTrue">Po</label>
            </div>
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="isApplyingToForeignCountriesFalse"
                name="isApplyingToForeignCountries"
                [value]="false"
                [(ngModel)]="a1.isApplyingToForeignCountries"></p-radioButton>
              <label for="isApplyingToForeignCountriesFalse">Jo</label>
            </div>
          </div>
        </div>
        <h5 class="mt-5">Lëndë me Detyrim</h5>
        <div class="field xl:w-4 lg:w-6 smxs:w-full">
          <div class="p-inputgroup flex align-items-center w-full mb-3">
            <div class="flex align-items-center justify-content-center pr-2">
              D3:
            </div>
            <div
              class="flex align-items-center justify-content-center flex-grow-1">
              <p-dropdown
                id="optionalSubjects2"
                [options]="d3Dropdown"
                [style]="{ width: '100%' }"
                optionLabel="value"
                optionValue="key"
                name="optionalSubject"
                defaultLabel="Zgjidh Lëndën"
                [(ngModel)]="a1.subjectD3Id"
                [autoDisplayFirst]="false"
                [showClear]="true">
              </p-dropdown>
            </div>
          </div>
        </div>

        <h5 class="mt-5">Lëndë me Zgjedhje</h5>
        <div class="field xl:w-4 lg:w-6 smxs:w-full">
          <div class="p-inputgroup flex align-items-center w-full mb-3">
            <div class="flex align-items-center justify-content-center pr-2">
              Z1:
            </div>
            <div
              class="flex align-items-center justify-content-center flex-grow-1">
              <p-dropdown
                id="optionalSubjects"
                [options]="optionalSubjects"
                [style]="{ width: '100%' }"
                optionLabel="value"
                optionValue="key"
                name="optionalSubject"
                [(ngModel)]="a1.subjectD1Id"
                [autoDisplayFirst]="false"
                [showClear]="true">
              </p-dropdown>
            </div>
          </div>
          <div class="p-inputgroup flex align-items-center w-full">
            <div class="flex align-items-center justify-content-center pr-2">
              <label for="subjectZ2Id">Z2:</label>
            </div>
            <div
              class="flex align-items-center justify-content-center flex-grow-1">
              <p-dropdown
                id="subjectZ2Id"
                [options]="optionalSubjects"
                [style]="{ width: '100%' }"
                optionLabel="value"
                optionValue="key"
                name="optionalSubject"
                defaultLabel="Zgjidh Lëndën (Opsionale)"
                [(ngModel)]="a1.subjectZ2Id"
                [autoDisplayFirst]="false"
                [showClear]="true">
              </p-dropdown>
            </div>
          </div>
        </div>
        <div class="field lg:w-4 md:w-6 sm:w-full mt-5">
          <label for="overSeerCode">Kodi i mbikqyrësit</label>
          <input
            type="password"
            pInputText
            id="overSeerCode"
            class="w-full"
            required
            [(ngModel)]="a1.overSeerCode"
            name="overSeerCode"
            [ngClass]="{
              'ng-invalid ng-dirty':
                submitted && (!a1.overSeerCode || a1.overSeerCode === '')
            }"/>
        </div>
        <small
          class="p-error block"
          *ngIf="submitted && (!a1.overSeerCode || a1.overSeerCode === '')">
          Kodi i mbikqyrësit është fushë e kërkuar.
        </small>
        <div class="flex justify-content-start">
          <button
            [disabled]="form.invalid"
            type="submit"
            pButton
            label="Ruaj"
            class="p-button w-auto"></button>
          <button
            type="button"
            pButton
            label="Anullo"
            class="p-button-text w-auto mr-2"
            (click)="onCancelClick()"></button>
        </div>
      </form>
    </div>
  </div>
</div>
<ng-container *ngIf="academicYear$ | async"></ng-container>

<p-dialog
  [(visible)]="showStudentModal"
  [style]="{ width: '1000px' }"
  [modal]="true"
  header="Kërko Maturantin"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onStudentHide()">
  <ng-template pTemplate="content">
    <msh-shared-student-lookup
      [students]="(studentList$ | async) || []"
      [totalRecords]="totalStudentRecords"
      (gridEvent)="onGridEvent($event)"
      (lazyLoadData)="getStudents($event)">
    </msh-shared-student-lookup>
  </ng-template>
</p-dialog>
