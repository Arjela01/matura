<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 m-0">
    {{ !formId ? 'Shto Formular A1' : 'Ndrysho Formular A1' }}
  </h2>
</div>

<div class="grid">
  <div class="col-12">
    <div class="card-form px-6 py-6 mb-header mt-3">
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div>
          <button
            *ngIf="!showSearch"
            pButton
            label="Kthehu te Maturanti"
            icon="pi pi-arrow-left"
            class="mr-2 back-button"
            (click)="goBack()"></button>
        </div>

        <div class="field xl:w-4 mt-5 lg:w-6 sm:w-full">
          <label for="studentInputData">Maturant *</label>
          <div class="p-inputgroup">
            <input
              type="text"
              [disabled]="!showSearch || editing"
              pInputText
              id="studentInputData"
              name="studentInputData"
              [(ngModel)]="choosenStudent"
              autofocus
              readonly="readonly"
              [required]="true"
              [ngClass]="{
                'ng-invalid ng-dirty': submitted && !choosenStudent
              }" />
            <p-button
              *ngIf="!editing && showSearch"
              label="Kërko"
              icon="pi pi-search"
              (click)="initializeDialog()"
              [style]="{ height: '100%' }"></p-button>
          </div>
          <small class="p-error block" *ngIf="submitted && !choosenStudent">
            Studenti është fushë e kërkuar.
          </small>
        </div>
        <div class="field xl:w-4 mt-5 lg:w-6 sm:w-full">
          <label for="d3Dubject">Lënda D3</label>
          <p-dropdown
            id="d3Dubject"
            [options]="d3Dropdown"
            optionValue="key"
            autoWidth="false"
            [style]="{ width: '100%' }"
            optionLabel="value"
            name="subjectD3Id"
            [required]="false"
            class="w-full block"
            [(ngModel)]="a1.subjectD3Id"
            [autoDisplayFirst]="false"
            [showClear]="true"
            [ngClass]="{
              'ng-invalid ng-dirty':
                submitted && (!a1.subjectD3Id || a1.subjectD3Id === '')
            }">
          </p-dropdown>
          <small
            class="p-error block"
            *ngIf="submitted && (!a1.subjectD3Id || a1.subjectD3Id === '')">
            Lënda D3 është fushë e kërkuar.
          </small>
        </div>
        <div class="field xl:w-4 lg:w-6 sm:w-full">
          <label class="mb-3">Aplikon jashtë vendit *</label>
          <div class="formgrid grid w-full">
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="isApplyingToForeignCountriesTrue"
                name="isApplyingToForeignCountries"
                [value]="true"
                [(ngModel)]="a1.isApplyingToForeignCountries"></p-radioButton>
              <label for="isApplyingToForeignCountriesTrue">Po</label>
            </div>
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="isApplyingToForeignCountriesFalse"
                name="isApplyingToForeignCountries"
                [value]="false"
                [(ngModel)]="a1.isApplyingToForeignCountries"></p-radioButton>
              <label for="isApplyingToForeignCountriesFalse">Jo</label>
            </div>
          </div>
        </div>
        <!-- <div class="field xl:w-4 lg:w-6 sm:w-full">
                  <label class="mb-3">Keni marrë diplomë/dëftesë pjekurie</label>
                  <div class="formgrid grid w-full">
                    <div class="field-radiobutton col-6">
                      <p-radioButton id="alreadyHaveDiplomaTrue" name="alreadyHaveDiploma" [value]="true"
                        [(ngModel)]="a1.alreadyHaveDiploma"></p-radioButton>
                      <label for="alreadyHaveDiplomaTrue">Po</label>
                    </div>
                    <div class="field-radiobutton col-6">
                      <p-radioButton id="alreadyHaveDiplomaFalse" name="alreadyHaveDiploma" [value]="false"
                        [(ngModel)]="a1.alreadyHaveDiploma"></p-radioButton>
                      <label for="alreadyHaveDiplomaFalse">Jo</label>
                    </div>
                  </div>
                </div> -->
        <h5 class="uppercase mt-5">Lëndët me zgjedhje</h5>
        <div class="field xl:w-4 lg:w-6 smxs:w-full">
          <label for="optionalSubjects">Shto lëndë me zgjedhje</label>
          <div class="p-inputgroup w-full">
            <p-dropdown
              id="optionalSubjects"
              [options]="optionalSubjects"
              [style]="{ width: '100%' }"
              optionLabel="value"
              name="optionalSubject"
              [(ngModel)]="optionalSubjectChoosen"
              [autoDisplayFirst]="false"
              [showClear]="true"
              (onChange)="addSubject()"
              [ngClass]="{
                'ng-invalid ng-dirty': submitted && subjectsChoosen.length < 1
              }">
            </p-dropdown>
          </div>
        </div>
        <div
          class="field xl:w-4 lg:w-6 sm:w-full mt-5 ml-4"
          *ngIf="subjectsChoosen && subjectsChoosen.length > 0">
          <p-table
            #dt
            dataKey="key"
            responsiveLayout="scroll"
            [value]="subjectsChoosen"
            [rows]="10"
            class="px-0 mt-5"
            [rowHover]="true">
            <ng-template pTemplate="header">
              <tr>
                <th pSortableColumn="name" class="px-2">Lëndët e Zgjedhura</th>
                <th></th>
              </tr>
            </ng-template>
            <ng-template
              pTemplate="body"
              let-subjectsChoosen
              let-rowIndex="rowIndex">
              <tr>
                <td style="width: 100%; min-width: 10rem" class="px-2">
                  {{ subjectsChoosen.value }}
                </td>
                <td>
                  <div class="flex">
                    <button
                      pButton
                      pRipple
                      icon="pi pi-trash"
                      (click)="onDeleteClick(rowIndex)"
                      class="p-button-danger"> Hiq</button>
                  </div>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
        <small
          class="p-error block"
          *ngIf="submitted && subjectsChoosen.length < 1">
          *Duhet zgjedhur minimalisht 1 lëndë
        </small>
        <!--        <small class="p-error block" *ngIf="moreSubjectThanAllowed">-->
        <!--          *Duhen zgjedhur maksimalisht 2 lëndë-->
        <!--        </small>-->
        <div class="field lg:w-4 md:w-6 sm:w-full mt-5">
          <label for="isA1">Kodi i mbikqyrësit</label>
          <input
            type="password"
            pInputText
            id="overSeerCode"
            class="w-full"
            required
            [(ngModel)]="a1.overSeerCode"
            name="overSeerCode"
            [ngClass]="{
              'ng-invalid ng-dirty':
                submitted && (!a1.overSeerCode || a1.overSeerCode === '')
            }" />
        </div>
        <small
          class="p-error block"
          *ngIf="submitted && (!a1.overSeerCode || a1.overSeerCode === '')">
          Kodi i mbikqyrësit është fushë e kërkuar.
        </small>
        <div class="flex justify-content-end">
          <button
            type="button"
            pButton
            label="Anullo"
            class="p-button-text w-auto mr-2"
            (click)="onCancelClick()"></button>
          <button
            [disabled]="form.invalid"
            type="submit"
            pButton
            label="Ruaj"
            class="p-button w-auto"></button>
        </div>
      </form>
    </div>
  </div>
</div>
<ng-container *ngIf="academicYear$ | async"></ng-container>
