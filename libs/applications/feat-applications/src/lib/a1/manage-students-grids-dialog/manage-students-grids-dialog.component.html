<p-table #dt dataKey="id" responsiveLayout="scroll" [value]="(students$ | async) || []" [totalRecords]="totalRecords"
    [rows]="10" [paginator]="true" [rowsPerPageOptions]="[10, 20, 30]" [showCurrentPageReport]="true"
    currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde" [rowHover]="true"
    (onLazyLoad)="loadRows($event)" [lazy]="true">
    <ng-template pTemplate="caption">
        <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
            <h5 class="mb-3">Zgjidh Studentët</h5>

        </div>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
          <td></td>

            <th pSortableColumn="studentId">
                ID
                <p-sortIcon field="studentId"></p-sortIcon>
                <p-columnFilter type="text" field="studentId" display="menu"></p-columnFilter>
            </th>
            <th pSortableColumn="firstName">
                Emri
                <p-sortIcon field="firstName"></p-sortIcon>
                <p-columnFilter type="text" field="firstName" display="menu"></p-columnFilter>
            </th>
            <th pSortableColumn="middleName">
                Atësia
                <p-sortIcon field="middleName"></p-sortIcon>
                <p-columnFilter type="text" field="middleName" display="menu"></p-columnFilter>
            </th>
            <th pSortableColumn="lastName">
                Mbiemri
                <p-sortIcon field="lastName"></p-sortIcon>
                <p-columnFilter type="text" field="lastName" display="menu"></p-columnFilter>
            </th>
            <th pSortableColumn="idCard">
                NID
                <p-sortIcon field="idCard"></p-sortIcon>
                <p-columnFilter type="text" field="idCard" display="menu"></p-columnFilter>
            </th>
            <th></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-student>
        <tr>
          <td>
            <button
              pButton
              pRipple
              icon="pi pi-check"
              class="p-button-rounded p-button-success p-button-text mr-2"
              pTooltip="Zgjidh"
              tooltipPosition="bottom"
              (click)="selectStudent(student)"></button>
          </td>
            <td style="width: 20%; min-width: 10rem">
                {{student.studentId}}
            </td>
            <td style="width: 20%; min-width: 10rem">
                {{student.firstName}}
            </td>
            <td style="width: 20%; min-width: 10rem">
                {{student.middleName}}
            </td>
            <td style="width: 20%; min-width: 10rem">
                {{student.lastName}}
            </td>
            <td style="width: 20%; min-width: 10rem">
                {{student.idCard}}
            </td>
            <td>
            </td>
        </tr>
    </ng-template>
</p-table>
