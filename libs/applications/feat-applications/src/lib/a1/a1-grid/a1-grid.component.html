<div class="grid">
    <div class="col-12">
        <div class="card px-6 py-6">
            <p-toolbar styleClass="mb-4">
                <div class="p-toolbar-group-left">
                    <div class="my-2">
                        <button pButton pRipple label="Shto" icon="pi pi-plus" class="p-button-success mr-2"
                            (click)="onNewClick()"></button>
                        <button pButton pRipple label="Fshi" icon="pi pi-trash" class="p-button-danger"
                            [disabled]="selectedA1Forms.length === 0" (click)="onDeleteSelectedClick()"></button>
                    </div>
                </div>
                <div class="p-toolbar-group-right">
                    <button pButton pRipple label="Eksporto" icon="pi pi-upload" class="p-button-help"></button>
                </div>
            </p-toolbar>
            <p-table #dt dataKey="id" responsiveLayout="scroll" [value]="(a1$ | async) || []"
                [totalRecords]="totalRecords" [rows]="10" [paginator]="true" [rowsPerPageOptions]="[10, 20, 30]"
                [showCurrentPageReport]="true"
                currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde" [rowHover]="true"
                (onLazyLoad)="getA1($event)" [lazy]="true">
                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                        <h5 class="m-0">Menaxho formularët A1</h5>
                        <span class="block mt-2 md:mt-0 p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" placeholder="Kërko..." class="w-full sm:w-auto" />
                        </span>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 3rem">
                            <p-tableHeaderCheckbox>
                            </p-tableHeaderCheckbox>
                        </th>
                        <th pSortableColumn="academicYear">
                            Viti
                            <p-sortIcon field="academicYear"></p-sortIcon>
                            <p-columnFilter type="string" field="academicYear" display="menu"></p-columnFilter>
                        </th>
                        <th pSortableColumn="studentFirstName">
                            Emri
                            <p-sortIcon field="studentFirstName"></p-sortIcon>
                            <p-columnFilter type="text" field="studentFirstName" display="menu"></p-columnFilter>
                        </th>
                        <th pSortableColumn="studentFatherName">
                            Atësia
                            <p-sortIcon field="studentFatherName"></p-sortIcon>
                            <p-columnFilter type="text" field="studentFatherName" display="menu"></p-columnFilter>
                        </th>
                        <th pSortableColumn="studentLastName">
                            Mbiemri
                            <p-sortIcon field="studentLastName"></p-sortIcon>
                            <p-columnFilter type="text" field="studentLastName" display="menu"></p-columnFilter>
                        </th>
                        <th pSortableColumn="studentNid">
                            NID
                            <p-sortIcon field="studentNid"></p-sortIcon>
                            <p-columnFilter type="text" field="studentNid" display="menu"></p-columnFilter>
                        </th>
                        <th pSortableColumn="studentIdentifier">
                            ID maturanti
                            <p-sortIcon field="studentIdentifier"></p-sortIcon>
                            <p-columnFilter type="text" field="studentIdentifier" display="menu"></p-columnFilter>
                        </th>
                        <th pSortableColumn="studentOldIdentifier">
                            ID e vjetër
                            <p-sortIcon field="studentOldIdentifier"></p-sortIcon>
                            <p-columnFilter type="text" field="studentOldIdentifier" display="menu"></p-columnFilter>
                        </th>
                        <th pSortableColumn="isApplyingToForeignCountries">
                            Aplikon jashtë
                            <p-sortIcon field="isApplyingToForeignCountries"></p-sortIcon>
                            <p-columnFilter type="text" field="isApplyingToForeignCountries"
                                display="menu"></p-columnFilter>
                        </th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-a1>
                    <tr>
                        <td>
                            <p-tableCheckbox [value]="a1"></p-tableCheckbox>
                        </td>
                        <td style="width: 10%; min-width: 10rem">
                            {{a1.academicYear}}
                        </td>
                        <td style="width: 10%; min-width: 10rem">
                            {{a1.studentFirstName}}
                        </td>
                        <td style="width: 10%; min-width: 10rem">
                            {{a1.studentFatherName}}
                        </td>
                        <td style="width: 10%; min-width: 10rem">
                            {{a1.studentLastName}}
                        </td>
                        <td style="width: 10%; min-width: 10rem">
                            {{a1.studentNid}}
                        </td>
                        <td style="width: 10%; min-width: 10rem">
                            {{a1.studentIdentifier}}
                        </td>
                        <td style="width: 10%; min-width: 10rem">
                            {{a1.studentOldIdentifier}}
                        </td>
                        <td style="width: 10%; min-width: 10rem">
                            {{a1.isApplyingToForeignCountries}}
                        </td>
                        <td>
                            <div class="flex">
                                <button pButton pRipple icon="pi pi-pencil"
                                    class="p-button-rounded p-button-warning p-button-text mr-2" pTooltip="Ndrysho"
                                    tooltipPosition="bottom" (click)="onGridEvent(gridAction.EDIT,a1)"></button>
                                <button pButton pRipple icon="pi pi-trash"
                                    class="p-button-rounded p-button-danger p-button-text" pTooltip="Fshi"
                                    tooltipPosition="bottom" (click)="onGridEvent(gridAction.DELETE,a1)"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<p-confirmDialog #cd header="Konfirmo" icon="pi pi-exclamation-triangle" [style]="{ width: '450px' }">
    <ng-template pTemplate="footer">
        <button type="button" pButton icon="pi pi-times" label="Jo" class="p-button-text"
            (click)="cd.reject()"></button>
        <button type="button" pButton icon="pi pi-check" label="Po" class="p-button-text"
            (click)="cd.accept()"></button>
    </ng-template>
</p-confirmDialog>
