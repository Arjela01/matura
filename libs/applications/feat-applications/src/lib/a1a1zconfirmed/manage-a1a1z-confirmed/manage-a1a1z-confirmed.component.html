<div class="grid">
    <div class="col-12">
        <div class="card px-6 py-6">
            <div class="flex ml-2 mb-2 page-header">
                <h2 class="flex-1 mb-0">Maturantë</h2>
            </div>
            <a1a1z-grid [students]="(studentList$ | async) || []" [totalRecords]="totalRecords"
                (gridEvent)="onGridEvent($event)" (lazyLoadData)="getStudent($event)">
            </a1a1z-grid>
        </div>
    </div>
</div>

<p-confirmDialog #cd header="Konfirmo" icon="pi pi-exclamation-triangle" [style]="{ width: '450px' }">
    <ng-template pTemplate="footer">
        <button type="button" pButton icon="pi pi-times" label="No" class="p-button-text"
            (click)="cd.reject()"></button>
        <button type="button" pButton icon="pi pi-check" label="Yes" class="p-button-text"
            (click)="cd.accept()"></button>
    </ng-template>
</p-confirmDialog>
