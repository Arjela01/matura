<div>
  <h2 class="flex-1 mb-0">{{ !this.isEditMode ? 'Hidh Pikët Analitike' : 'Ndrysho Pikët Analitike' }}</h2>
  <div class="mt-4">
    <msh-exam-question-score-filters
      (formSave)="getExamQuestionScoresList($event)"
      (examSubjectChanged)="getExamSubjectDropdown($event)"
      (examVariantChanged)="getExamVariantDropdown($event)"
      [examVariants]="examVariants"
      [examSubjects]="examSubjects"
      [examTypes]="examTypes"
      [examQuestionScoreTotal]="examQuestionScoreTotal"></msh-exam-question-score-filters>
  </div>
  <div class="mt-4">
    <msh-exam-question-score-grid
      [examVariantMaximumScore]="examVariantTotalScore"
      [totalScore]="totalScore"
      [examQuestionScoreList]="(examQuestionScoreList$ | async) || []"
      [totalRecords]="totalRecords"
      (writingScoreChange)="saveExamScore($event)"
      (deleteMultiple)="deleteExamScore($event)"
      (calculate)="calculateTotalScore()">
    </msh-exam-question-score-grid>
  </div>
</div>
<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
