<div class="grid">
  <div class="col-5 p-fluid">
    <form #form="ngForm" (ngSubmit)="defaultOnSubmit($event);">
      <div class="field colmn w-8" [style]="{ width: '500px' }">
        <label for="examType">Tipi i Provimit *</label>
        <p-dropdown
          id="examType"
          [tabindex]="1"
          [options]="examTypes"
          optionValue="key"
          optionLabel="value"
          name="examType"
          appendTo="body"
          [filter]="true"
          [required]="true"
          [autoDisplayFirst]="false"
          (onChange)="onExamTypeChanged()"
          (onClear)="onExamTypeChanged()"
          [(ngModel)]="examQuestionScoreTotal.examTypeId"
          [showClear]="true"
          [ngClass]="{
            'ng-invalid ng-dirty':
              submitted && !examQuestionScoreTotal.examTypeId
          }">
        </p-dropdown>
        <small
          class="p-error block"
          *ngIf="submitted && !examQuestionScoreTotal.examTypeId">
          Tipi i Provimit është fushë e kërkuar.
        </small>
      </div>
      <div class="field colmn w-8" [style]="{ width: '500px' }">
        <label for="examSubject">Lënda e Provimit *</label>
        <p-dropdown
          id="examSubject"
          [tabindex]="2"
          [options]="examSubjects"
          optionValue="key"
          optionLabel="value"
          name="examSubject"
          appendTo="body"
          (onChange)="onExamSubjectChanged()"
          (onClear)="onExamSubjectChanged()"
          [filter]="true"
          [required]="true"
          [autoDisplayFirst]="false"
          [(ngModel)]="examQuestionScoreTotal.examSubjectId"
          [showClear]="true"
          [ngClass]="{
            'ng-invalid ng-dirty':
              submitted && !examQuestionScoreTotal.examSubjectId
          }">
        </p-dropdown>
        <small
          class="p-error block"
          *ngIf="submitted && !examQuestionScoreTotal.examSubjectId">
          Lënda është fushë e kërkuar.
        </small>
      </div>

      <div class="field colmn w-8" [style]="{ width: '500px' }">
        <label for="examVariant">Varianti i Provimit *</label>
        <p-dropdown
          id="examVariant"
          [tabindex]="3"
          [options]="examVariants"
          optionValue="key"
          optionLabel="value"
          name="examVariant"
          appendTo="body"
          [filter]="true"
          [required]="true"
          [autoDisplayFirst]="false"
          [(ngModel)]="examQuestionScoreTotal.examVariantId"
          [showClear]="true"
          [ngClass]="{
            'ng-invalid ng-dirty':
              submitted && !examQuestionScoreTotal.examVariantId
          }"
          >examQuestionScoreList
        </p-dropdown>
        <small
          class="p-error block"
          *ngIf="submitted && !examQuestionScoreTotal.examVariantId">
          Varianti është fushë e kërkuar.
        </small>
      </div>

      <div class="field colmn w-8">
        <label for="testNumber">Nr. Testi *</label>
        <input
          #testNumber
          type="text"
          pInputText
          [tabindex]="4"
          autocomplete="off"
          (keydown.enter)="onKeyPress()"
          placeholder="Nr. Testi"
          [disabled]="!examQuestionScoreTotal.examVariantId"
          id="testNumber"
          name="testNumber"
          [(ngModel)]="examQuestionScoreTotal.testNumber"
          required
          [ngClass]="{
            'ng-invalid ng-dirty': submitted && !examQuestionScoreTotal.barcode
          }" />
        <small
          class="p-error block"
          *ngIf="submitted && !examQuestionScoreTotal.barcode">
          Nr. Testi është fushë e kërkuar.
        </small>
      </div>

      <div class="field colmn w-8">
        <label for="barcode">Barkodi *</label>
        <input
          #barcode
          mshToUppercase
          type="text"
          [tabindex]="5"
          maxlength="7"
          minlength="7"
          pInputText
          placeholder="Barkodi"
          autocomplete="off"
          [disabled]="!examQuestionScoreTotal.examVariantId"
          id="barcode"
          [pattern]="barcodePattern"
          name="barcode"
          (change)="onSubmit()"
          (keydown.enter)="onSubmit()"
          [(ngModel)]="examQuestionScoreTotal.barcode"
          required
          [ngClass]="{
            'ng-invalid ng-dirty': submitted && !examQuestionScoreTotal.barcode
          }" />
        <small
          class="p-error block"
          *ngIf="submitted && !examQuestionScoreTotal.barcode">
          Barkodi është fushë e kërkuar.
        </small>
      </div>
    </form>
  </div>
</div>
