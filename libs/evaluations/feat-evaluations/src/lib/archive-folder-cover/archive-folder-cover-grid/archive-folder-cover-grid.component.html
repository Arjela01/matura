<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="archiveFolders"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalStudentRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedArchiveFolders"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption" >
    <div
      class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
      <h5 class="m-0">Raporti</h5>
      <span class="block mt-2 md:mt-0 p-input-icon-left">

      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="folder">
        Numri
        <p-sortIcon field="folder"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="folder"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="barcode">
        Barkodi
        <p-sortIcon field="barcode"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="barcode"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-archiveFolder>
    <tr>
      <td>
        <p-tableCheckbox [value]="archiveFolder"></p-tableCheckbox>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveFolder.code }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveFolder.name }}
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-folder-open"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Aktivizo Dosjen"
            tooltipPosition="bottom"
            (click)="onActivate(archiveFolder)"></button>
        </div>
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-qrcode"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(archiveFolder)"></button>
        </div>
      </td>
      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(archiveFolder)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
