<div class="flex ml-2 mb-2 page-header mb-header">
  <h2 class="flex-1">Notat</h2>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <p-table
        #dt
        dataKey="id"
        responsiveLayout="scroll"
        [value]="(examGrade$ | async) || []"
        [totalRecords]="totalRecords"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="[10, 20, 30]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
        [rowHover]="true"
        selectionMode="multiple"
        (onLazyLoad)="getExamGrades($event)"
        [lazy]="true">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="studentName">
              Maturanti ID
              <div>
                <p-sortIcon field="studentId"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="studentId"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="studentName">
              Maturanti
              <div>
                <p-sortIcon field="studentName"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="studentName"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="examSubjectName">
              Emri i lëndës së provimit
              <div>
                <p-sortIcon field="examSubjectName"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="examSubjectName"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="isCarriedOver">
              Është i mbartur?
              <div>
                <p-sortIcon field="isCarriedOver"></p-sortIcon>
                <p-columnFilter
                  type="boolean"
                  field="isCarriedOver"
                  display="menu"
                  matchMode="equals"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="grade">
              Nota
              <div>
                <p-sortIcon field="grade"></p-sortIcon>
                <p-columnFilter
                  type="numeric"
                  field="grade"
                  display="menu"
                  matchMode="equals"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="isFall">
              Është vjeshtë?
              <div>
                <p-sortIcon field="isFall"></p-sortIcon>
                <p-columnFilter
                  type="boolean"
                  field="isFall"
                  display="menu"
                  matchMode="equals"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-examGrade>
          <tr>
            <td style="width: 25%">
              {{ examGrade.studentId }}
            </td>
            <td style="width: 25%">
              {{ examGrade.studentName }}
            </td>
            <td style="width: 25%">
              {{ examGrade.examSubjectName }}
            </td>
            <td style="width: 20%">
              {{ examGrade.isCarriedOver ? 'Po' : 'Jo' }}
            </td>
            <td style="width: 15%">
              {{ examGrade.grade }}
            </td>
            <td style="width: 25%">
              {{ examGrade.isFall ? 'Po' : 'Jo' }}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
<ng-container *ngIf="academicYear$ | async"></ng-container>
