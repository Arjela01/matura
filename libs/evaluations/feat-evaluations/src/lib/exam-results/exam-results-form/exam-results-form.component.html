<form #form="ngForm" (ngSubmit)="onSubmit()">
  <ng-container *ngIf="examType === 'elaboration'">
    <div class="field">
      <label for="Points">Pikët me shtjellim *</label>
      <input
        type="number"
        pInputText
        id="Points"
        name="Code"
        [(ngModel)]="examResult.elaboration_points"
        required
        autofocus
        [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examResult.elaboration_points }"
      />
      <small class="p-error block" *ngIf="submitted && !examResult.elaboration_points">
        Pikët është fushë e kërkuar.
      </small>
    </div>
  </ng-container>
  <ng-container *ngIf="examType === 'alternative'">
    <div class="field">
      <label for="PointsAlt">Pikët me alt *</label>
      <input
        type="number"
        pInputText
        id="PointsAlt"
        name="Code"
        [(ngModel)]="examResult.alternative_points"
        required
        autofocus
        [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examResult.alternative_points }"
      />
      <small class="p-error block" *ngIf="submitted && !examResult.alternative_points">
        Pikët është fushë e kërkuar.
      </small>
    </div>
  </ng-container>
  <div class="field">
    <label for="Reason">Arsyeja e ndryshimit *</label>
    <input
      type="text"
      pInputText
      id="Reason"
      name="Reason"
      [(ngModel)]="examResult.reason"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examResult.reason }"/>
    <small class="p-error block" *ngIf="submitted && !examResult.reason">
      Arsyeja e ndryshimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label>Dokumentacion mbështetës *</label>
    <p-fileUpload name="myfile[]" [customUpload]="true" (uploadHandler)="myUploader($event)"></p-fileUpload>
  </div>


  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"></button>
  </div>
</form>
