<div>
  <h2 class="flex-1 mb-0">Lista e Pikeve te Provimit</h2>
  <div class="mt-4">
    <msh-exam-score-view-filters
      (formSave)="getExamScoresListById($event)"
      [archiveFolder]="archiveFolder"
    ></msh-exam-score-view-filters>
  </div>
  <div class="mt-4">
    <msh-exam-score-view-table
      [examScoreLists]="(examScoreList$ | async) || []"
      [totalRecords]="totalRecords"
    ></msh-exam-score-view-table>
  </div>
</div>
