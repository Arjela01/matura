<table>
  <thead>
    <tr>
      <th>Dosja</th>
      <th>Numer</th>
      <th>Tipi i Provimit</th>
      <th>Lenda e Provimit</th>
      <th>Barkodi</th>
      <th>Pike Total</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let rowData of examScoreLists">
      <td>{{ rowData.archiveExam.archiveFolderId}}</td>
      <td>{{ rowData.archiveExam.archiveFolderNr }}</td>
      <td>{{ rowData.examScore.examTypeName }}</td>
      <td>{{ rowData.examScore.examSubjectName }}</td>
      <td>{{ rowData.archiveExam.barcode }}</td>
      <td>
        <ng-container
          *ngIf="rowData.examScore.hasWritingScore === undefined; else inputField">
          <input
            type="text"
            pInputText
            id="writingScore"
            name="writingScore"
            [(ngModel)]="rowData.examScore.writingScore"
            (keyup.enter)="saveWritingScoreChanges(rowData)"
            />
        </ng-container>
        <ng-template #inputField>
          {{ rowData.examScore.writingScore }}
        </ng-template>
      </td>
    </tr>
  </tbody>
</table>
