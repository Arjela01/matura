<div class="grid">
  <div class="col-5 p-fluid">
    <form #form="ngForm">
      <div class="field colmn w-8" [style]="{ width: '500px' }">
        <label for="examType">Tipi i Provimit *</label>
        <input
          id="examType"
          name="examType"
          type="text"
          pInputText
          [disabled]="true"
          [(ngModel)]="this.examTypeId" />
      </div>

      <div class="field colmn w-8" [style]="{ width: '500px' }">
        <label for="subject">Lënda e Provimit *</label>
        <input
          id="subject"
          name="subject"
          type="text"
          pInputText
          [disabled]="true"
          [(ngModel)]="this.examSubjectId" />
      </div>

      <div class="field colmn w-8" [style]="{ width: '500px' }">
        <label for="examVariant">Varianti i Provimit *</label>
        <input
          id="examVariant"
          name="examVariant"
          type="text"
          pInputText
          [disabled]="true"
          [(ngModel)]="this.examVariantId" />
      </div>

      <div class="field colmn w-8">
        <label for="barcode">Barkodi *</label>
        <input
          type="text"
          maxlength="7"
          minlength="7"
          pInputText
          placeholder="Barkodi"
          [disabled]="true"
          id="barcode"
          name="barcode"
          [(ngModel)]="examQuestionScoreList.barcode" />
      </div>
    </form>
  </div>
</div>
