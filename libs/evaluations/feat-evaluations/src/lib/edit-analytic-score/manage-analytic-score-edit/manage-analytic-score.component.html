<div>
  <div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Ndrysho Pikët Analitike</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2 mx-5">
      <p-button
        type="button"
        icon="pi pi-arrow-left"
        styleClass="p-button-link"
        (click)="onBackButtonClick()"
        [label]="'Kthehu'"></p-button>
    </div>
  </div>
    </div>
  <div class="mt-4">
    <msh-analytic-score-filters
      [examQuestionScoreList]="analyticScoreFilters"
      [examSubjectId]="examSubjectId"
      [examTypeId]="examTypeId"
      [examVariantId]="examVariantId">
    </msh-analytic-score-filters>
  </div>
  <div class="mt-4">
    <msh-exam-question-score-grid
      [examVariantId]="examVariantId"
      [examVariantMaximumScore]="examVariantTotalScore"
      [totalScore]="totalScore"
      [examQuestionScoreList]="(examQuestionScoreList$ | async) || []"
      [totalRecords]="totalRecords"
      (writingScoreChange)="saveExamScore($event)"
      (deleteMultiple)="deleteMultipleExamScore($event)"
      (calculate)="calculateTotalScore()"
      (gridEvent)="onGridEvent($event)">
    </msh-exam-question-score-grid>
  </div>
</div>
<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
