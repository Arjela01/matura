<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Kërkesa për Njësimin e Diplomës</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-diploma-recognition-grid
        [diplomaRecognitionRecords]="(diplomaRecognition$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getDiplomaRecognitionRecords($event)"
        [selectedRecord]="selectedRecord"
        [id]="id"
        [headerText]="headerText"
        [displayHistoryForm]="displayHistoryForm">
      </msh-diploma-recognition-grid>
    </div>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
<ng-container *ngIf="academicYear$ | async"></ng-container>
