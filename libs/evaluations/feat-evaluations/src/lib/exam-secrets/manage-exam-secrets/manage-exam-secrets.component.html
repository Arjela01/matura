<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <h2 class="flex-1 mb-0">Sekretimi</h2>
      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-left">
          <div class="my-2">
            <button
              pButton
              pRipple
              label="Shto"
              icon="pi pi-plus"
              class="p-button-success mr-2"
              (click)="onNewClick()"
              [label]="
                hideExamSecretForm === false ? 'Anullo' : 'Shto'
              "></button>
          </div>
        </div>
        <div class="p-toolbar-group-right">
          <p-fileUpload
            name="myfile[]"
            [multiple]="true"
            [customUpload]="true"
            chooseLabel="Zgjidh"
            [auto]="true"
            (uploadHandler)="onUpload($event)">
          </p-fileUpload>
          <button
            style="margin-left: 25px"
            pButton
            pRipple
            icon="pi pi-download"
            (click)="downloadFile()"></button>
        </div>
      </p-toolbar>
      <msh-exam-secret-grid
        [examSecrets]="(examSecrets$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamSecrets($event)">
      </msh-exam-secret-grid>
    </div>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
