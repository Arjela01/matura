<div class="flex center mb-2 page-header mb-header align-items-baseline">
  <h2 class="flex-1 mb-0">Sekretimi</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"
        [label]="hideExamSecretForm === false ? 'Anullo' : 'Shto'"></button>
    </div>
  </div>
  <div class="my-2">
    <button
      pRipple
      icon="pi pi-download"
      pButton
      label="Shkarko"
      (click)="downloadFile()"></button>
  </div>

  <p-fileUpload
    name="myfile[]"
    [multiple]="true"
    [customUpload]="true"
    chooseLabel="Zgjidh"
    [auto]="true"
    (uploadHandler)="onUpload($event)">
  </p-fileUpload>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-exam-secret-grid
        [examSecrets]="(examSecrets$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamSecrets($event)">
      </msh-exam-secret-grid>
    </div>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
