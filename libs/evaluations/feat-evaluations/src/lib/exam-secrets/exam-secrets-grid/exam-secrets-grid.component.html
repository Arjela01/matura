<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examSecrets"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamSecrets"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="studentName">
        Maturanti
        <div>
          <p-sortIcon field="studentName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="studentName"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examVersionName">
        Testi i Provimit
        <div>
          <p-sortIcon field="examVersionName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examVersionName"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="academicYear">
        Viti
        <div>
          <p-sortIcon field="academicYear"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="academicYear"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="barcode">
        Barkodi
        <div>
          <p-sortIcon field="barcode"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="barcode"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="isFall">
        Është Vjeshtë?
        <div>
          <p-sortIcon field="isFall"></p-sortIcon>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examSecret>
    <tr>
      <td style="width: 20%; min-width: 10rem">
        {{ examSecret.studentName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examSecret.examVersionName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examSecret.academicYear }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ examSecret.barcode }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ examSecret.isFall ? 'Po' : 'Jo' }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examSecret)"
            pTooltip="Ndrysho" />
          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examSecret)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
