<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="studentInputData">Maturanti *</label>
    <div>
      <div class="p-inputgroup">
        <button
          type="button"
          pButton
          (click)="onStudentShow()"
          icon="pi pi-search"
          label="Kërko"></button>
        <input
          type="text"
          pInputText
          id="studentInputData"
          name="studentInputData"
          disabled
          [(ngModel)]="studentInputData"
          required
          autofocus
          [ngClass]="{
            'ng-invalid ng-dirty': submitted && !examSecret.studentId
          }" />
      </div>
      <small class="p-error block" *ngIf="submitted && !examSecret.studentId">
        Maturanti është fushë e kërkuar.
      </small>
    </div>
  </div>
  <div class="field">
    <label for="ExamSubject">Lënda e Provimit *</label>
    <p-dropdown
      id="ExamSubject"
      [options]="examSubjects"
      optionValue="key"
      optionLabel="value"
      name="examSubjectId"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSecret.examSubjectId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecret.examSubjectId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examSecret.examSubjectId">
      Lënda e provimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="barcode">Barkodi *</label>
    <input
      type="text"
      pInputText
      id="barcode"
      name="barcode"
      maxlength="7"
      [(ngModel)]="examSecret.barcode"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecret.barcode
      }" />
    <small class="p-error block" *ngIf="submitted && !examSecret.barcode">
      Barkodi është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label class="mb-3">Është Vjeshtë? *</label>
    <div class="form grid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallTrue"
          name="IsFallTrue"
          [value]="true"
          [(ngModel)]="examSecret.isFall"></p-radioButton>
        <label for="IsFallTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallFalse"
          name="IsFall"
          [value]="false"
          [(ngModel)]="examSecret.isFall"></p-radioButton>
        <label for="IsFallFalse">Jo</label>
      </div>
    </div>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onExitForm()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
<p-dialog
  [(visible)]="showStudentModal"
  [style]="{ width: '1000px' }"
  header="Maturanti"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onStudentHide()">
  <ng-template pTemplate="content">
    <msh-shared-student-lookup
      [students]="(studentList$ | async) || []"
      [totalRecords]="totalRecords"
      (gridEvent)="onGridEvent($event)"
      (lazyLoadData)="getStudents($event)">
    </msh-shared-student-lookup>
  </ng-template>
</p-dialog>
