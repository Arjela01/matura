<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="studentInputData">Maturanti *</label>
    <div>
      <div class="p-inputgroup">
        <button
          *ngIf="!examSecret.id"
          type="button"
          pButton
          (click)="onStudentShow()"
          icon="pi pi-search"
          label="Kërko"></button>
        <input
          [disabled]="!!examSecret.id"
          type="text"
          pInputText
          id="studentInputData"
          name="studentInputData"
          [required]="true"
          [(ngModel)]="studentInputData"
          required
          autofocus
          [ngClass]="{
            'ng-invalid ng-dirty': submitted && !examSecret.studentId
          }" />
      </div>
      <small class="p-error block" *ngIf="submitted && !examSecret.studentId">
        Maturanti është fushë e kërkuar.
      </small>
    </div>
  </div>
  <div class="field">
    {{examSecret | json}}
    <label for="administrationOffice">Zvap *</label>
    <p-dropdown
      id="administrationOffice"
      [options]="administrationOffices"
      optionValue="key"
      optionLabel="value"
      name="administrationOffice"
      [filter]="true"
      [autoDisplayFirst]="false"
      (onChange)="onAdmOfficeChanged($event)"
      (onClear)="onAdmOfficeChanged($event)"
      [required]="true"
      [(ngModel)]="examSecret.administrationOfficeId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecret.administrationOfficeId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examSecret.administrationOfficeId">
      ZVAP është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="examSite">Qendra e Provimit *</label>
    <p-dropdown
      id="examSite"
      [options]="examSites"
      optionValue="key"
      optionLabel="value"
      name="examSite"
      [filter]="true"
      [autoDisplayFirst]="false"
      [required]="true"
      [(ngModel)]="examSecret.examSiteId"
      (onChange)="onExamSiteChanged($event)"
      (onClear)="onExamSiteChanged($event)"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecret.examSiteId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examSecret.examSiteId">
      Qendra është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ExamType">Tipi i Provimit *</label>
    <p-dropdown
      id="ExamType"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="ExamTypeId"
      [filter]="true"
      [autoDisplayFirst]="false"
      (onChange)="onExamTypeChanged($event)"
      (onClear)="onExamTypeChanged($event)"
      [required]="true"
      [(ngModel)]="examSecret.examTypeId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecret.examTypeId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examSecret.examTypeId">
      Tipi i provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="examDate">Data e Provimit *</label>
    <p-dropdown
      id="examDate"
      [options]="examDates"
      optionValue="key"
      optionLabel="value"
      name="examSite"
      [filter]="true"
      [autoDisplayFirst]="false"
      [required]="true"
      [(ngModel)]="examSecret.examDateId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecret.examDateId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examSecret.examDateId">
      Data është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ExamSubject">Lënda e Provimit *</label>
    <p-dropdown
      id="ExamSubject"
      [options]="examSubjects"
      optionValue="key"
      optionLabel="value"
      name="examSubjectId"
      [filter]="true"
      [autoDisplayFirst]="false"
      [required]="true"
      [(ngModel)]="examSecret.examSubjectId"
      [showClear]="true"
      appendTo="body"
      >
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examSecret.examSubjectId">
      Lënda e provimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="barcode">Barkodi *</label>
    <input
      type="text"
      pInputText
      id="barcode"
      name="barcode"
      pTooltip="Barkodi duhet të përmbaje 7 karaktere alfanumerike"
      maxlength="7"
      minlength="7"
      [(ngModel)]="examSecret.barcode"
      required
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecret.barcode
      }" />
    <small class="p-error block" *ngIf="submitted && !examSecret.barcode">
      Barkodi është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ExamSecretNote">Probleme me barkodin </label>
    <p-dropdown
      id="ExamSecretNote"
      [options]="examSecretNotes"
      optionValue="key"
      optionLabel="value"
      name="examSecretNote"
      [filter]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSecret.examSecretNoteId"
      [showClear]="true"
      appendTo="body">
    </p-dropdown>
  </div>
  <div class="field">
    <label class="mb-3">Është Vjeshtë? *</label>
    <div class="form grid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallTrue"
          name="IsFall"
          [value]="true"
          [(ngModel)]="examSecret.isFall"></p-radioButton>
        <label for="IsFallTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallFalse"
          name="IsFall"
          [value]="false"
          [(ngModel)]="examSecret.isFall"></p-radioButton>
        <label for="IsFallFalse">Jo</label>
      </div>
    </div>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onExitForm()"></button>
    <button type="submit" pButton label="Ruaj" class="p-button w-auto"></button>
  </div>
</form>
<p-dialog
  [(visible)]="showStudentModal"
  header="Maturanti"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onStudentHide()">
  <ng-template pTemplate="content">
    <msh-shared-student-lookup
      [students]="(studentList$ | async) || []"
      [totalRecords]="totalRecords"
      (gridEvent)="onGridEvent($event)"
      (lazyLoadData)="getStudents($event)">
    </msh-shared-student-lookup>
  </ng-template>
</p-dialog>
