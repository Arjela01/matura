<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card px-6 py-6">
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="AcademicYear">Viti Akademik *</label>
          <p-dropdown
            id="AcademicYear"
            [options]="academicYears"
            optionValue="key"
            optionLabel="value"
            name="academicYearId"
            [autoDisplayFirst]="false"
            [(ngModel)]="examSecret.academicYearId"
            [showClear]="true"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !examSecret.academicYearId
            }">
          </p-dropdown>
          <small
            class="p-error block"
            *ngIf="submitted && !examSecret.academicYearId">
            Viti Akademik është fushë e kërkuar.
          </small>
        </div>
        <button
          type="button"
          pButton
          (click)="onStudentShow()"
          icon="pi pi-search"
          label="Kerko Maturantin"
          class="p-button-text w-auto mb-3 mt-3 surface-500 text-white hover:surface-400"></button>
        <div class="field" [style]="{ width: '500px' }">
          <label for="studentInputData">Maturanti *</label>
          <input
            type="text"
            pInputText
            id="studentInputData"
            name="studentInputData"
            disabled
            [(ngModel)]="studentInputData"
            required
            autofocus
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !examSecret.studentId
            }" />
          <small
            class="p-error block"
            *ngIf="submitted && !examSecret.studentId">
            Maturanti është fushë e kërkuar.
          </small>
        </div>
        <div class="field">
          <label for="ExamVersion">Tezat e Provimit *</label>
          <p-dropdown
            id="ExamVersion"
            [options]="examVersions"
            optionValue="key"
            optionLabel="value"
            name="examVersionId"
            [autoDisplayFirst]="false"
            [(ngModel)]="examSecret.examVersionId"
            [showClear]="true"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !examSecret.examVersionId
            }">
          </p-dropdown>
          <small
            class="p-error block"
            *ngIf="submitted && !examSecret.examVersionId">
            Testi është fushë e kërkuar.
          </small>
        </div>

        <div class="field">
          <label for="barcode">Barkodi *</label>
          <input
            type="text"
            pInputText
            id="barcode"
            name="barcode"
            [(ngModel)]="examSecret.barcode"
            required
            autofocus
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !examSecret.barcode
            }" />
          <small class="p-error block" *ngIf="submitted && !examSecret.barcode">
            Barkodi është fushë e kërkuar.
          </small>
        </div>
        <div class="field">
          <label class="mb-3">Është vjeshtë? *</label>
          <div class="formgrid grid">
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="IsFallTrue"
                name="IsFallTrue"
                [value]="true"
                [(ngModel)]="examSecret.isFall"></p-radioButton>
              <label for="IsFallTrue">Po</label>
            </div>
            <div class="field-radiobutton col-6">
              <p-radioButton
                id="IsFallFalse"
                name="IsFall"
                [value]="false"
                [(ngModel)]="examSecret.isFall"></p-radioButton>
              <label for="IsFallFalse">Jo</label>
            </div>
          </div>
        </div>

        <div class="flex justify-content-end">
          <button
            type="button"
            pButton
            icon="pi pi-times"
            label="Anullo"
            class="p-button-text w-auto mr-2"
            (click)="onExitForm()"></button>
          <button
            type="submit"
            pButton
            icon="pi pi-check"
            label="Ruaj"
            class="p-button-text w-auto"></button>
        </div>
      </form>
    </div>
  </div>
</div>
<p-dialog
  [(visible)]="showStudentModal"
  [style]="{ width: '1000px' }"
  header="Maturanti"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onStudentHide()">
  <ng-template pTemplate="content">
    <msh-a1z-student-search
      [students]="(studentList$ | async) || []"
      [totalRecords]="totalRecords"
      (gridEvent)="onGridEvent($event)"
      (lazyLoadData)="getStudents($event)">
    </msh-a1z-student-search>
  </ng-template>
</p-dialog>
