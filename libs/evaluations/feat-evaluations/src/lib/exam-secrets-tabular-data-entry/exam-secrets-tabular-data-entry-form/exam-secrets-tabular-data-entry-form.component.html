<form
  class="flex flex-row align-items-center justify-content-start w-full"
  #form="ngForm"
  (ngSubmit)="onSubmit()">
  <div class="field mr-2 flex-column">
    <label class="block" for="AdministrationOffice">ZVAP *</label>
    <p-dropdown
      styleClass="w-10rem"
      id="AdministrationOffice"
      [options]="administrationOffices"
      optionValue="key"
      (ngModelChange)="onAdministrationOfficeChanged($event)"
      (onClear)="onAdministrationOfficeChanged(null)"
      optionLabel="value"
      name="administrationOfficeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSecretSearchModal.administrationOfficeId"
      [required]="true"
      [showClear]="true"
      appendTo="body">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examSecretSearchModal.administrationOfficeId">
      DAR/ZA është fushë e kërkuar.
    </small>
  </div>
  <div class="field mr-2 flex-column">
    <label class="block" for="ExamSite">Qendra e Provimit </label>
    <p-dropdown
      styleClass="w-15rem"
      id="ExamSite"
      [options]="examSites"
      optionValue="key"
      optionLabel="value"
      name="examSiteId"
      appendTo="body"
      [required]="true"
      (onChange)="onExamSiteChanged()"
      (onClear)="onExamSiteChanged()"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSecretSearchModal.examSiteId"
      [showClear]="true">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examSecretSearchModal.examSiteId">
      Qendra e Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field mr-2 flex-column">
    <label class="block" for="ExamType">Tipi i Provimit</label>
    <p-dropdown
      styleClass="w-10rem"
      id="ExamType"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      appendTo="body"
      [filter]="true"
      [required]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSecretSearchModal.examTypeId"
      [showClear]="true"
      (onChange)="onExamTypeChanged()"
      (onClear)="onExamTypeChanged()">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examSecretSearchModal.examTypeId">
      Qendra e Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field mr-2 flex-column">
    <label class="block" for="ExamDate"> Data e Provimit *</label>
    <p-dropdown
      styleClass="w-25rem"
      id="ExamDate"
      [options]="examDates"
      optionValue="key"
      optionLabel="value"
      name="ExamDate"
      appendTo="body"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSecretSearchModal.examDateId"
      [showClear]="true">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examSecretSearchModal.examDateId">
      Data e Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field mr-2 flex-column">
    <label class="block" for="ExamSubject">Lënda e Provimit *</label>
    <p-dropdown
      styleClass="w-25rem"
      id="ExamSubject"
      [options]="examSubjects"
      optionValue="key"
      optionLabel="value"
      name="examSubjectId"
      [autoDisplayFirst]="false"
      [required]="true"
      [(ngModel)]="examSecretSearchModal.examSubjectId"
      (onChange)="onSubmit()"
      [showClear]="true">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examSecretSearchModal.examSubjectId">
      Lënda e provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="text-center">
    <button pButton class="btn btn-primary mt-3" type="submit">Kërko</button>
  </div>
</form>
