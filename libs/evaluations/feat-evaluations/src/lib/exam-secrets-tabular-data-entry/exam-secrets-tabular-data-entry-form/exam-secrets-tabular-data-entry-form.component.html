<form class="dropdown-row" #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field colmn">
    <label for="AdministrationOffice">ZVAP *</label>
    <p-dropdown
      class="width"
      id="AdministrationOffice"
      [options]="administrationOffices"
      optionValue="key"
      (onChange)="onAdministrationOfficeChanged()"
      (onClear)="onAdministrationOfficeChanged()"
      optionLabel="value"
      name="administrationOfficeId"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSecretSearchModal.administrationOfficeId"
      [required]="true"
      [showClear]="true"
      appendTo="body"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecretSearchModal.administrationOfficeId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examSecretSearchModal.administrationOfficeId">
      DAR/ZA është fushë e kërkuar.
    </small>
  </div>
  <div class="field colmn">
    <label for="ExamSite">Qendra e Provimit </label>
    <p-dropdown
      class="width"
      id="ExamSite"
      [options]="examSites"
      optionValue="key"
      optionLabel="value"
      name="examSiteId"
      appendTo="body"
      [required]="true"
      (onChange)="onExamSiteChanged()"
      (onClear)="onExamSiteChanged()"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSecretSearchModal.examSiteId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecretSearchModal.examSiteId
      }">
    </p-dropdown>
  </div>
  <div class="field colmn">
    <label for="ExamType">Tipi i Provimit</label>
    <p-dropdown
      class="width"
      id="ExamType"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      appendTo="body"
      [filter]="true"
      [required]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examSecretSearchModal.examTypeId"
      [showClear]="true"
      (onChange)="onExamTypeChanged()"
      (onClear)="onExamTypeChanged()"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecretSearchModal.examTypeId
      }">
    </p-dropdown>

  </div>
 <div class="field colmn">
  <label for="ExamDate"> Data e Provimit *</label>
  <p-dropdown
    class="width"
    id="ExamDate"
    [options]="examDates"
    optionValue="key"
    optionLabel="value"
    name="ExamDate"
    appendTo="body"
    [autoDisplayFirst]="false"
    [(ngModel)]="examSecretSearchModal.examDateId"
    [showClear]="true"
    [ngClass]="{
              'ng-invalid ng-dirty': submitted && !examSecretSearchModal.examDateId
            }">
  </p-dropdown>
  <small class="p-error block" *ngIf="submitted && !examSecretSearchModal.examDateId">
    Data e Provimit është fushë e kërkuar.
  </small>
</div>
    <div class="field colmn">
      <label for="ExamSubject">Lënda e Provimit *</label>
      <p-dropdown
        class="width"
        id="ExamSubject"
        [options]="examSubjects"
        optionValue="key"
        optionLabel="value"
        name="examSubjectId"
        [autoDisplayFirst]="false"
        [required]="true"
        [(ngModel)]="examSecretSearchModal.examSubjectId"
        [showClear]="true"
        [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSecretSearchModal.examSubjectId
      }">
      </p-dropdown>
      <small class="p-error block" *ngIf="submitted && !examSecretSearchModal.examSubjectId">
        Lënda e provimit është fushë e kërkuar.
      </small>
    </div>
  <div class="field colmn">
    <label for="barcode">Ka barkod? </label>
    <p-dropdown
      class="width"
      id="barcode"
      [options]="hasBarcode"
      optionValue="key"
      optionLabel="value"
      name="hasBarcode"
      [autoDisplayFirst]="false"
      [required]="false"
      [(ngModel)]="examSecretSearchModal.hasBarcode"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !hasBarcode
      }">
    </p-dropdown>
  </div>
  <div class="field colmn">
    <label for="isFall">Është Vjeshtë?</label>
    <p-dropdown
      class="width"
      id="isFall"
      [options]="isFall"
      optionValue="key"
      optionLabel="value"
      name="isFall"
      [autoDisplayFirst]="false"
      [required]="false"
      [(ngModel)]="examSecretSearchModal.isFall"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !isFall
      }">
    </p-dropdown>
  </div>
  <div class="text-center">
    <button pButton class="btn btn-primary" type="submit" >Kërko</button>
  </div>
</form>
