<div>
  <h2 class="flex-1 mb-0">Hidh sekretimet sipas caktimeve në qendra provimi</h2>
  <div class="mt-4">
    <msh-exam-secrets-tabular-data-entry-form
      (applySearch)="onApplySearch($event)"
      (loadExamSites)="loadExamSites($event)"
      (loadExamTypes)="loadExamTypes($event)"
      (loadExamDates)="loadExamDates($event)"
      (loadExamSubjects)="loadExamSubjects($event)"
      [administrationOffices]="administrationOffices"
      [examSites]="examSites"
      [examTypes]="examTypes"
      [examDates]="examDates"
      [examSubjects]="examSubjects"></msh-exam-secrets-tabular-data-entry-form>
  </div>
  <div class="mt-4">
    <msh-exam-secrets-tabular-data-entry-list
      [dataEntryItemList]="(dataEntryItemList$ | async) || []"
      [totalRecords]="totalRecords"></msh-exam-secrets-tabular-data-entry-list>
  </div>
</div>
