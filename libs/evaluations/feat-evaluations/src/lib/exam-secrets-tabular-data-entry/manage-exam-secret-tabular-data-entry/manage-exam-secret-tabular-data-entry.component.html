<div>
  <h2 class="flex-1 mb-0">Hidh Sekretimet sipas Listës Emërore</h2>
  <div class="mt-4">
    <msh-exam-secrets-tabular-data-entry-form
      (applySearch)="onApplySearch($event)"
      (loadExamSites)="loadExamSites($event)"
      (loadExamTypes)="loadExamTypes($event)"
      (loadExamDates)="loadExamDates($event)"
      (loadExamSubjects)="loadExamSubjects($event)"
      [administrationOffices]="administrationOffices"
      [examSites]="examSites"
      [examTypes]="examTypes"
      [examDates]="examDates"
      [examSubjects]="examSubjects"></msh-exam-secrets-tabular-data-entry-form>
  </div>
  <div class="mt-4">
    <msh-exam-secrets-tabular-data-entry-list
      [subjectName]="subjectName"
      [examSecretNotes]="examSecretNotes"
      [examSecretSubject]="examSecretSubjects"
      [dataEntryItemList]="(dataEntryItemList$ | async) || []"
      [totalRecords]="totalRecords"
      (gridEvent)="onGridEvent($event)"
      (barcodeChange)="addOrUpdateExamSecret($event)"></msh-exam-secrets-tabular-data-entry-list>
  </div>
</div>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
