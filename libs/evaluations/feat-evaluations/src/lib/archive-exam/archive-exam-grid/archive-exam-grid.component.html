<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="archiveExams"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedArchiveExams"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="caption">
    <form #form="ngForm" (ngSubmit)="onSubmit()">
      <div class="flex flex-column mt-2 md:col-3 md:align-items-center">
        <div class="p-inputgroup">
          <button
            type="button"
            pButton
            pRipple
            icon="pi pi-database"
            disabled
            label="{{ totalRecords }}/50"
            class="p-button-info mr-2"></button>
          <input
            type="text"
            maxlength="7"
            minlength="7"
            pInputText
            placeholder="Barkodi"
            id="barcode"
            name="barcode"
            [(ngModel)]="archiveExam.barcode"
            pTooltip="Barkodi duhet te jete nje numer 7 shifror"
            onfocus="this.value=''"
            tooltipPosition="top"
            required />
          <button
            pButton
            pRipple
            icon="pi pi-save"
            type="button"
            [disabled]="!form.valid"
            label="Ruaj"
            class="p-button-success mr-2"
            (click)="SaveArchiveExam(archiveExam)"></button>
        </div>
      </div>
    </form>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="folder">
        Numri
        <p-sortIcon field="folder"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="folder"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="barcode">
        Barkodi
        <p-sortIcon field="barcode"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="barcode"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-archiveExam>
    <tr>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveExam.index }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveExam.barcode }}
      </td>

      <td>
        <div class="flex">
          <button
            pButton
            pRipple
            icon="pi pi-pencil"
            class="p-button-rounded p-button-warning p-button-text mr-2"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(archiveExam)"></button>
          <button
            pButton
            pRipple
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(archiveExam)"></button>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
