<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="flex flex-column mt-2 md:align-items-center" style="width: 300px">
    <div class="p-inputgroup">
      <button
        type="button"
        pButton
        pRipple
        icon="pi pi-database"
        disabled
        label="{{ totalRecords }}/50"
        style= "border-radius:0"
        class="p-button-info mr-2"></button>
      <input
        type="text"
        maxlength="7"
        minlength="7"
        pInputText
        placeholder="Barkodi"
        id="barcode"
        #barcodeField
        name="barcode"
        [(ngModel)]="archiveExam.barcode"
        pTooltip="Barkodi duhet të përmbaje 7 karaktere alfanumerike"
        onfocus="this.value=''"
        tooltipPosition="top"
        required
        (keyup.enter)="saveArchiveExam(archiveExam)"

      />
      <button
        pButton
        pRipple
        icon="pi pi-save"
        type="button"
        [disabled]="!lettersNumbersCheck(archiveExam.barcode)"
        label="Ruaj"
        class="p-button-success mr-2"
        style= "border-radius:0"
        (click)="saveArchiveExam(archiveExam)"></button>
    </div>
  </div>
</form>
<br>
<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="archiveExams"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedArchiveExams"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="folder">
        Numri
        <p-sortIcon field="folder"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="folder"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="barcode">
        Barkodi
        <p-sortIcon field="barcode"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="barcode"
          display="menu"  mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-archiveExam>
    <tr>
      <td style="width: 50%; min-width: 10rem">
        {{ archiveExam.index }}
      </td>
      <td style="width: 50%; min-width: 10rem">
        {{ archiveExam.barcode }}
      </td>
      <td style="width: 40%; min-width: 10rem">
        <img
          src="assets/svg/edit-form.svg"
          class="p-button-rounded p-button-warning p-button-text ml-m pointer"
          tooltipPosition="bottom"
          (click)="onEditClick(archiveExam)"
          pTooltip="Ndrysho" />

        <img
          src="assets/svg/delete-form.svg"
          class="p-button-rounded p-button-danger p-button-text ml-m pointer"
          pTooltip="Fshi"
          tooltipPosition="bottom"
          (click)="onDeleteClick(archiveExam)" />
      </td>
    </tr>
  </ng-template>
</p-table>
