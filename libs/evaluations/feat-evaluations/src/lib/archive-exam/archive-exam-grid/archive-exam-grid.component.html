<form #form="ngForm">
  <div class="flex flex-column mt-2 md:align-items-center" style="width: 300px">
    <div class="p-inputgroup">
      <button
        type="button"
        pButton
        pRipple
        icon="pi pi-database"
        disabled
        label="{{ totalRecords }}/50"
        style="border-radius: 0"
        class="p-button-info mr-2"></button>
      <input
        toUppercase
        type="text"
        maxlength="7"
        minlength="7"
        pInputText
        placeholder="Barkodi"
        id="barcode"
        autofocus
        [pattern]="barcodePattern"
        #barcodeField
        name="barcode"
        [(ngModel)]="archiveExam.barcode"
        onfocus="this.value=''"
        required
        (change)="saveArchiveExam(archiveExam)" />
    </div>
  </div>
</form>
<br />
<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="archiveExams"
  [totalRecords]="totalRecords"
  [rows]="1000"
  [rowHover]="true"
  [(selection)]="selectedArchiveExams"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="folder">
        Numri
        <p-sortIcon field="folder"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="folder"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="barcode">
        Barkodi
        <p-sortIcon field="barcode"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="barcode"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-archiveExam>
    <tr>
      <td style="width: 5%; min-width: 10rem">
        {{ archiveExam.index }}
      </td>
      <td>
        {{ archiveExam.barcode }}
      </td>
      <td style="width: 5%; min-width: 10rem">
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text ml-m pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(archiveExam)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(archiveExam)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
