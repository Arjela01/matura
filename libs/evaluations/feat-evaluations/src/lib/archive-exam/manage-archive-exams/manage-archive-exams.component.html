<div class="flex mb-2 page-header center mb-header">
  <h2 class="flex-1 mb-0">

    <h2 class="flex-1 mb-0">
      Dosja: {{ archiveFolder.nr }} | {{ archiveFolder.examTypeName }} :
      {{ archiveFolder.examSubjectName }}
    </h2>
  </h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <a [routerLink]="['/evaluations', 'archive-folder']">
        <button
          pButton
          label="Kthehu"
          icon="pi pi-arrow-left"
          class="p-button-danger mr-2"
          [ngStyle]="{ backgroundColor: 'var(--bluegray-600)' }"></button>
      </a>


      <button
        pButton
        [ngClass]="
            archiveFolder.isClosed === true
              ? ['bg-red-400', 'red-text', 'px-3', 'fb']
              : ['bg-green-400', 'green-text', 'px-3', 'fb']
          "
        icon="{{
              !archiveFolder.isClosed ? 'pi pi-lock-open' : 'pi pi-lock'
            }}"
        label=" {{ archiveFolder.isClosed === true ? 'Mbyllur' : 'Hapur' }}"
        (click)="changeFolderStatus()"> </button>
    </div>
  </div>
</div>

      <msh-archive-exam-grid
        [archiveExams]="(archiveExams$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getArchiveExams($event)"
        (formSave)="onFormSave($event)"
        [isBarcodeInputDisabled]="isBarcodeInputDisabled"
      >
      </msh-archive-exam-grid>


<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e Barkodit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-archive-exam-form
      [archiveExamDetails]="selectedArchiveExam"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-archive-exam-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
