<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-left">
          <h2 class="flex-1 mb-0" icon="pi pi-circle">Dosja: {{ dataload[0]?.archiveFolderNr }}  |  {{ dataload[0]?.examTypeName}} : {{ dataload[0]?.examSubjectName}}</h2>
        </div>
<!--        <div class="p-toolbar-group-left"><h2 class="flex-1 mb-0">{{ bar[0]?.examTypeName}} : {{ bar[0]?.examSubjectName}}</h2></div>-->

        <div class="p-toolbar-group-right">
          <a [routerLink]="['/evaluations', 'archive-folder']">
            <button
              pButton
              label="Kthehu"
              icon="pi pi-arrow-left"
              class="p-button-danger mr-2"
              [ngStyle]="{ backgroundColor: 'var(--bluegray-600)' }"></button>
          </a>

          <button
            pButton
            [ngStyle]="{
              'background-color': dataload[0]?.isFolderClosed
                ? '#c8e6c9'
                : '#feedaf',
              color: dataload[0]?.isFolderClosed ? '#256029' : '#8a5340'
            }"
            label="{{ dataload[0]?.isFolderClosed ? 'Hap Dosjen ' : 'Mbyll Dosjen' }}"
            icon="{{
              !dataload[0]?.isFolderClosed ? 'pi pi-folder-open' : 'pi pi-folder'
            }}"
            class="p-button-danger mr-2"
            (click)="changeFolderStatus()"></button>
        </div>

      </p-toolbar>
      <msh-archive-exam-grid
        [barCodes]="(barCodes$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getBarCodes($event)"
        (formSave)="onFormSave($event)">
      </msh-archive-exam-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e Barkodit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-archive-exam-form
      [barCodeDetails]="selectedBarCode"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-archive-exam-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
