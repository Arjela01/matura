<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="archiveFolders"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedAArchiveFolders"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="folder">
        Dosja
        <p-sortIcon field="folder"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="folder"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="number">
        Numri
        <p-sortIcon field="number"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="number"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="examType">
        Tipi i Provimit
        <p-sortIcon field="number"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examType"
          display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="barcode">
        Barkodi
        <p-sortIcon field="barcode"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="barcode"
          display="menu"></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-barcodeCorrection>
    <div *ngIf="barcodeCorrection.length === 0">
      Nuk ka asnjë të dhënë!
    </div>
    <tr>
      <td style="width: 50%; min-width: 10rem">
        {{ barcodeCorrection.nr }}
      </td>
      <td style="width: 50%; min-width: 10rem">
        {{ barcodeCorrection.totalArchiveExams }}
      </td>
      <td style="width: 50%; min-width: 10rem">
        {{ barcodeCorrection.examTypeName }}
      </td>
      <td style="width: 50%; min-width: 10rem">
        {{ barcodeCorrection.barcode }}
      </td>
      <td style="width: 40%; min-width: 10rem">
        <img
          src="assets/svg/edit-form.svg"
          class="p-button-rounded p-button-warning p-button-text ml-m pointer"
          tooltipPosition="bottom"
          (click)="onEditClick(barcodeCorrection)"
          pTooltip="Ndrysho" />

      </td>
    </tr>
  </ng-template>
</p-table>
