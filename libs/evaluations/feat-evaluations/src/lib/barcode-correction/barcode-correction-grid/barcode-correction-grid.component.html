<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="archiveFolders"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedArchiveFolders"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="archiveFolderNr">
        Dosja
        <div>
          <p-sortIcon field="archiveFolderNr"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="archiveFolderNr"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examTypeName">
        Tipi i Provimit
        <div>
          <p-sortIcon field="examTypeName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examTypeName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="createdByName">
        Operatori
        <div>
          <p-sortIcon field="createdByName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="createdByName"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="barcode">
        Barkodi
        <div>
          <p-sortIcon field="barcode"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="barcode"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="isFolderClosed">
        Statusi
        <div>
          <p-sortIcon field="isFolderClosed"></p-sortIcon>
          <p-columnFilter
            type="boolean"
            field="isFolderClosed"
            matchMode="equals"
            display="menu"
            mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-barcodeCorrection>
    <tr>
      <td style="width: 14%; min-width: 10rem">
        <a
          pTooltip="Shiko Dosjen"
          tooltipPosition="bottom"
          [routerLink]="[
            '/evaluations',
            'archive-view',
            barcodeCorrection.archiveFolderId
          ]">
          {{ this.barcodeCorrection.archiveFolderNr }}
        </a>
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ barcodeCorrection.examTypeName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ barcodeCorrection.createdByName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ barcodeCorrection.barcode }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        <span
          [ngClass]="
            barcodeCorrection.isFolderClosed === true
              ? ['bg-red-300', 'red-text', 'px-3', 'py-1', 'fb']
              : ['bg-green-300', 'green-text', 'px-3', 'py-1', 'fb']
          ">
          {{ barcodeCorrection.isFolderClosed === true ? 'Mbyllur' : 'Hapur' }}
        </span>
      </td>
      <td style="width: 10%; min-width: 10rem">
        <div class="flex justify-content-center">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-danger p-button-text pointer"
            pTooltip="Ndrysho"
            tooltipPosition="bottom"
            (click)="onEditClick(barcodeCorrection)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
