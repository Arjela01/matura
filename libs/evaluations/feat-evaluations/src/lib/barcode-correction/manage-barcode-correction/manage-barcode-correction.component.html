<div class="flex mb-2 page-header center mb-header">
  <h2 class="flex-1 mb-0">Korigjim Barkodi</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Kërko Barkodin"
        icon="pi pi-search"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
  </div>
</div>


<msh-barcode-correction-grid
  [archiveExams]="(archiveExams$ | async) || []"
  [totalRecords]="totalRecords"
  (gridEvent)="onGridEvent($event)"
  (lazyLoadData)="getArchiveExams($event)"
  (formSave)="onFormSave($event)">
</msh-barcode-correction-grid>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Kërko Barkodin"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-barcode-correction-form
      [archiveExamDetails]="selectedArchiveExam"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-barcode-correction-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
