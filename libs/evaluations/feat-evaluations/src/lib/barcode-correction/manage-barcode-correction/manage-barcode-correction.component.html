<div class="flex mb-2 page-header center mb-header">
  <h2 class="mb-2 mt-3">Korigjim Barkodi</h2>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-barcode-correction-grid
        [archiveFolders]="(archiveFolders$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getArchiveFolders($event)">
      </msh-barcode-correction-grid>
    </div>
  </div>
</div>
<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Korigjo Barkodin"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-barcode-correction-form
      [archiveExamDetails]="selectedArchiveExam"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-barcode-correction-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
