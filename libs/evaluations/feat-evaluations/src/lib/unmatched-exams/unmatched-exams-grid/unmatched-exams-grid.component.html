<div class="flex ml-2 mb-2 page-header mb-header">
  <h2 class="flex-1">Pikë pa Sekretim</h2>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <p-table
        #dt
        dataKey="id"
        responsiveLayout="scroll"
        [value]="(unmatchedExams$ | async) || []"
        [totalRecords]="totalRecords"
        [rows]="100"
        [paginator]="true"
        [rowsPerPageOptions]="[100, 200, 300]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
        [rowHover]="true"
        selectionMode="multiple"
        (onLazyLoad)="unmatchedExamScore($event)"
        [lazy]="true">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="examTypeName">
              Tipi
              <div>
                <p-sortIcon field="examTypeName"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="examTypeName"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="examSubjectName">
              Lënda
              <div>
                <p-sortIcon field="examSubjectName"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="examSubjectName"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="barcode">
              Barkodi
              <div>
                <p-sortIcon field="barcode"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="barcode"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="writingScore">
              Pikët me shtjellim
              <div>
                <p-sortIcon field="writingScore"></p-sortIcon>
                <p-columnFilter
                  type="number"
                  field="writingScore"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="multipleChoiceScore">
              Pikët me aternativa
              <div>
                <p-sortIcon field="multipleChoiceScore"></p-sortIcon>
                <p-columnFilter
                  type="number"
                  field="multipleChoiceScore"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-examScore>
          <tr>
            <td style="width: 10%; min-width: 10rem">
              {{ examScore.examTypeName }}
            </td>
            <td style="width: 25%; min-width: 10rem">
              {{ examScore.examSubjectName }}
            </td>
            <td style="width: 10%; min-width: 10rem">
              {{ examScore.barcode }}
            </td>
            <td style="width: 14%; min-width: 10rem">
              {{ examScore.writingScore }}
            </td>
            <td>
              {{ examScore.multipleChoiceScore }}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
