<div class="flex ml-2 mb-5 page-header mb-header">
  <h2 class="flex-1 mb-0">Pikë pa Sekretim - Përpara Lidhjes</h2>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <p-table
        #dt
        dataKey="id"
        responsiveLayout="scroll"
        [scrollable]="true"
        scrollHeight="820px"
        [value]="(unmatchedExams$ | async) || []"
        [totalRecords]="totalRecords"
        [rows]="100"
        [paginator]="true"
        [rowsPerPageOptions]="[100, 200, 300]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
        [rowHover]="true"
        selectionMode="multiple"
        (onLazyLoad)="unmatchedExamScore($event)"
        [lazy]="true">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="examTypeName">
              Tipi
              <div>
                <p-sortIcon field="examTypeName"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="examTypeName"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="examSubjectName">
              Lënda
              <div>
                <p-sortIcon field="examSubjectName"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="examSubjectName"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="folderNr">
              Dosja
              <div>
                <p-sortIcon field="folderNr"></p-sortIcon>
                <p-columnFilter
                  type="numeric"
                  field="folderNr"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="barcode">
              Barkodi
              <div>
                <p-sortIcon field="barcode"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="barcode"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="index">
              Indeksi
              <div>
                <p-sortIcon field="index"></p-sortIcon>
                <p-columnFilter
                  type="numeric"
                  field="index"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="totalScore">
              Pikët Totale
              <div>
                <p-sortIcon field="totalScore"></p-sortIcon>
                <p-columnFilter
                  type="numeric"
                  field="totalScore"
                  display="menu"
                  mshColumnFilterDirective></p-columnFilter>
              </div>
            </th>
            <th pSortableColumn="isFall">
              Vjeshtë
              <div>
                <p-sortIcon field="isFall"></p-sortIcon>
                <p-columnFilter
                  type="boolean"
                  matchMode="equals"
                  field="isFall"
                  display="menu"></p-columnFilter>
              </div>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-examScore>
          <tr>
            <td style="width: 15%; min-width: 10rem">
              {{ examScore.examTypeName }}
            </td>
            <td style="width: 15%; min-width: 10rem">
              {{ examScore.examSubjectName }}
            </td>
            <td style="width: 15%; min-width: 10rem">
              {{ examScore.folderNr }}
            </td>
            <td style="width: 15%; min-width: 10rem">
              {{ examScore.barcode }}
            </td>
            <td style="width: 15%; min-width: 10rem">
              {{ examScore.index }}
            </td>
            <td style="width: 20%; min-width: 10rem">
              {{ examScore.totalScore }}
            </td>
            <td style="width: 20%; min-width: 10rem">
              {{ examScore.isFall | app_bool }}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
<ng-container *ngIf="academicYear$ | async"></ng-container>
