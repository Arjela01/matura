<div
  class="flex mb-2 page-header center justify-content-between mb-header align-items-top">
  <div>
    <h2 class="mb-0">Lidh Sekretim</h2>
    <div class="mt-4">
      <span>Emri i procesit:</span>
      {{ appProcessType }}
    </div>
    <div style="margin: 10px 0 19px 0">
      <span>Statusi:</span>
      {{ executionLog }}
    </div>
    <h4>Procesi i fundit i ekzekutuar</h4>
  </div>
  <div class="flex justify-content-end">
    <div class="my-2 flex align-items-center">
      <div class="field flex-column mr-7 mb-(-4)">
        <label class="block" for="examType">Tipi i Provimit </label>
        <p-dropdown
          styleClass="w-10rem"
          id="examType"
          [options]="examTypes"
          optionValue="key"
          optionLabel="value"
          name="examType"
          appendTo="body"
          [autoDisplayFirst]="false"
          [showClear]="true"
          (onChange)="onExamTypeSelect($event)"
          (onClear)="onExamTypeSelect($event)">
        </p-dropdown>
      </div>
      <div class="actions">
        <button class="mt-2" pButton type="button" (click)="postProcess()">
          Fillo procesin
        </button>
      </div>
    </div>
  </div>
</div>

<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-grid
        [gridData]="(calculateGrade$ | async) || []"
        [columns]="columns"
        (dataEmitted)="getProcessData($event, processType)"></msh-grid>
    </div>
  </div>
</div>
