<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="ExamType">Tipi i Provimit *</label>
    <p-dropdown
      id="ExamType"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      [disabled]="!!examScore.id"
      (onChange)="onExamTypeChanged($event)"
      (onClear)="onExamTypeChanged($event)"
      [autoDisplayFirst]="false"
      [(ngModel)]="examScore.examTypeId"
      [showClear]="true"
      [required]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examTypeId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examTypeId">
      Tipi i provimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="ExamSubject">Lënda e Provimit *</label>
    <p-dropdown
      id="ExamSubject"
      [options]="examSubjects"
      optionValue="key"
      optionLabel="value"
      name="examSubjectId"
      [disabled]="!!examScore.id"
      (onChange)="onExamSubjectChanged($event)"
      (onClear)="onExamSubjectChanged($event)"
      [autoDisplayFirst]="false"
      [required]="true"
      [(ngModel)]="examScore.examSubjectId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examSubjectId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examSubjectId">
      Lënda e provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="barcode">Barkodi *</label>
    <div class="field barcode">
      <input
        type="text"
        pInputText
        id="barcode"
        name="barcode"
        pTooltip="Barkodi duhet të përmbaje 7 karaktere alfanumerike"
        maxlength="7"
        minlength="7"
        [(ngModel)]="examScore.barcode"
        required
        autofocus
        (change)="onGetIndexClick(examScore.barcode)"
        [ngClass]="{
            'ng-invalid ng-dirty': submitted && (!examScore.barcode || !barcodeExists)
        }" />
    </div>
    <small class="p-error block" *ngIf="submitted && !examScore.barcode">
      Barkodi është fushë e kërkuar.
    </small>
  </div>
  <div class="field" *ngIf="examScore.archiveFolderNr">
    <div class="archiveFolderNr">
      <label for="archiveFolderNr">Dosja</label>
      <input
        type="text"
        pInputText
        id="archiveFolderNr"
        name="archiveFolderNr"
        disabled
        [(ngModel)]="examScore.archiveFolderNr"
        readonly
        autofocus />
    </div>
  </div>
  <div class="field" *ngIf="examScore.archiveFolderIndex">
    <div class="archiveExamIndex">
      <label for="archiveExamIndex">Index</label>
      <input
        type="text"
        pInputText
        id="archiveExamIndex"
        name="archiveExamIndex"
        disabled
        [(ngModel)]="examScore.archiveFolderIndex"
        readonly
        autofocus />
    </div>
  </div>

  <div class="field">
    <label for="WritingScore">Pikët Totale *</label>
    <input
      type="number"
      pInputText
      id="WritingScore"
      name="WritingScore"
      [(ngModel)]="examScore.writingScore"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examScore.writingScore
      }" />
    <small class="p-error block" *ngIf="submitted && !examScore.writingScore">
      Pikët me shtjellim janë fushë e kërkuar.
    </small>
  </div>

  <div class="field" [hidden]="true">
    <label for="MultipleChoiceScore">Pikët me alternativa *</label>
    <input
      type="number"
      pInputText
      id="MultipleChoiceScore"
      name="MultipleChoiceScore"
      [(ngModel)]="examScore.multipleChoiceScore"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examScore.multipleChoiceScore
      }" />
  </div>

  <div class="field">
    <label class="mb-3">Është Vjeshtë? *</label>
    <div class="form grid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallTrue"
          name="IsFallTrue"
          [value]="true"
          [(ngModel)]="examScore.isFall"></p-radioButton>
        <label for="IsFallTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallFalse"
          name="IsFall"
          [value]="false"
          [(ngModel)]="examScore.isFall"></p-radioButton>
        <label for="IsFallFalse">Jo</label>
      </div>
    </div>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid || !barcodeExists"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
