<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="StudentId">Studenti *</label>
    <p-autoComplete
      id="StudentId"
      [suggestions]="students"
      name="StudentId"
      [dropdown]="true"
      [(ngModel)]="examScore.studentId"
      [showClear]="true"
      (completeMethod)="search($event)"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examScore.studentId
      }">
    </p-autoComplete>
    <small
      class="p-error block"
      *ngIf="submitted && !examScore.studentId">
     Studentët janë fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="Barcode">Barkodi *</label>
    <input
      type="text"
      pInputText
      id="Barcode"
      name="Barcode"
      [(ngModel)]="examScore.barcode"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examScore.barcode }"
    />
    <small class="p-error block" *ngIf="submitted && !examScore.barcode">
      Barkodi është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="ExamSubjectCode">Kodi i lëndës së Provimit *</label>
    <input
      type="number"
      pInputText
      id="ExamSubjectCode"
      name="ExamSubjectCode"
      [(ngModel)]="examScore.examSubjectCode"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examScore.examSubjectCode }"
    />
    <small class="p-error block" *ngIf="submitted && !examScore.examSubjectCode">
      Kodi i lëndës së provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="AcademicYear">Viti Akademik *</label>
    <p-dropdown
      id="AcademicYear"
      [options]="academicYears"
      optionValue="id"
      optionLabel="value"
      name="academicYearId"
      (change)="onSelected()"
      [autoDisplayFirst]="false"
      [(ngModel)]="examScore.academicYearId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examScore.academicYearId
      }">
    </p-dropdown>
<!--    <small-->
<!--      class="p-error block"-->
<!--      *ngIf="submitted && selectedYear !== currentYear.toString()">-->
<!--      {{selectedYear | json}}-->
<!--      Viti akademik duhet të jetë i njëjtë me vitin aktual.-->
<!--    </small>-->
    <small
      class="p-error block"
      *ngIf="submitted && !examScore.academicYearId">
      Viti akademik është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label class="mb-3">Është Vjeshtë? *</label>
    <div class="formgrid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallTrue"
          name="IsFall"
          [value]="true"
          [(ngModel)]="examScore.isFall"></p-radioButton>
        <label for="IsFallTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallFalse"
          name="IsPublic"
          [value]="false"
          [(ngModel)]="examScore.isFall"></p-radioButton>
        <label for="IsFallFalse">Jo</label>
      </div>
    </div>
  </div>
  <div class="field">
    <label for="WritingScore">Pikët me shtjellim *</label>
    <input
      type="number"
      pInputText
      id="WritingScore"
      name="WritingScore"
      [(ngModel)]="examScore.writingScore"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examScore.writingScore }"
    />
    <small class="p-error block" *ngIf="submitted && !examScore.writingScore">
      Pikët me shtjellim janë fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="MultipleChoiceScore">Pikët me alternativa *</label>
    <input
      type="number"
      pInputText
      id="MultipleChoiceScore"
      name="MultipleChoiceScore"
      [(ngModel)]="examScore.multipleChoiceScore"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examScore.multipleChoiceScore }"
    />
    <small class="p-error block" *ngIf="submitted && !examScore.multipleChoiceScore">
      Pikët me alternativa është fushë e kërkuar.
    </small>
  </div>
  <div class="field">
    <label for="DocumentName">Emri i dokumentit *</label>
    <input
      type="text"
      pInputText
      id="DocumentName"
      name="DocumentName"
      [(ngModel)]="examScore.documentName"
      required
      autofocus
      [ngClass]="{ 'ng-invalid ng-dirty': submitted && !examScore.documentName }"/>
    <small class="p-error block" *ngIf="submitted && !examScore.documentName">
      Emri i dokumentit është fushë e kërkuar.
    </small>
  </div>


  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      icon="pi pi-check"
      label="Ruaj"
      class="p-button-text w-auto"></button>
  </div>
</form>
