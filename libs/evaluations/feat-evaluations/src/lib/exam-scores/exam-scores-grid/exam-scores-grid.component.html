<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="examScores"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedExamScores"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="academicYear">
        Viti
        <div>
          <p-sortIcon field="academicYear"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="academicYear"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examTypeName">
        Tipi i Provimit
        <div>
          <p-sortIcon field="examTypeName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examTypeName"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examVersionName">
        Testi i Provimit
        <div>
          <p-sortIcon field="examVersionName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examVersionName"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="barcode">
        Barkodi
        <div>
          <p-sortIcon field="barcode"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="barcode"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="writingScore">
        Pikët me shtjellim
        <div>
          <p-sortIcon field="writingScore"></p-sortIcon>
          <p-columnFilter
            type="number"
            field="writingScore"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="multipleChoiceScore">
        Pikët me aternativa
        <div>
          <p-sortIcon field="multipleChoiceScore"></p-sortIcon>
          <p-columnFilter
            type="number"
            field="multipleChoiceScore"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examScore>
    <tr>
      <td style="width: 20%; min-width: 10rem">
        {{ examScore.academicYear }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examScore.examTypeName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examScore.examVersionName }}
      </td>
      <td style="width: 20%; min-width: 10rem">
        {{ examScore.barcode }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ examScore.writingScore }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ examScore.multipleChoiceScore }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examScore)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examScore)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
