<div class="flex center mb-2 page-header mb-header align-items-baseline">
  <h2 class="flex-1 mb-0">Pikë Provimi</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pButton
        pRipple
        label="Shto"
        icon="pi pi-plus"
        class="p-button-success mr-2"
        (click)="onNewClick()"></button>
    </div>
    <div class="my-2">
      <button
        pButton
        pRipple
        icon="pi pi-download"
        label="Shkarko"
        (click)="downloadFile()"></button>
    </div>
    <p-fileUpload
      name="myfile[]"
      [multiple]="true"
      [customUpload]="true"
      chooseLabel="Ngarko"
      [auto]="true"
      accept=".xlsm,.xlsx,application/msexcel"
      (uploadHandler)="onUpload($event)">
    </p-fileUpload>
  </div>
</div>

<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-exam-score-grid
        [examScores]="(examScores$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamScores($event)">
      </msh-exam-score-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Pikë Provimi"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-exam-score-form
      [examScoreDetails]="selectedExamScore"
      [examTypes]="examTypes"
      [examSubjects]="examSubjects"
      (examTypeChanged)="onExamTypeChanged($event)"
      (examSubjectChanged)="onExamSubjectChanged($event)"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-exam-score-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
