<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <h2>Pikë Provimi</h2>
      <p-toolbar styleClass="mb-4">
        <div class="p-toolbar-group-left">
          <div class="my-2">
            <button
              pButton
              pRipple
              label="Shto"
              icon="pi pi-plus"
              class="p-button-success mr-2"
              (click)="onNewClick()"></button>
          </div>
        </div>
        <div class="p-toolbar-group-right">
          <p-fileUpload
            name="myfile[]"
            [multiple]="true"
            [customUpload]="true"
            chooseLabel="Zgjidh"
            [auto]="true"
            (uploadHandler)="onUpload($event)">
          </p-fileUpload>
        </div>
      </p-toolbar>
      <msh-exam-score-grid
        [examScores]="(examScores$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamScores($event)">
      </msh-exam-score-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Pikë Provimi"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-exam-score-form
      [examScoreDetails]="selectedExamScore"
      [academicYears]="academicYears"
      [examTypes]="examTypes"
      [examSubjects]="examSubjects"
      [examVersions]="examVersions"
      (examTypeChanged)="onExamTypeChanged($event)"
      (examSubjectChanged)="onExamSubjectChanged($event)"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-exam-score-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button-text"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
