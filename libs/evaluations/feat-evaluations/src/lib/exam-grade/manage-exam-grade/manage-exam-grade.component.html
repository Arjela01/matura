<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Notat</h2>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-exam-grade-grid
        [examGrades]="(examGrades$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getGrade($event)">
      </msh-exam-grade-grid>
    </div>
  </div>
</div>
<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '90%' }"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-manage-exam-grade-changes [examGradeId]="examGradeId">
    </msh-manage-exam-grade-changes>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>

<ng-container *ngIf="academicYear$ | async"></ng-container>
