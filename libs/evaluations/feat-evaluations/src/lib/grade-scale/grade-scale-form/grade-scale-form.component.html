<div class="card m-3 md:mx-auto sm:mx-0 md:w-8 sm:w-12 ">
    <h4 class="card-header">Shkallezimet e notave per lëndën</h4>
    <div class="card-body mt-5">
        <form [formGroup]="gradesForm">
            <div formArrayName="gradeDetails">
                <p-table [value]="gradeDetails.controls">
                    <ng-template pTemplate="header">
                        <tr>
                            <th style="width: 25%">Pikët</th>
                            <th style="width: 25%">Nota</th>
                            <th style="width: 50%"></th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-controls let-i="rowIndex">
                        <tr [formGroupName]="i">

                            <td>
                                <div class="field"><input type="number" class="w-10" pInputText
                                        formControlName="score" />
                                </div>
                            </td>
                            <td>
                                <div class="field"> <input type="number" class="w-10" pInputText
                                        formControlName="grade" />
                                </div>
                            </td>
                            <td>
                                <div class="flex justify-content-end">
                                    <button pButton pRipple icon="pi pi-pencil"
                                        class="p-button-rounded p-button-warning p-button-text mr-2" pTooltip="Edit"
                                        tooltipPosition="bottom"></button>
                                    <button pButton pRipple icon="pi pi-trash"
                                        class="p-button-rounded p-button-danger p-button-text" pTooltip="Delete"
                                        tooltipPosition="bottom"></button>
                                </div>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </form>

    </div>
</div>
