<form #form="ngForm" class="flex flex-column h-full">
    <div class="field">
        <label for="examSubjects">Lënda</label>
        <p-dropdown id="examSubjects" [options]="examSubjectsDropdown" appendTo="body" optionValue="key" [filter]="true"
            optionLabel="value" name="examSubjectId" [autoDisplayFirst]="false" [(ngModel)]="gradeScale.examSubjectId"
            [showClear]="true" [ngClass]="{
                'ng-invalid ng-dirty': submitted && !gradeScale.examSubjectId
              }">
        </p-dropdown>
        <small class="p-error block" *ngIf="submitted && !gradeScale.examSubjectId">
            Lënda është fushë e kërkuar.
        </small>
    </div>
    <div class="flex justify-content-end mt-auto">
        <p-fileUpload name="myfile[]" [customUpload]="true" accept=".xlsm,.xlsx,application/msexcel"
            chooseLabel="Zgjidh" cancelLabel="Anullo" uploadLabel="Ngarko" (uploadHandler)="onSubmit($event)">
        </p-fileUpload>

    </div>
</form>
