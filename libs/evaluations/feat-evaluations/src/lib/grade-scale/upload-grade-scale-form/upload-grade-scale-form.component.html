<form #form="ngForm" (ngSubmit)="onSubmit()" class="flex flex-column h-full">
  <div class="field">
    <label for="examSubjects">Lënda</label>
    <p-dropdown
      id="examSubjects"
      [options]="examSubjectsDropdown"
      appendTo="body"
      optionValue="key"
      [filter]="true"
      optionLabel="value"
      name="examSubjectId"
      [autoDisplayFirst]="false"
      [(ngModel)]="gradeScale.examSubjectId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !gradeScale.examSubjectId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !gradeScale.examSubjectId">
      Lënda është fushë e kërkuar.
    </small>
  </div>
  <div class="field mt-4 mb-4">
    <label>Importo Dokument *</label>
    <p-fileUpload
      name="myfile[]"
      [multiple]="true"
      [auto]="true"
      [customUpload]="true"
      accept=".xlsm,.xlsx,application/msexcel"
      chooseLabel="Zgjidh"
      (uploadHandler)="onUpload($event)">
    </p-fileUpload>
  </div>
  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ngarko"
      class="p-button w-auto"></button>
  </div>
</form>
