<form #form="ngForm" (ngSubmit)="onSubmit()">
    <div class="field">
        <label for="examSubject">Lënda</label>
        <p-dropdown id="examSubject" [options]="examSubjects" optionValue="key" [filter]="true" optionLabel="value"
            name="examSubject" [autoDisplayFirst]="false" [(ngModel)]="gradeScale.examSubjectId" [showClear]="true">
        </p-dropdown>
    </div>


    <div class="flex justify-content-end">
        <button type="button" pButton icon="pi pi-times" label="Anullo" class="p-button-text w-auto mr-2"
            (click)="onCancelClick()"></button>
        <p-fileUpload name="myfile[]" [customUpload]="true" chooseLabel="Zgjidh" cancelLabel="Anullo"
            uploadLabel="Ngarko" (uploadHandler)="onSubmit($event)">
        </p-fileUpload>
    </div>
</form>
