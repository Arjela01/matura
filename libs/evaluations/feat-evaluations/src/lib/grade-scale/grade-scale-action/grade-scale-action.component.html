<div class="flex center mb-2 page-header mb-header align-items-baseline">
  <h4 class="flex-1 mb-0">
    Shkallëzimet e notave per lëndën {{ examSubject | async }}
  </h4>
</div>

<div class="flex justify-content-between my-3">
  <button type="button" pButton icon="pi pi-arrow-left" label="Kthehu" class="w-auto mr-2"
    style="background: #eff1f5; color: #155eef" (click)="onExitForm()"></button>
  <button pButton pRipple label="Shto" icon="pi pi-plus" class="p-button-success" (click)="onNewClick()"></button>
</div>

<div class="grid">
  <div class="col-12">
    <div class="card">
      <p-table #dt dataKey="id" class="mt-6" [value]="gradeScales | async" styleClass="p-datatable-gridlines">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 25%">Pikët</th>
            <th style="width: 25%">Nota</th>
            <th style="width: 50%">Veprime</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-gradeScale>
          <tr>
            <td style="width: 35%; min-width: 10rem">
              {{ gradeScale.score }}
            </td>
            <td style="width: 35%; min-width: 10rem">
              {{ gradeScale.grade }}
            </td>
            <td>
              <div class="flex">
                <img src="assets/svg/edit-form.svg" class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
                  tooltipPosition="bottom" (click)="onEditClick(gradeScale)" pTooltip="Ndrysho" />

                <img src="assets/svg/delete-form.svg"
                  class="p-button-rounded p-button-danger p-button-text ml-m pointer" pTooltip="Fshi"
                  tooltipPosition="bottom" (click)="onDeleteClick(gradeScale)" />
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
<p-dialog [(visible)]="displayModal" [style]="{ width: '500px' }" header="Detajet" [modal]="true" [draggable]="false"
  [resizable]="false" class="p-fluid" (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-grade-form [gradesDetails]="selectedGradeScale" (formClose)="onModalClose()" (formSave)="onFormSave($event)">
    </msh-grade-form>
  </ng-template>
</p-dialog>

<p-confirmDialog #cd header="Konfirmo" icon="pi pi-exclamation-triangle" [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button type="button" pButton icon="pi pi-times" label="Jo" class="p-button-text" (click)="cd.reject()"></button>
    <button type="button" pButton icon="pi pi-check" label="Po" class="p-button border" (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
