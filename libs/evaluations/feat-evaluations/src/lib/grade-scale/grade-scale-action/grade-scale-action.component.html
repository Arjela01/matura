<div class="card m-3 md:mx-auto sm:mx-0 md:w-8 sm:w-12 rounded-0">
    <h4 class="card-header mb-4">Shkallezimet e notave per lëndën
        {{(examSubject|async)}}</h4>
    <div class="flex justify-content-end">
        <div class="my-2">
            <button pButton pRipple label="Shto" icon="pi pi-plus" class="p-button-success mr-2"
                (click)="onNewClick()"></button>
        </div>
    </div>
    <div class="card-body mt-5">
        <p-table #dt dataKey="id" class="mt-6" [value]="gradeScales|async" styleClass="p-datatable-gridlines">
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 25%">Pikët</th>
                    <th style="width: 25%">Nota</th>
                    <th style="width: 50%">Veprime</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-gradeScale>
                <tr>
                    <td style="width: 35%; min-width: 10rem">
                        {{ gradeScale.score }}
                    </td>
                    <td style="width: 35%; min-width: 10rem;">
                        {{ gradeScale.grade }}
                    </td>
                    <td>
                        <div class="flex">
                            <button pButton pRipple icon="pi pi-pencil"
                                class="p-button-rounded p-button-warning p-button-text mr-2" pTooltip="Modifiko"
                                tooltipPosition="bottom" (click)="onEditClick(gradeScale)"></button>
                            <button pButton pRipple icon="pi pi-trash"
                                class="p-button-rounded p-button-danger p-button-text" pTooltip="Fshij"
                                tooltipPosition="bottom" (click)="onDeleteClick(gradeScale)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>


    </div>
    <div class="flex justify-content-end w-full mt-5">
        <button type="button" pButton icon="pi pi-times" label="Anullo" class="p-button-text w-auto mr-2"
            (click)="onExitForm()"></button>
    </div>
</div>
<p-dialog [(visible)]="displayModal" [style]="{ width: '500px' }" header="Detajet e rolit" [modal]="true"
    [draggable]="false" [resizable]="false" class="p-fluid" (onHide)="onModalClose()">
    <ng-template pTemplate="content">
        <msh-grade-form [gradesDetails]="selectedGradeScale" (formClose)="onModalClose()"
            (formSave)="onFormSave($event)">
        </msh-grade-form>
    </ng-template>
</p-dialog>

<p-confirmDialog #cd header="Konfirmo" icon="pi pi-exclamation-triangle" [style]="{ width: '450px' }">
    <ng-template pTemplate="footer">
        <button type="button" pButton icon="pi pi-times" label="Jo" class="p-button-text"
            (click)="cd.reject()"></button>
        <button type="button" pButton icon="pi pi-check" label="Po" class="p-button-text"
            (click)="cd.accept()"></button>
    </ng-template>
</p-confirmDialog>
