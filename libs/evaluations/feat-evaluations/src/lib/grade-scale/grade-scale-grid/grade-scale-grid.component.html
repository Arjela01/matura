<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="gradeScales"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqur {first} deri {last} nga {totalStudentRecords} rekorde"
  [rowHover]="true"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="examTypeName">
        Tipi i lëndës
        <div>
          <p-sortIcon field="examTypeName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examTypeName"
            display="menu" mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="name">
        Lënda
        <div>
          <p-sortIcon field="name"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="name"
            display="menu" mshColumnFilterDirective></p-columnFilter>
        </div>
      </th>

      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examSecret>
    <tr>
      <td style="width: 45%; min-width: 10rem">
        {{ examSecret.examTypeName }}
      </td>
      <td style="width: 45%; min-width: 10rem">
        {{ examSecret.name }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/details.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examSecret)"
            pTooltip="Shiko Detajet" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
