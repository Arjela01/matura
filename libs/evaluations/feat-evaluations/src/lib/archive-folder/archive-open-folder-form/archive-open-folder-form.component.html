<form #form="ngForm" (ngSubmit)="onOpen()">
  <div class="field">
    <label for="examTypes">Tipet e Provimeve *</label>
    <p-dropdown
      id="examTypes"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypes"
      appendTo="body"
      [filter]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="archiveFolder.examTypeId"
      [showClear]="true"
      (onChange)="onExamTypeChanged($event)"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !archiveFolder.examTypeId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !archiveFolder.examTypeId">
      Tipet e provimeve është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="examSubject">LLoji i Provimeve *</label>
    <p-dropdown
      id="examSubject"
      [options]="examSubjects"
      [filter]="true"
      optionValue="key"
      optionLabel="value"
      name="examSubject"
      appendTo="body"
      [autoDisplayFirst]="false"
      [(ngModel)]="archiveFolder.examSubjectId"
      (onChange)="onExamSubjectChanged($event)"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !archiveFolder.examSubjectId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !archiveFolder.examSubjectId">
      Llojet e provimeve është fushë e kërkuar.
    </small>
  </div>

  <div class="flex justify-content-end" >
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Hap Dosjen"
      class="p-button w-auto"></button>
  </div>
</form>
