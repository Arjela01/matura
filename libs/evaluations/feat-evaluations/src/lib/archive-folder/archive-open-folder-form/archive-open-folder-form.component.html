<form #form="ngForm" (ngSubmit)="onOpen()">
  <div class="field">
    <label for="ExamType">Tipi i Provimit *</label>
    <p-dropdown
      id="ExamType"
      [options]="examTypes"
      optionValue="key"
      optionLabel="value"
      name="examTypeId"
      appendTo="body"
      [filter]="true"
      [required]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="archiveFolder.examTypeId"
      [showClear]="true"
      (onChange)="onExamTypeChanged($event)"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !archiveFolder.examTypeId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !archiveFolder.examTypeId">
      Tipi i provimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="ExamSubject">Lënda e Provimit *</label>
    <p-dropdown
      id="ExamSubject"
      [options]="examSubjects"
      [filter]="true"
      optionValue="key"
      optionLabel="value"
      name="examSubjectId"
      appendTo="body"
      [autoDisplayFirst]="false"
      [required]="true"
      [(ngModel)]="archiveFolder.examSubjectId"
      (onChange)="onExamSubjectChanged($event)"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !archiveFolder.examSubjectId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !archiveFolder.examSubjectId">
      Lënda e provimit është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label class="mb-3">Është Vjeshtë? *</label>
    <div class="form grid grid">
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallTrue"
          name="IsFallTrue"
          [value]="true"
          [(ngModel)]="archiveFolder.isFall"></p-radioButton>
        <label for="IsFallTrue">Po</label>
      </div>
      <div class="field-radiobutton col-6">
        <p-radioButton
          id="IsFallFalse"
          name="IsFall"
          [value]="false"
          [(ngModel)]="archiveFolder.isFall"></p-radioButton>
        <label for="IsFallFalse">Jo</label>
      </div>
    </div>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Hap Dosjen"
      class="p-button w-auto"></button>
  </div>
</form>
