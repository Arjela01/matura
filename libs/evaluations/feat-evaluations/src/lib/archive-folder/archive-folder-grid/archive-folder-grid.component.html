<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [value]="archiveFolders"
  [totalRecords]="totalRecords"
  [rows]="10"
  [paginator]="true"
  [rowsPerPageOptions]="[10, 20, 30]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  [(selection)]="selectedArchiveFolders"
  selectionMode="multiple"
  (onRowSelect)="onRowSelect($event)"
  (onRowUnselect)="onRowUnselect($event)"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="nr">
        Dosja
        <div>
          <p-sortIcon field="nr"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="nr"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="totalArchiveExams">
        Total
        <div>
          <p-sortIcon field="totalArchiveExams"></p-sortIcon>
          <p-columnFilter
            type="numeric"
            field="totalArchiveExams"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="examType">
        Tipi i Provimit
        <div>
          <p-sortIcon field="examType"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="examType"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="createdName">
        Operatori
        <div>
          <p-sortIcon field="createdName"></p-sortIcon>
          <p-columnFilter
            type="text"
            field="createdName"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th pSortableColumn="status">
        Statusi
        <div>
          <p-sortIcon field="IsClosed"></p-sortIcon>
          <p-columnFilter
            type="number"
            field="IsClosed"
            display="menu"></p-columnFilter>
        </div>
      </th>
      <th colspan="3" style="text-align: center">Veprime</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-archiveFolder>
    <tr>
      <td style="width: 14%; min-width: 10rem">
        <a
          pTooltip="Shiko Dosjen"
          tooltipPosition="bottom"
          [routerLink]="['/evaluations', 'archive-view', archiveFolder.id]">
          {{ this.archiveFolder.nr }}
        </a>
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveFolder.totalArchiveExams }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveFolder.examTypeName }}
      </td>
      <td style="width: 14%; min-width: 10rem">
        {{ archiveFolder.createdByName }}
      </td>

      <td style="width: 14%; min-width: 10rem">
        <span
          [ngClass]="
            archiveFolder.isClosed === true
              ? ['bg-red-300', 'red-text', 'px-3', 'py-1', 'fb']
              : ['bg-green-300', 'green-text', 'px-3', 'py-1', 'fb']
          ">
          {{ archiveFolder.isClosed === true ? 'Mbyllur' : 'Hapur' }}
        </span>
      </td>
      <td>
        <div [hidden]="archiveFolder.isClosed">
          <div class="flex">
            <a
              [routerLink]="[
                '/evaluations',
                'archive-exams',
                archiveFolder.id
              ]">
              <img
                src="assets/svg/qr-code.svg"
                class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
                tooltipPosition="bottom"
                (click)="persistArchiveFolder(archiveFolder)"
                pTooltip="Hidh Barkode" />
            </a>
          </div>
        </div>
      </td>
      <td style="width: 14%; min-width: 10rem">
        <div class="flex">
          <button
            pButton
            pRipple
            class="file-unlock"
            (click)="changeStatus(archiveFolder)"
            icon="{{
              !archiveFolder.isClosed ? 'pi pi-lock-open' : 'pi pi-lock'
            }}">
            &nbsp;
            {{ !archiveFolder.isClosed ? 'Mbyll Dosjen' : 'Hap Dosjen' }}
          </button>
        </div>
      </td>
      <td>
        <div>
          <div class="flex">
            <img
              src="assets/svg/delete-form.svg"
              class="p-button-rounded p-button-danger p-button-text pointer"
              pTooltip="Fshi"
              tooltipPosition="bottom"
              (click)="onDeleteClick(archiveFolder)" />
          </div>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
