<div class="grid">
  <div class="col-12">
    <div class="mb-2">
      <div class="flex justify-content-between">
        <div>
          <h2 class="mb-0">
            Dosja: {{ archiveFolder.nr }} | {{ archiveFolder.examTypeName }} :
            {{ archiveFolder.examSubjectName }}
            {{ archiveFolder.isFall ? '| Vjeshtë' : '' }}
          </h2>
        </div>
        <div>
          <button
            pButton
            pRipple
            label="Kthehu"
            icon="pi pi-arrow-left"
            class="w-auto mr-2 back-button"
            (click)="goBack()"></button>

          <button
            pButton
            [ngStyle]="{
              'background-color': archiveFolder.isClosed
                ? '#c8e6c9'
                : '#feedaf',
              color: archiveFolder.isClosed ? '#256029' : '#8a5340',
            }"
            label="{{ archiveFolder.isClosed ? 'Mbyllur ' : 'Hapur' }}"
            icon="{{
              !archiveFolder.isClosed ? 'pi pi-folder-open' : 'pi pi-folder'
            }}"
            class="p-button-danger mr-2"></button>

          <button
            pButton
            pRipple
            label="{{ totalRecords }}/50"
            icon="pi pi-database"
            disabled
            class="p-button-danger mr-2"></button>
        </div>
      </div>
    </div>
    <div class="card mt-4">
      <div>
        <p-table
          #dt
          dataKey="id"
          responsiveLayout="scroll"
          [scrollable]="true"
          scrollHeight="820px"
          [value]="archiveExams"
          [totalRecords]="totalRecords"
          [rows]="10"
          [paginator]="totalRecords !== 50"
          [rowsPerPageOptions]="[10, 20, 30]"
          [showCurrentPageReport]="true"
          currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
          [rowHover]="true"
          selectionMode="multiple"
          (onLazyLoad)="loadRows($event)"
          [lazy]="true"
          [sortField]="'index'"
          [sortOrder]="1">
          <ng-template pTemplate="header">
            <tr>
              <th pSortableColumn="index">
                Numri
                <p-sortIcon field="index"></p-sortIcon>
                <p-columnFilter
                  type="numeric"
                  field="index"
                  display="menu"></p-columnFilter>
              </th>
              <th pSortableColumn="barcode">
                Barkodi
                <p-sortIcon field="barcode"></p-sortIcon>
                <p-columnFilter
                  type="text"
                  field="barcode"
                  display="menu"></p-columnFilter>
              </th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-archiveExam>
            <tr>
              <td style="width: 5%; min-width: 10rem">
                {{ archiveExam.index }}
              </td>
              <td>
                {{ archiveExam.barcode }}
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
</div>
