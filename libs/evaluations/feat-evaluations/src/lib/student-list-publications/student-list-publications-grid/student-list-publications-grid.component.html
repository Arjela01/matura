<div class="flex mb-2 page-header center justify-content-between mb-header">
  <h2 class="mb-0">Publikim i Listës së Maturantëve</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <p-button
        type="button"
        icon="pi pi-sync"
        styleClass="p-button-link"
        (click)="generateNewPublication()"
        [label]="'Gjenero një Publikim të Ri'"></p-button>
    </div>
  </div>
</div>

<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="records"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="publishDate">
        Data e Krijimit
        <p-sortIcon field="createdOn"></p-sortIcon>
        <p-columnFilter
          type="date"
          field="createdOn"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="isPublished">
        Publikuar?
        <p-sortIcon field="isPublished"></p-sortIcon>
        <p-columnFilter
          type="boolean"
          field="isPublished"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="publishDate">
        Data e Publikimit
        <p-sortIcon field="publishDate"></p-sortIcon>
        <p-columnFilter
          type="date"
          field="publishDate"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-record>
    <tr>
      <td style="width: 25%">
        <a (click)="onRowClick(record)" class="btn btn-link cursor-pointer">
          {{ record.createdOn | date : 'dd/MM/yyyy' }}
        </a>
      </td>
      <td style="width: 25%">
        {{ record.isPublished ? 'Po' : 'Jo' }}
      </td>
      <td style="width: 25%">
        {{ record.publishDate | date : 'dd/MM/yyyy' }}
      </td>
      <td style="width: 25%">
        {{ record.questionMaximumScore }}
      </td>
    </tr>
  </ng-template>
</p-table>
