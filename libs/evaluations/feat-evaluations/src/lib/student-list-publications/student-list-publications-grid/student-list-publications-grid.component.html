<div class="flex mb-2 page-header center justify-content-between mb-header">
  <h2 class="mb-0">Publikim i Listës së Maturantëve</h2>
</div>

<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="examQuestions"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="questionIndex">
        Pyetja e Provimit
        <p-sortIcon field="questionIndex"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="questionIndex"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="questionSection">
        Nënseksioni
        <p-sortIcon field="questionSection"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="questionSection"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="questionIndex">
        Pikët
        <p-sortIcon field="questionIndex"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="questionIndex"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examQuestion>
    <tr>
      <td style="width: 25%">
        {{ examQuestion.index }}
      </td>
      <td style="width: 25%">
        {{ examQuestion.section }}
      </td>
      <td style="width: 25%">
        {{ examQuestion.questionMaximumScore }}
      </td>
      <td style="width: 25%">
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examQuestion)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examQuestion)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
