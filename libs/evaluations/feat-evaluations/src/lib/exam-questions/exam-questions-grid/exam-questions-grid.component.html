<p-table
  #dt
  dataKey="id"
  responsiveLayout="scroll"
  [scrollable]="true"
  scrollHeight="820px"
  [value]="examQuestions"
  [totalRecords]="totalRecords"
  [rows]="100"
  [paginator]="true"
  [rowsPerPageOptions]="[100, 200, 300]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Shfaqen {first} deri {last} nga {totalRecords} rekorde"
  [rowHover]="true"
  selectionMode="multiple"
  (onLazyLoad)="loadRows($event)"
  [lazy]="true">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="examVariantName">
        Varianti i Provimit
        <p-sortIcon field="examVariantName"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="examVariantName"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="questionIndex">
        Pyetja e Provimit
        <p-sortIcon field="questionIndex"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="questionIndex"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>

      <th pSortableColumn="questionIndex">
        Piket
        <p-sortIcon field="questionIndex"></p-sortIcon>
        <p-columnFilter
          type="text"
          field="questionIndex"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th pSortableColumn="questionMaximumScore">
        Pikët maksimale
        <p-sortIcon field="questionMaximumScore"></p-sortIcon>
        <p-columnFilter
          type="numeric"
          field="questionMaximumScore"
          display="menu"
          mshColumnFilterDirective></p-columnFilter>
      </th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-examQuestion>
    <tr>
      <td style="width: 20%">
        {{ examQuestion.examVariantName }}
      </td>
      <td style="width: 20%">
        {{ examQuestion.index }}
      </td>
      <td style="width: 20%">
        {{ examQuestion.questionMaximumScore }}
      </td>
      <td style="width: 20%">
        {{ examQuestion.examVariantMaximumScore }}
      </td>
      <td>
        <div class="flex">
          <img
            src="assets/svg/edit-form.svg"
            class="p-button-rounded p-button-warning p-button-text mr-2 pointer"
            tooltipPosition="bottom"
            (click)="onEditClick(examQuestion)"
            pTooltip="Ndrysho" />

          <img
            src="assets/svg/delete-form.svg"
            class="p-button-rounded p-button-danger p-button-text ml-m pointer"
            pTooltip="Fshi"
            tooltipPosition="bottom"
            (click)="onDeleteClick(examQuestion)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
