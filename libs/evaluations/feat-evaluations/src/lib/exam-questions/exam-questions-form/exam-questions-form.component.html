  <div class="field">
    <label for="Name">Pyetja *</label>
    <input
      type="text"
      pInputText
      id="Name"
      name="Name"
      [(ngModel)]="examQuestion.index"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examQuestion.index
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examQuestion.index">
      Emri është fushë e kërkuar.
    </small>
  </div>

  <div class="field">
    <label for="MaximumValueWritingScore">Pikët *</label>
    <input
      type="text"
      pInputText
      id="maximumValueWritingScore"
      name="maximumValueWritingScore"
      [(ngModel)]="examQuestion.questionMaximumScore"
      required
      autofocus
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examQuestion.questionMaximumScore
      }" />
    <small
      class="p-error block"
      *ngIf="submitted && !examQuestion.questionMaximumScore">
      Pikët maksimale është fushë e kërkuar.
    </small>
  </div>
  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      [disabled]="form.invalid"
      type="submit"
      pButton
      label="Ruaj"
      class="p-button w-auto"></button>
  </div>
</form>
