<div>
  <div class="flex center mb-1 page-header mb-header">
    <h2 class="flex-1 mb-0">Pyetje Provimi</h2>
    <div class="flex align-items-right justify-content-right">
      <div class="my-2">
        <p-button
          type="button"
          icon="pi pi-arrow-left"
          styleClass="p-button-link"
          (click)="onBackButtonClick()"
          [label]="'Kthehu'"></p-button>
        <button
          pButton
          pRipple
          label="Shto"
          icon="pi pi-plus"
          class="p-button-success ml-3"
          (click)="onNewClick()"></button>
      </div>
    </div>
  </div>
  <div class="mb-5">
    <div>
      <h6>
        Varianti i Provimit:
        <span class="text-blue-500 font-bold">{{ this.examVariantName }}</span>
      </h6>
      <h6 class="mt-0">
        Tipi dhe Lënda e Provimit:
        <span class="text-blue-500 font-bold">{{
          this.examTypeAndSubject
        }}</span>
      </h6>
    </div>
    <div class="flex">
      <h6 class="mt-0">
        Pikët Maksimale:
        <span class="text-blue-500 font-bold">{{
          this.examVariantMaximumScore
        }}</span>
      </h6>
      <h6 class="mt-0 ml-5">
        Pikët e hedhura:
        <span class="text-blue-500 font-bold">{{
          this.examVariantRecordedScore
        }}</span>
      </h6>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-exam-question-grid
        [examQuestions]="(examQuestions$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamQuestions($event)">
      </msh-exam-question-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '500px' }"
  header="Detajet e pyetjes së provimit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-exam-question-form
      [examQuestionDetails]="selectedExamQuestion"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-exam-question-form>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
