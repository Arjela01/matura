<form #form="ngForm" (ngSubmit)="onRefuse()">
  <div class="field">
    <label for="comments">Arsyeja *</label>
    <textarea
      pInputTextarea
      id="comments"
      name="comments"
      [(ngModel)]="examCopy.comments"
      rows="5"
      autofocus>
    </textarea>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Kthehu"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="submit"
      pButton
      label="Refuzo"
      class="p-button w-auto mr-2"></button>
  </div>
</form>
