<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="text-xl mt-2 mb-2 font-bold">Të dhënat e maturantit</div>
  <div class="grid">
    <div class="field col-2">
      <label for="subject">Emri *</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.firstName"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Mbiemri *</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.lastName"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Email *</label>
      <input
        type="text"
        disabled
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.email"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Gjinia *</label>
      <input
        type="text"
        pInputText
        id="subject"
        disabled
        name="subject"
        [value]="examCopy.gender"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Dar/Za *</label>
      <input
        type="text"
        pInputText
        id="subject"
        disabled
        name="subject"
        [value]="examCopy.administrationOffice"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Atësia</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.fatherName"
        disabled
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Vendlindja</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.placeOfBirth"
        disabled
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Qyteti</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.city"
        disabled
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Njësia Bashkiake</label>
      <input
        type="text"
        pInputText
        id="subject"
        disabled
        name="subject"
        [value]="examCopy.municipalityUnit"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Numri Fiks</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.telFix"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Shkolla</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.schoolName"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Shënime</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.remarks"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Datëlindje</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.dateOfBirth | date"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Shtetësia</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.nationality"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Rrethi</label>
      <input
        type="text"
        pInputText
        id="subject"
        disabled
        name="subject"
        [value]="examCopy.region"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Id e Maturantit</label>
      <input
        type="text"
        pInputText
        id="subject"
        disabled
        name="subject"
        [value]="examCopy.maturaId"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">NID</label>
      <input
        type="text"
        pInputText
        id="subject"
        disabled
        name="subject"
        [value]="examCopy.nid"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Adresa</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.address"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Kodi Postar</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.postalCode"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Nr. Cel</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.cel"
        autofocus />
    </div>
  </div>

  <div class="text-xl mt-2 mb-2 font-bold">Të dhënat e aplikimit</div>
  <div>
  <div class="grid">
    <div class="field col-2">
      <label for="subject">Numër Aplikimi</label>
      <input
        type="text"
        pInputText
        id="subject"
        disabled
        name="subject"
        [value]="examCopy.applicationId"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Datë aplikimi</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.dateCreated | date"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Afati i Vendimit</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.decisionDueDate | date"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Statusi</label>
      <div
        [ngClass]="
          examCopy.status === 3
            ? ['bg-red-300', 'red-text', 'px-6', 'py-3', 'fb']
            : examCopy.status === 2
            ? ['bg-green-300', 'green-text', 'px-6', 'py-3', 'fb']
            : ['bg-yellow-300', 'yellow-text', 'px-6', 'py-3', 'fb']
        ">
        {{
          examCopy.status === 1
            ? 'Draft'
            : examCopy.status === 2
            ? 'Pranuar'
            : 'Refuzuar'
        }}
      </div>
    </div>
    <div class="field col-2">
      <label for="subject">Datë Vendimi</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        disabled
        [value]="examCopy.decisionDate | date"
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Komente</label>
      <input
        type="text"
        pInputText
        disabled
        id="subject"
        name="subject"
        [value]="examCopy.comments"
        autofocus />
    </div>
  </div>
    <div class="flex justify-content-end">
    <div *ngIf="examCopy.status === 2" class="field col-2 mt-2 mb-0 sm:mr-0" style="display:contents">
      <button
        pButton
        pRipple
        icon="pi pi-download"
        label="Shkarko"
        (click)="downloadFile(examCopy.attachedDocument)"></button>
    </div>
    </div>

  </div>

  <div *ngIf="examCopy.status === 1" class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      type="button"
      pButton
      label="Refuzo"
      class="p-button-text w-auto mr-2"
      (click)="onRefuse()"></button>
    <button
      type="button"
      pButton
      (click)="onConfirm()"
      label="Aprovo"
      class="p-button w-auto"></button>
  </div>
</form>

<p-dialog
  [(visible)]="confirmModal"
  [style]="{ width: '800px' }"
  header="Ngarko Kopjen e Tezës"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onConfirmModalClose()">
  <ng-template pTemplate="content">
    <msh-approve-exam-copy [examCopyDetails]="examCopy">
    </msh-approve-exam-copy>
  </ng-template>
</p-dialog>

<p-dialog
  [(visible)]="refuseModal"
  [style]="{ width: '800px' }"
  header="Arsyeja e Refuzimit"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onRefuseModalClose()">
  <ng-template pTemplate="content">
    <msh-refuse-exam-copy [examCopyDetails]="examCopy"> </msh-refuse-exam-copy>
  </ng-template>
</p-dialog>
