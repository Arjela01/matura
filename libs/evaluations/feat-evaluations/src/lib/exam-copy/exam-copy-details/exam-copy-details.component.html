<form #form="ngForm" (ngSubmit)="onSubmit()">
  <div class="w-auto mb-2">Te dhenat e maturantit</div>
  <div class="grid">
    <div class="field col-2">
      <label for="subject">Emri *</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.firstName"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Mbiemri *</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.lastName"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Email *</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.email"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Gjinia *</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.gender"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Dar/Za *</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.administrationOffice"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Atesia</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.fatherName"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Vendlindja</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.placeOfBirth"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Qyteti</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.city"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Njesia Bashkiake</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.municipalityUnit"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Numri Fiks</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.telFix"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Shkolla</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.schoolName"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Shenime</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.remarks"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Datelindje</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.dateOfBirth"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Shtetesia</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.nationality"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Rrethi</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.region"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Id e Maturantit</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.maturaId"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">NID</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.nid"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Adresa</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.address"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Kodi Postar</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.postalCode"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Nr. Cel</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.cel"
        disabled
        required
        autofocus />
    </div>
  </div>

  <div>Te dhenat e aplikimit</div>
  <div class="grid">
    <div class="field col-2">
      <label for="subject">Numer Aplikimi</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.applicationId"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Date aplikimi</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.decisionDate"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Afati i Vendimit</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.decisionDate"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Statusi</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.status"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Date Vendimi</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.decisionDate"
        disabled
        required
        autofocus />
    </div>
    <div class="field col-2">
      <label for="subject">Komente</label>
      <input
        type="text"
        pInputText
        id="subject"
        name="subject"
        [value]="examCopy.comments"
        disabled
        required
        autofocus />
    </div>
    <div *ngIf="examCopy.status === 1" class="field col-2">
      <label for="subject">Komente</label>
      <a [href]="examCopy.attachedDocument" [download]="examCopy.documentName">
        {{ examCopy.documentName }}
      </a>
    </div>
  </div>

  <div class="flex justify-content-end">
    <button
      type="button"
      pButton
      label="Anullo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      *ngIf="examCopy.status === 0"
      type="button"
      pButton
      label="Refuzo"
      class="p-button-text w-auto mr-2"
      (click)="onCancelClick()"></button>
    <button
      *ngIf="examCopy.status === 0"
      type="submit"
      pButton
      label="Aprovo"
      class="p-button w-auto"></button>
  </div>
</form>
