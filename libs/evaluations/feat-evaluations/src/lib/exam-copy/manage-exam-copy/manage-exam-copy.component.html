<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Aplikimet për kopje testi</h2>
  <div class="flex align-items-right justify-content-right"></div>
  <div class="my-2 ml-2">
    <button pRipple icon="pi pi-download" pButton label="Shkarko Template" (click)="downloadTemplateFile()"></button>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-exam-copy-grid
        [examCopies]="(examCopies$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getExamCopies($event)">
      </msh-exam-copy-grid>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '1000px' }"
  header="Detajet për aplikimin e marrjes së kopjes së testit të maturës"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-exam-copy-details
      [examCopyDetails]="selecetdExamCopy"
      (formClose)="onModalClose()"
      (formSave)="onFormSave($event)">
    </msh-exam-copy-details>
  </ng-template>
</p-dialog>

<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
