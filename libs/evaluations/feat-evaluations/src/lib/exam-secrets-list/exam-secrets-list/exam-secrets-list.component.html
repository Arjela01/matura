<table>
  <thead>
  <tr>
    <th>Qender Provimi</th>
    <th>Tip Provimi</th>
    <th>Data e Provimit</th>
    <th>Lenda e Provimit</th>
    <th>Maturanti i Caktuar</th>
    <th>Barkodi</th>
    <th>Vjeshte</th>

  </tr>
  </thead>
  <tbody>

  <tr *ngFor="let rowData of examSecretLists">
    <td>{{ rowData.examSiteName }}</td>
    <td>{{ rowData.examTypeName }}</td>
    <td>{{ rowData.examTypeDateTime }}</td>
    <td>{{ rowData.examSubjectName }}</td>

    <td>{{ rowData.studentName }}</td>

    <td>{{ rowData.barcode }}</td>
    <td>{{ rowData.isFall ? 'Po' : 'Jo' }}</td>
  </tr>
  </tbody>

</table>
<p-paginator
  [rows]="10"
  [totalRecords]="totalRecords"
  (onPageChange)="onPageChange($event)">
</p-paginator>
