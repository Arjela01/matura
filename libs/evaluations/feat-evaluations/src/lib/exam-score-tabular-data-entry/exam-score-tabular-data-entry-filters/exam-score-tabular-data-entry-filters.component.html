<form #form="ngForm" class="dropdown-row" (ngSubmit)="onSubmit()">
  <div class="field colmn">
    <label for="archiveFolder">Dosja *</label>
    <p-dropdown
      id="archiveFolder"
      [options]="archiveFolder"
      optionValue="key"
      optionLabel="value"
      name="archiveFolderId"
      appendTo="body"
      [filter]="true"
      [required]="true"
      [autoDisplayFirst]="false"
      (onChange)="onArchiveFolderChanged()"
      (onClear)="onArchiveFolderChanged()"
      [(ngModel)]="examScoreList.archiveFolderId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examScoreList.archiveFolderId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examScoreList.archiveFolderId">
      Dosja është fushë e kërkuar.
    </small>
  </div>
  <div class="text-center">
    <button pButton class="btn btn-primary" type="submit">Kërko</button>
  </div>
</form>
