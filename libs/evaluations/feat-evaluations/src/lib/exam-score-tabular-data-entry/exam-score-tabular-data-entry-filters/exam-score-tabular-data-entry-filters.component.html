<form #form="ngForm" class="dropdown-row" (ngSubmit)="onSubmit()">
  <div class="field colmn">
    <label for="examType">Tipi i Provimit *</label>
    <p-dropdown
      id="examType"
      [options]="examType"
      optionValue="key"
      optionLabel="value"
      name="examType"
      appendTo="body"
      [filter]="true"
      [required]="true"
      [autoDisplayFirst]="false"
      (onChange)="onExamTypeChanged()"
      (onClear)="onExamTypeChanged()"
      [(ngModel)]="examScoreList.examTypeId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examScoreList.examTypeId
      }">
    </p-dropdown>
    <small class="p-error block" *ngIf="submitted && !examScoreList.examTypeId">
      Tipi i Provimit është fushë e kërkuar.
    </small>
  </div>
  <div class="field colmn">
    <label for="archiveFolder">Dosja *</label>
    <p-dropdown
      id="archiveFolder"
      [options]="archiveFolder"
      optionValue="key"
      optionLabel="value"
      name="archiveFolderId"
      appendTo="body"
      (onChange)="onSubmit()"
      [filter]="true"
      [required]="true"
      [autoDisplayFirst]="false"
      [(ngModel)]="examScoreList.archiveFolderId"
      [showClear]="true"
      [ngClass]="{
        'ng-invalid ng-dirty': submitted && !examScoreList.archiveFolderId
      }">
    </p-dropdown>
    <small
      class="p-error block"
      *ngIf="submitted && !examScoreList.archiveFolderId">
      Dosja është fushë e kërkuar.
    </small>
  </div>
  <div class="text-center">
    <button pButton class="btn btn-primary mt-2" type="submit">Kërko</button>
  </div>
</form>
