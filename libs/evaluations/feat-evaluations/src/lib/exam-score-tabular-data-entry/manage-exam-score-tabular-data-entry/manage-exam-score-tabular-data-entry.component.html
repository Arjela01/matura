<div>
  <h2 class="flex-1 mb-0">Hidh pikët sipas barkodit të dosjes</h2>
  <div class="mt-4">
    <msh-exam-score-tabular-data-entry-filters
      (formSave)="getExamScoresListById($event)"
      (archiveFolderChanged)="getArchiveFolders($event)"
      [archiveFolder]="archiveFolder"
      [examType]="examType"></msh-exam-score-tabular-data-entry-filters>
  </div>
  <div class="mt-4">
    <msh-exam-score-tabular-data-entry-list
      [examScoreLists]="(examScoreList$ | async) || []"
      [totalRecords]="totalRecords"
      (gridEvent)="onGridEvent($event)"
      (writingScoreChange)="saveWritingScoreChanges($event)"
      [examSubjectName]="examSubjectName"
      [examTypeName]="examTypeName"></msh-exam-score-tabular-data-entry-list>
  </div>
</div>
<p-confirmDialog
  #cd
  header="Konfirmo"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '450px' }">
  <ng-template pTemplate="footer">
    <button
      type="button"
      pButton
      icon="pi pi-times"
      label="Jo"
      class="p-button-text"
      (click)="cd.reject()"></button>
    <button
      type="button"
      pButton
      icon="pi pi-check"
      label="Po"
      class="p-button border"
      (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>
