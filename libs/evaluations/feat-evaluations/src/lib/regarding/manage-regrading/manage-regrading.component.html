<div class="flex center mb-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Rivlerësim/Korrigjim</h2>
  <div class="flex align-items-right justify-content-right">
    <div class="my-2">
      <button
        pRipple
        icon="pi pi-download"
        pButton
        label="Shkarko"
        (click)="downloadTemplateFile()"></button>
      <button
        pButton
        pRipple
        class="ml-2"
        icon="pi pi-upload"
        label="Ngarko"
        (click)="onUploadClick()"></button>
    </div>
  </div>
</div>
<div class="grid">
  <div class="col-12">
    <div class="card">
      <msh-regrading-grid
        [userRole]="userRole"
        [regrading]="(regrading$ | async) || []"
        [totalRecords]="totalRecords"
        (gridEvent)="onGridEvent($event)"
        (lazyLoadData)="getGrade($event)">
      </msh-regrading-grid>
    </div>
  </div>
</div>
<p-dialog
  [(visible)]="displayUploadModal"
  [style]="{ width: '600px' }"
  [modal]="true"
  header="Importo Dokument nga Exel"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  class="p-fluid"
  (onHide)="onUploadClose()">
  <ng-template pTemplate="content">
    <msh-upload
      [gradeDetails]="selectedGrade"
      (formClose)="onUploadClose()"
      (formSave)="onUploadClose()">
    </msh-upload>
  </ng-template>
</p-dialog>

<p-dialog
  [(visible)]="displayStatusModal"
  [style]="{ width: '500px' }"
  header="Ndrysho Statusin"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-update-status-form
      [details]="selectedGrade"
      [statuses]="statuses"
      (formClose)="onUpdateModalClose()"
      (formSave)="onStatusUpdate($event)">
    </msh-update-status-form>
  </ng-template>
</p-dialog>

<p-dialog
  [(visible)]="displayModal"
  [style]="{ width: '90%' }"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  class="p-fluid"
  (onHide)="onModalClose()">
  <ng-template pTemplate="content">
    <msh-manage-exam-grade-changes [examGradeId]="examGradeId">
    </msh-manage-exam-grade-changes>
  </ng-template>
</p-dialog>

<ng-container *ngIf="academicYear$ | async"></ng-container>
