<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card">
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <label>Statusi i aplikimit *</label>
          <p-dropdown
            id="status"
            name="status"
            [options]="statuses"
            optionValue="key"
            optionLabel="value"
            [required]="true"
            [filter]="true"
            [(ngModel)]="regradingStatus.status"
            [ngClass]="{
              'ng-invalid ng-dirty': submitted && !regradingStatus.status,
            }">
          </p-dropdown>
          <small
            class="p-error block"
            *ngIf="submitted && !regradingStatus.status">
            Statusi është fushë e kërkuar.
          </small>
        </div>

        <div class="field">
          <label for="comments">Komente</label>
          <textarea
            type="text"
            pInputTextarea
            id="comments"
            [disabled]="regradingStatus.status === 1"
            name="comments"
            [(ngModel)]="regradingStatus.comments"
            rows="5"
            autofocus></textarea>
        </div>

        <div class="flex justify-content-end">
          <button
            type="button"
            pButton
            label="Anullo"
            class="p-button-text w-auto mr-2"
            (click)="onCancelClick()"></button>
          <button
            [disabled]="form.invalid || regradingStatus.status === 1"
            type="submit"
            pButton
            label="Ruaj"
            class="p-button w-auto"></button>
        </div>
      </form>
    </div>
  </div>
</div>
