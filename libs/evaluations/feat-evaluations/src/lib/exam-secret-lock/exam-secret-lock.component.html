<div class="flex center mb-5 mt-2 page-header mb-header">
  <h2 class="flex-1 mb-0">Kontrollet e Sekretimit</h2>
</div>
<div class="grid">
  <div class="col-12 p-fluid">
    <div class="card-form px-6 py-6">
      <ng-container *ngIf="examSecret$">
        <div class="col-6">
          <table id="my-table-2">
            <thead>
              <tr>
                <th style="width: 10px">Tipi</th>
                <th style="width: 5px">Vjeshtë?</th>
                <th style="width: 30px">Mbaroi Hedhja e Sekretimit?</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let examSecretLock of (examSecret$ | async) || []">
                <td class="font-semibold">{{ examSecretLock.examTypeName }}</td>
                <td class="font-semibold">
                  {{ examSecretLock.isFall === true | app_bool }}
                </td>
                <td>
                  <p-inputSwitch
                    class="center-content"
                    [(ngModel)]="examSecretLock.isSecretDataEntryCompleted"
                    (onChange)="onToggleExamSecretLock(examSecretLock)">
                  </p-inputSwitch>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </ng-container>
    </div>
  </div>
</div>
