<div class="grid mb-header">
  <div class="col-12">
    <div class="card px-3 py-3" style="background: white">
      <h4>Njoftime</h4>
    </div>
    <div class="grid" style="margin: auto">

      <div class="col-12 md:col-6 lg:col-3">
        <div class="surface-card p-3 border-round mx-h">
          <div class="flex align-items-center justify-content-start">
            <div
              class="flex align-items-center justify-content-center bg-blue-100 border-round"
              style="width: 5rem; height: 5rem">
              <i class="pi pi-users text-blue-500 text-5xl"></i>
            </div>
            <div>
              <div class="p ml-4">
                <span class="block text-500 font-medium mb-3">Totali</span>
                <div class="text-900 font-medium text-xl">19575</div>
                <span class="text-green-500 font-medium">53 studente </span>
                <span class="text-500">regjistruar së fundmi</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 md:col-6 lg:col-3">
        <div class="surface-card p-3 border-round mx-h">
          <div class="flex align-items-center justify-content-start">
            <div
              class="flex align-items-center justify-content-center bg-orange-100 border-round"
              style="width: 5rem; height: 5rem">
              <i class="pi pi-arrows-h text-orange-500 text-5xl"></i>
            </div>
            <div>
              <div class="p ml-4">
                <span class="block text-500 font-medium mb-3">Gjinia</span>
                <span class="text-green-500 font-medium">64 </span>
                <span class="text-500">Meshkuj</span>
                <br />
                <span class="text-green-500 font-medium">54 </span>
                <span class="text-500">Femra</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 md:col-6 lg:col-3">
        <div class="surface-card p-3 border-round mx-h">
          <div class="flex align-items-center justify-content-start">
            <div
              class="flex align-items-center justify-content-center bg-cyan-100 border-round"
              style="width: 5rem; height: 5rem">
              <i class="pi pi-percentage text-cyan-500 text-5xl"></i>
            </div>
            <div>
              <div class="p ml-4">
                <span class="block text-500 font-medium mb-3">Përqindje</span>
                <div class="text-900 font-medium text-xl">37</div>
                <span class="text-green-500 font-medium">24 new </span>
                <span class="text-500">since last visit</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 md:col-6 lg:col-3">
        <div class="surface-card p-3 border-round mx-h">
          <div class="flex align-items-center justify-content-start">
            <div
              class="flex align-items-center justify-content-center bg-purple-100 border-round"
              style="width: 5rem; height: 5rem">
              <i class="pi pi-paperclip text-purple-500 text-5xl"></i>
            </div>
            <div>
              <div class="p ml-4">
                <span class="block text-500 font-medium mb-3">Aplikantë</span>
                <div class="text-900 font-medium text-xl">1192</div>
                <span class="text-green-500 font-medium">24 aplikime </span>
                <span class="text-500"> dy ditët e fundit</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        class="col-12 xl:col-4"
        *ngFor="let card of dashboardCards | slice : 0 : 3; let i = index">
        <p-card
          header="{{ card.dashboardSectionName }}"
          subheader="{{ card.title }}"
          [style]="{ width: '100%', height:'100%' }"
          styleClass="p-card-shadow">
          <ng-template pTemplate="header">
            <img
              alt="Card"
              src="assets/images/udhezime.svg"
              [style]="{ margin: 'auto', padding: '100px' }" />
          </ng-template>
          <p>{{ card.description }}</p>
          <p>{{ card.documentName }}</p>
          <ng-template pTemplate="footer">
            <!--            <p-button label="Save" icon="pi pi-check"></p-button>-->
            <!--            <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-secondary" [style]="{'margin-left': '.5em'}"></p-button>-->
          </ng-template>
        </p-card>
      </div>
    </div>
  </div>
</div>
